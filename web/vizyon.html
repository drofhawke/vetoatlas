<style>
:root {
  --zemin: #FBF8F1; --yuzey: #FFFFFF; --murekkep: #13213A; --murekkep-2: #5A6578; --cizgi: #E1DBCF; --vurgu: #A4262C;
  --u-sscb: #7E2F3C; --u-rus: #C2666F; --u-usa: #24507F; --u-gbr: #2F7A6E; --u-fra: #A8782A; --u-chn: #5E4E9A;
  --oy-lehte: #9AA3B2;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
}
:root[data-theme="dark"] {--zemin: #1C1A17; --yuzey: #272420; --murekkep: #EDE8E0; --murekkep-2: #ABA496; --cizgi: #3B3731; --vurgu: #E05A52;
    --u-sscb: #C2576A; --u-rus: #E89AA5; --u-usa: #5B8DC4; --u-gbr: #5FB09C; --u-fra: #D8A84A; --u-chn: #9B86D6; --oy-lehte: #8B94A3; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--zemin); color: var(--murekkep); font-family: var(--sans); font-size: var(--yz-govde); line-height: var(--sa-govde); }
.kap { max-width: 1180px; margin: 0 auto; padding: 0 24px 64px; }
a { color: inherit; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--murekkep); outline-offset: 2px; }
[hidden] { display: none !important; }
.giris { padding: 32px 0 8px; }
h1 { font-family: var(--serif); font-weight: 600; font-size: var(--yz-baslik); line-height: var(--sa-baslik); margin: 0 0 16px; }
.giris p { font-family: var(--serif); font-size: var(--yz-govde); line-height: var(--sa-govde); max-width: var(--olcu); margin: 0 0 12px; }
.giris p.ikincil { font-family: var(--sans); font-size: var(--yz-kucuk); color: var(--murekkep-2); line-height: var(--sa-kucuk); }
h2 { font-family: var(--serif); font-weight: 600; font-size: var(--yz-govde); line-height: var(--sa-govde); margin: 48px 0 8px; scroll-margin-top: 16px; }
.aciklama { color: var(--murekkep-2); font-size: var(--yz-kucuk); max-width: var(--olcu); margin: 0 0 16px; line-height: var(--sa-kucuk); }
.kutu { background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 6px; }

/* Söz ve kayıt: iki sütunlu satırlar; ekran okuyucu için tablo rolleri (table, row, columnheader, cell). Bağlantıyla gidilen
   satır yapışkan sütun başlıklarının altında kalmaz. */
.soz-kayit { margin: 0; padding: 0; }
.soz-satir { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 0; border-top: 1px solid var(--cizgi); scroll-margin-top: var(--b12); }
.soz-satir:first-child { border-top: none; }
.soz { padding: 24px 24px 24px 4px; }
.soz blockquote { margin: 0; padding-left: 16px; border-left: 2px solid var(--murekkep); font-family: var(--serif); font-size: var(--yz-govde); line-height: var(--sa-govde); }
.kunye { margin: 8px 0 0; font-size: var(--yz-kucuk); color: var(--murekkep-2); line-height: var(--sa-kucuk); }
.kunye b { color: var(--murekkep); font-weight: 600; font-variant-numeric: tabular-nums; }
.dil-notu { display: block; font-size: var(--yz-kucuk); color: var(--murekkep-2); margin-top: 4px; line-height: var(--sa-kucuk); }
.kayit-karsilik { padding: 24px 4px 24px 24px; border-left: 2px solid var(--cizgi); }
/* Sütun başlıkları (Söz ve Kayıt: Söz / Kayıt; Kitaptaki model: Unsur / Kitaptan): ikincil renk, küçük boyut, alt çizgili;
   liste kaydırılırken üst çubuğun altında yapışkan. Izgara ve yatay boşluklar altındaki satırlarla aynı (yan kenarlar kutunun
   1 px çerçevesi kadar). Hücrelerde etiket yok; 760 px altında başlıklar görünmez ama ekran okuyucuya açık kalır ve Söz ve
   Kayıt satırlarında kayıt bölümünün başında küçük "Kayıt" etiketi görünür (yalnızca görsel). */
.sutun-basliklari { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); position: sticky; top: 0; z-index: 2;
  margin: 0 0 var(--b2); background: var(--zemin); border: 1px solid transparent; border-top: 0; border-bottom-color: var(--cizgi);
  font: 600 var(--yz-kucuk)/var(--sa-kucuk) var(--sans); color: var(--murekkep-2); }
.c-cubuklu .sutun-basliklari { top: 76px; }
.sutun-basliklari > span { padding: var(--b2) var(--b6) var(--b2) var(--b1); }
.sutun-basliklari > span + span { padding: var(--b2) var(--b1) var(--b2) var(--b6); border-left: 2px solid transparent; }
.model-sutunlari > span, .model-sutunlari > span + span { padding: var(--b2) var(--b6); }
.sutun-etiketi { display: none; }
.kayit-karsilik p { margin: 0 0 8px; }
.kayit-karsilik .buyuk { font-family: var(--serif); font-size: var(--yz-baslik); line-height: var(--sa-baslik); font-weight: 600; font-variant-numeric: tabular-nums; }
.kayit-karsilik .ek { font-size: var(--yz-kucuk); color: var(--murekkep-2); line-height: var(--sa-kucuk); }
.kayit-karsilik table { font-size: var(--yz-kucuk); margin: 4px 0 8px; line-height: var(--sa-kucuk); }
.kayit-karsilik th, .kayit-karsilik td { padding: 4px 8px 4px 0; }

/* Üye renkleri */
.uyeler { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 4px 0 8px; padding: 0; list-style: none; font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); }
.uyeler li { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.nokta { width: 12px; height: 12px; border-radius: 2px; display: inline-block; flex: none; }

/* Tablolar */
.tablo-kap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); }
th, td { text-align: left; padding: 8px 12px; border-top: 1px solid var(--cizgi); vertical-align: top; }
thead th { border-top: none; font: 600 var(--yz-kucuk)/var(--sa-kucuk) var(--sans); color: var(--murekkep-2); }
td.sayi, th.sayi { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tbody th { font-weight: 600; }
tfoot td, tfoot th { font-weight: 600; }
.tablo-not { font-size: var(--yz-kucuk); color: var(--murekkep-2); margin: 8px 0 0; max-width: var(--olcu); line-height: var(--sa-kucuk); }

/* Galeri */
.galeri { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 12px; }
.kart { background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 6px; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px; }
.kart .karsi { font-family: var(--serif); font-size: var(--yz-baslik); font-weight: 600; line-height: var(--sa-baslik); }
.kart .karsi span { font-size: var(--yz-kucuk); font-family: var(--sans); font-weight: 400; color: var(--murekkep-2); display: block; margin-top: 4px; line-height: var(--sa-kucuk); }
.kart .tarih { font-size: var(--yz-kucuk); color: var(--murekkep-2); font-variant-numeric: tabular-nums; line-height: var(--sa-kucuk); }
.kart .noktalar { display: block; margin: 4px 0 4px; }
.galeri-dugme { font: inherit; font-size: var(--yz-kucuk); padding: 8px 16px; border: 1px solid var(--cizgi); border-radius: 4px; background: var(--yuzey); color: var(--murekkep); cursor: pointer; }
.kart .gundem { font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); }

/* Model ve zaman çizelgesi. Model kartları Söz ve Kayıt satırları gibi iki sütun (KILAVUZ bölüm 2, "Kartlar"): solda
   bölüm başlığı ve özet, sağda kitaptan alıntılar ve künyeleri alt alta; 760 px altında tek sütun. */
.model-kunye { margin: 0 0 var(--b3); font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); color: var(--murekkep-2); max-width: var(--olcu); }
.model { margin: 0; padding: 0; display: grid; gap: 12px; }
.model > .kutu { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
.model-ozet { padding: 24px; }
.model-alinti { padding: 24px; border-left: 2px solid var(--cizgi); }
.model h3 { font-family: var(--serif); font-size: var(--yz-govde); margin: 0 0 8px; line-height: var(--sa-govde); }
.model-ozet p { margin: 0; }
.model blockquote { margin: 0; padding-left: 16px; border-left: 2px solid var(--murekkep); font-family: var(--serif); }
.model-alinti .kunye { margin: 8px 0 0; }
.model-alinti .kunye + blockquote { margin-top: 24px; }
.cizelge { list-style: none; margin: 0; padding: 0 0 0 16px; border-left: 2px solid var(--cizgi); }
.cizelge li { position: relative; padding: 0 0 16px 16px; }
.cizelge li::before { content: ""; position: absolute; left: -24px; top: 8px; width: 12px; height: 12px; border-radius: 50%; background: var(--yuzey); border: 2px solid var(--murekkep-2); }
.cizelge time { display: block; font-size: var(--yz-kucuk); color: var(--murekkep-2); font-variant-numeric: tabular-nums; line-height: var(--sa-kucuk); }
.cizelge p { margin: 4px 0 0; max-width: var(--olcu); }
.cizelge .gk { font-size: var(--yz-kucuk); color: var(--murekkep-2); line-height: var(--sa-kucuk); }
@media (max-width: 760px) {
  body { font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); }
  .kap { padding: 0 16px 48px; }
  .soz-satir { grid-template-columns: minmax(0, 1fr); }
  .soz { padding: 16px 4px 12px; }
  .kayit-karsilik { border-left: none; border-top: 1px dashed var(--cizgi); padding: 12px 4px 16px; }
  .model > .kutu { grid-template-columns: 1fr; }
  .model-ozet { padding: 16px 16px 12px; }
  .model-alinti { border-left: none; border-top: 1px dashed var(--cizgi); padding: 12px 16px 16px; }
  .sutun-basliklari { position: absolute; width: 1px; height: 1px; margin: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .sutun-etiketi { display: block; margin: 0 0 var(--b2); font: 600 var(--yz-kucuk)/var(--sa-kucuk) var(--sans); color: var(--murekkep-2); }
}


details.tablo-ac > summary { cursor: pointer; font-size: var(--yz-kucuk); color: var(--murekkep-2); margin: 8px 0 8px; width: max-content; line-height: var(--sa-kucuk); }

.kap p, .kap dd, .kap blockquote, .kap ul:not([class]) > li, .kap ol:not([class]) > li { max-width: var(--olcu); }
.giris { padding-top: 64px; }
details.yontem { font-size: var(--yz-kucuk); max-width: var(--olcu); margin: 8px 0 0; line-height: var(--sa-kucuk); }
details.yontem summary { cursor: pointer; font-weight: 600; font-family: var(--sans); }
details.yontem p { font-family: var(--sans); font-size: var(--yz-kucuk); color: var(--murekkep-2); margin: 8px 0 0; line-height: var(--sa-kucuk); }
#sim-satir { color: var(--murekkep-2); font-size: var(--yz-kucuk); margin: 12px 0 0; line-height: var(--sa-kucuk); }


/* İçindekiler: girişin altında bölümlere bağlantılar (geniş ekranda iki sütun) */
.icindekiler { margin: var(--b6) 0 0; padding: var(--b3) var(--b4); background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 6px; font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); }
.icindekiler b { display: block; font-weight: 600; }
.icindekiler ul { margin: var(--b2) 0 0; columns: 2 288px; column-gap: var(--b8); }
.icindekiler li { break-inside: avoid; }

/* Sayfa üstü ve giriş (temel.css basamakları): üstte 48 px (dar ekranda 32 px), ilk bölüme 48 px */
.giris { padding: var(--b12) 0 var(--b12); }
@media (max-width: 760px) { .giris { padding-top: var(--b8); } }
</style>
</head>

  const tekBasina = (k) => k.oy && k.oy.aleyhte === 1 && k.oy.lehte + 1 === konseyBuyuklugu(k);
  const GK_BAS = "2022-04-26";
  const gazzeHedef = new Map((V.gazze || []).map((g) => [g.id, g.hedef]));
  const gazze = kayitlar.filter((k) => gazzeHedef.has(k.id));
  const BOLGE_EN = { "Ortadoğu ve Kuzey Afrika": "Middle East and North Africa", "Avrupa": "Europe", "Asya ve Pasifik": "Asia and the Pacific",
    "Afrika": "Africa", "Latin Amerika ve Karayipler": "Latin America and the Caribbean", "Küresel": "Global" };
  const bolgeAd = (b) => (DIL === "en" ? BOLGE_EN[b] || b : b);
  // 76/262 sonrası veto girişimi tartışmaları (her tartışma bir kez)
  const vgTartismalar = [...new Map(kayitlar.filter((k) => k.gk && k.gk.durum === "yapildi")
    .flatMap((k) => k.gk.tartismalar).filter((x) => x.tur === "veto_girisimi" && x.konusmacilar).map((x) => [x.id, x])).values()]
    .sort((a, b) => a.tarihler[0].localeCompare(b.tarihler[0]));
  const vetoEdenSozAldi = (x) => Object.values(x.konusmacilar.veto_eden_konustu).every((d) => d !== "hayir");
  const delegasyon = (x) => x.konusmacilar.aciklama_uye_devlet + x.konusmacilar.aciklama_gozlemci;

  // ---------- Söz ve kayıt ----------
  const alintilar = V.alintilar || [];
  // Söz ve Kayıt satırları: model bölümündeki kitap alıntıları ve hikâyenin giriş alıntısı (iliskili_veri "giris") hariç
  const konusmalar = alintilar.filter((a) => a.iliskili_veri !== "model" && a.iliskili_veri !== "giris");
  const kitap = alintilar.filter((a) => a.iliskili_veri === "model");
  // Künye, bütün sayfalarda ve kartlarda aynı sıra ve ayraçla (KILAVUZ bölüm 2, "Künye"): Cumhurbaşkanı Recep Tayyip Erdoğan
  // · etkinlik · tarih · s. N; kitapta … · Daha Adil Bir Dünya Mümkün · bölüm. İngilizcede resmî İngilizce metnin kaynağı:
  // kitapta İngilizce baskı (… · A Fairer World is Possible · bölüm · p. N), BM kaydında belge simgesi (A/74/PV.3, p. N).
  // Resmî İngilizcesi olmayan alıntıda künye Türkçe kaynağı gösterir (İngilizcede kitap adı ve bölüm İngilizce baskıdaki gibi).
  const KITAP = "Daha Adil Bir Dünya Mümkün", KITAP_EN = "A Fairer World is Possible";
  const kunye = (a) => {
    const kim = esc(t("kunyeKim"));
    const en = DIL === "en" && a.metin_en;
    if (a.bolum) return en ? `${kim} · ${KITAP_EN} · ${esc(a.bolum_en)} · ${t("sayfa", { s: a.basili_sayfa_en })}`
      : `${kim} · ${DIL === "tr" ? KITAP : KITAP_EN} · ${t("bolum", { b: esc(a.bolum) })}`;
    const oturum = (a.etkinlik.match(/(\d+)\./) || [])[1];
    const etk = DIL === "tr" ? a.etkinlik : (oturum === "74" ? t("etkinlik74") : t("etkinlik", { oturum }));
    const s = en ? a.basili_sayfa_en : a.basili_sayfa;
    return `${kim} · ${esc(etk)} · ${tarihUzun(a.tarih)} · ${en && a.belge_en ? `${esc(a.belge_en)}, ` : ""}${t("sayfa", { s })}`;
  };
  // İngilizcede resmî İngilizce metin; resmî İngilizcesi olmayan alıntıda Türkçe özgün metin ve altında işaretli gayriresmî
  // çeviri (METODOLOJI 2.7)
  const alintiMetni = (a) => (DIL === "tr" ? `<blockquote lang="tr">${esc(a.metin_tr)}</blockquote>`
    : a.metin_en ? `<blockquote lang="en">${esc(a.metin_en)}</blockquote>`
    : `<blockquote lang="tr">${esc(a.metin_tr)}</blockquote><p class="ceviri"><span class="dil-notu">${t("ceviriNotu")}:</span> ${esc(a.ceviri_en)}</p>`);
  // Yüzde işareti Türkçede sayının önünde (%18,3), İngilizcede arkasında (18.3%)
  const yuzde1 = (p) => { const s = (100 * p).toLocaleString(DIL === "tr" ? "tr-TR" : "en-GB", { minimumFractionDigits: 1, maximumFractionDigits: 1 }); return DIL === "tr" ? "%" + s : s + "%"; };
  const grupOzeti = () => {
    const T = window.TEMSIL_VERISI; if (!T) return "";
    return `<p>${t("k.grupOzet")}</p><details class="tablo-ac"><summary>${t("tabloGoster")}</summary>
      <div class="tablo-kap"><table><thead><tr><th scope="col">${t("k.grupBas")}</th><th scope="col" class="sayi">${t("k.nufusPayi")}</th><th scope="col" class="sayi">${t("k.koltukPayi")}</th></tr></thead>
      <tbody>${T.gruplar.map((g) => `<tr><th scope="row">${esc(g.ad[DIL])}</th><td class="sayi">${yuzde1(g.paylar.nufus_2023)}</td><td class="sayi">${yuzde1(g.koltuk.toplam_payi)} <span class="dil-notu">(${esc(t("k.koltukAyrim", { d: g.koltuk.daimi, s: g.koltuk.secilmis }))})</span></td></tr>`).join("")}</tbody></table></div></details>
      <p class="ek"><a href="temsil.html${DIL === "tr" ? "" : "?lang=" + DIL}">${t("k.temsilBak")}</a></p>`;
  };
  const KARSILIK = {
    toplam: (a) => `<p class="buyuk">${sayi(kayitlar.length)}</p>
      <p>${t("k.toplam", { n: sayi(kayitlar.length), oy: sayi(oySay(kayitlar)), tarih: tarihUzun(sonTarih) })}</p>
      <p class="ek">${t("k.toplamOnce", { n: sayi(kadar(a.tarih).length), oy: sayi(oySay(kadar(a.tarih))), tarih: tarihUzun(a.tarih) })}</p>`,
    filistin: (a) => {
      const konu = "Filistin ve Arap-İsrail meselesi";
      const K = kayitlar.filter((k) => k.konu === konu);
      return `<p class="buyuk">${sayi(K.length)}</p><p>${t("k.filistin", { n: sayi(K.length), konu: konuAd(konu) })}</p>${uyeListesi(uyeSay(K))}
        <p class="ek">${t("k.filistinOnce", { n: sayi(K.filter((k) => k.tarih <= a.tarih).length), tarih: tarihUzun(a.tarih) })}</p>`;
    },
    gk_tartismalari: (a) => {
      const K = kayitlar.filter((k) => k.tarih >= GK_BAS);
      const once = K.filter((k) => k.tarih <= a.tarih);
      const G = K.filter((k) => k.gk && k.gk.durum === "yapildi");
      const tart = new Map();
      G.forEach((k) => k.gk.tartismalar.forEach((x) => tart.set(x.id, x.tur)));
      const vg = [...tart.values()].filter((x) => x === "veto_girisimi").length;
      return `<p class="buyuk">${sayi(G.length)} / ${sayi(K.length)}</p>
        <p>${t("k.gk", { n: sayi(K.length), g: sayi(G.length), vg: sayi(vg), oo: sayi(tart.size - vg) })}</p>
        <p class="ek">${t("k.gkOnce", { n: sayi(once.length), g: sayi(once.filter((k) => k.gk && k.gk.durum === "yapildi").length), tarih: tarihUzun(a.tarih) })}</p>
        <p class="ek">${t("k.cekirdek")}</p>`;
    },
    konu_uye: () => {
      const c = {};
      acik(kayitlar).forEach((k) => (c[k.konu] = (c[k.konu] || 0) + k.uyeler.length));
      const ilk = Object.entries(c).sort((x, y) => y[1] - x[1]).slice(0, 3);
      return `<p>${t("k.konu")}</p>${ilk.map(([konu, oy]) => `<p><b>${esc(t("k.konuSatir", { konu: konuAd(konu), oy: sayi(oy) }))}</b></p>
        ${uyeListesi(uyeSay(kayitlar.filter((k) => k.konu === konu)))}`).join("")}<p class="ek"><a href="#h-konu">${t("k.bak")}</a></p>`;
    },
    bolge: () => {
      const c = {};
      kayitlar.forEach((k) => { c[k.bolge] = c[k.bolge] || { n: 0, oy: 0 }; c[k.bolge].n++; if (!k.kapali) c[k.bolge].oy += k.uyeler.length; });
      const sira = Object.keys(c).sort((x, y) => (x === "Küresel") - (y === "Küresel") || c[y].n - c[x].n || c[y].oy - c[x].oy);
      return `<p>${t("k.bolge", { n: sayi(kayitlar.length) })}</p><details class="tablo-ac"><summary>${t("tabloGoster")}</summary>
        <div class="tablo-kap"><table><thead><tr><th scope="col">${t("k.bolgeBas")}</th><th scope="col" class="sayi">${t("k.oneri")}</th><th scope="col" class="sayi">${t("k.retOyu")}</th></tr></thead>
        <tbody>${sira.map((b) => `<tr><th scope="row">${esc(bolgeAd(b))}</th><td class="sayi">${sayi(c[b].n)}</td><td class="sayi">${sayi(c[b].oy)}</td></tr>`).join("")}</tbody></table></div></details>
        <p class="ek">${t("k.bolgeNot", { kapali: sayi(kayitlar.filter((k) => k.kapali).length) })}</p>${grupOzeti()}`;
    },
    p5_nufus: () => {
      const T = window.TEMSIL_VERISI; if (!T) return "";
      const P = T.kumeler.find((x) => x.kod === "P5");
      return `<p class="buyuk">${yuzde1(P.paylar.nufus_2023)}</p>
        <p>${t("k.p5", { u: yuzde1(P.paylar.nufus_2023), d: yuzde1(P.paylar.nufus_2023_dunya), y63: yuzde1(P.paylar.nufus_1963) })}</p>
        <p class="ek">${t("k.p5Not")} <a href="temsil.html${DIL === "tr" ? "" : "?lang=" + DIL}">${t("k.temsilBak")}</a></p>`;
    },
    gk_konusmacilar: (a) => {
      const T = vgTartismalar, once = T.filter((x) => x.tarihler[0] <= a.tarih);
      const soz = T.filter(vetoEdenSozAldi).length;
      const az = T.reduce((m, x) => (delegasyon(x) < delegasyon(m) ? x : m)), cok = T.reduce((m, x) => (delegasyon(x) > delegasyon(m) ? x : m));
      const gunler = (x) => x.tarihler.map(tarihUzun).join(t("ve"));
      return `<p class="buyuk">${sayi(soz)} / ${sayi(T.length)}</p>
        <p>${t("k.konusmaci", { n: sayi(T.length), s: sayi(soz) })}</p>
        <p>${t("k.delegasyon", { az: sayi(delegasyon(az)), azT: gunler(az), cok: sayi(delegasyon(cok)), cokT: gunler(cok) })}</p>
        <p class="ek">${t("k.konusmaciOnce", { n: sayi(once.length), s: sayi(once.filter(vetoEdenSozAldi).length), tarih: tarihUzun(a.tarih) })}</p>
        <p class="ek">${t("k.konusmaciNot", { g: sayi(T.filter((x) => x.konusmacilar.kaynak === "bm_gunlugu").length) })}</p>`;
    },
    tek_ret: (a) => {
      const K = kayitlar.filter(tekBasina);
      return `<p class="buyuk">${sayi(K.length)}</p><p>${t("k.tek", { n: sayi(K.length) })}</p>
        <p class="ek">${t("k.tekOnce", { once: sayi(K.filter((k) => k.tarih <= a.tarih).length), sonra: sayi(K.filter((k) => k.tarih > a.tarih).length), tarih: tarihUzun(a.tarih) })}
        <a href="#h-galeri">${t("k.bak")}</a></p>`;
    },
    gazze: (a) => `<p class="buyuk">${sayi(gazze.length)}</p><p>${t("k.gazze", { n: sayi(gazze.length), d: gazze.filter((k) => gazzeHedef.get(k.id) === "sozlu_degisiklik").length })}</p>${uyeListesi(uyeSay(gazze))}
      <p class="ek">${t("k.gazzeOnce", { n: sayi(gazze.filter((k) => k.tarih <= a.tarih).length), tarih: tarihUzun(a.tarih) })} <a href="#h-gazze">${t("k.bak")}</a></p>`,
  };
  $("#soz-kayit").innerHTML = konusmalar.map((a) => `<div class="soz-satir" id="alinti-${esc(a.id)}" role="row">
      <div class="soz" role="cell">${alintiMetni(a)}<p class="kunye">${kunye(a)}</p></div>
      <div class="kayit-karsilik" role="cell"><p class="sutun-etiketi" aria-hidden="true">${t("sutun.kayit")}</p>${(KARSILIK[a.iliskili_veri] || (() => ""))(a)}</div>
    </div>`).join("");

  // ---------- Hitaplar arasında ----------
  // Dönem sınırları yalnızca Genel Kurul hitapları; kitap alıntısı (bölüm alanı dolu) sınır sayılmaz
  const hitaplar = [...new Set(konusmalar.filter((a) => !a.bolum).map((a) => a.tarih))].sort();
  const sonHitap = hitaplar[hitaplar.length - 1];
  const satirlar = hitaplar.filter((bas, i) => hitaplar[i + 1] || sonTarih > bas).map((bas) => {
    const son = hitaplar[hitaplar.indexOf(bas) + 1];
    const K = kayitlar.filter((k) => k.tarih > bas && (!son || k.tarih <= son));
    const donem = son ? `${tarihUzun(bas)} – ${tarihUzun(son)}` : `${t("aralik.sonra", { t: tarihUzun(bas) })} – ${tarihUzun(sonTarih)}`;
    return `<tr><th scope="row">${donem}</th><td class="sayi">${sayi(K.length)}</td><td class="sayi">${sayi(oySay(K))}</td><td>${uyeListesi(uyeSay(K))}</td></tr>`;
  });
  $("#aralik").innerHTML = `<thead><tr><th>${t("aralik.donem")}</th><th class="sayi">${t("aralik.oneri")}</th><th class="sayi">${t("aralik.oy")}</th><th>${t("aralik.uyeler")}</th></tr></thead>
    <tbody>${satirlar.join("")}</tbody>`;
  if (sonTarih <= sonHitap) $("#aralik").insertAdjacentHTML("afterend", `<p class="tablo-not">${t("aralik.sonNot", { son: tarihUzun(sonTarih), hitap: tarihUzun(sonHitap) })}</p>`);

  // ---------- Konu × üye ----------
  $("#konu-aciklama").textContent = t("konu.aciklama", { n: sayi(kayitlar.filter((k) => k.kapali).length) });
  const konular = V.meta.konular.filter((k) => kayitlar.some((x) => x.konu === k));
  const konuSatirlari = konular.map((konu) => {
    const c = uyeSay(kayitlar.filter((k) => k.konu === konu));
    const top = Object.values(c).reduce((s, n) => s + n, 0);
    return { konu, c, top };
  }).sort((a, b) => b.top - a.top);
  const genel = uyeSay(kayitlar);
  $("#konu-uye").innerHTML = `<thead><tr><th>${t("konu.konu")}</th>${SIRA.map((u) => `<th class="sayi"><span class="nokta" style="background:${UYELER[u].renk}"></span> ${uyeAd(u)}</th>`).join("")}<th class="sayi">${t("konu.toplam")}</th></tr></thead>
    <tbody>${konuSatirlari.map((s) => `<tr><th scope="row">${esc(konuAd(s.konu))}</th>${SIRA.map((u) => `<td class="sayi">${s.c[u] ? sayi(s.c[u]) : "–"}</td>`).join("")}<td class="sayi">${sayi(s.top)}</td></tr>`).join("")}</tbody>
    <tfoot><tr><th scope="row">${t("konu.toplam")}</th>${SIRA.map((u) => `<td class="sayi">${sayi(genel[u] || 0)}</td>`).join("")}<td class="sayi">${sayi(oySay(kayitlar))}</td></tr></tfoot>`;

  // ---------- Gazze ----------
  $("#gazze").innerHTML = `<thead><tr><th>${t("t.tarih")}</th><th>${t("t.taslak")}</th><th>${t("t.veto")}</th><th class="sayi">${t("t.oy")}</th></tr></thead>
    <tbody>${gazze.slice().reverse().map((k) => `<tr><td>${tarihUzun(k.tarih)}</td><td>${k.belgeler.filter((b) => b.tur === "taslak").map((b) => bag(b.kod)).join(", ")}</td>
      <td>${k.uyeler.map((u) => `<span class="nokta" style="background:${UYELER[u].renk}"></span> ${uyeAd(u)}`).join(", ")}</td>
      <td class="sayi">${k.oy ? `${k.oy.lehte}–${k.oy.aleyhte}–${k.oy.cekimser}` : ""}</td></tr>`).join("")}</tbody>
    <tfoot><tr><th scope="row" colspan="2">${t("t.toplam")}: ${sayi(gazze.length)}</th><td colspan="2">${uyeListesi(uyeSay(gazze))}</td></tr></tfoot>`;

  // ---------- Galeri ----------
  const tekler = kayitlar.filter(tekBasina).reverse();
  $("#galeri-aciklama").textContent = t("galeri.aciklama", { n: sayi(tekler.length), n11: sayi(tekler.filter((k) => konseyBuyuklugu(k) === 11).length) });
  // Aynı gün ve aynı gündem başlıklı kayıtlar tek kartta (ülkeler listelenir); ilk 12 kart, "Tümünü göster" ile hepsi
  // Üyelik başvurularında gündem gövdesi ("Yeni üyelerin kabulü") ortak, başvuran ülke başlığın kuyruğundadır
  const govde = (k) => {
    const b = baslik(k);
    if (!k.uyelik) return [b, null];
    const m = DIL === "en" ? b.match(/^(Admission of new [Mm]embers)\s*[-–:]?\s*(.+)$/) : b.match(/^([^:]+):\s*(.+)$/);
    return m ? [m[1], m[2]] : [b, null];
  };
  const gruplar = [];
  tekler.forEach((k) => {
    const [g, kuyruk] = govde(k);
    const son = gruplar[gruplar.length - 1];
    if (son && son.tarih === k.tarih && son.govde === g) { son.kayitlar.push(k); if (kuyruk) son.kuyruklar.push(kuyruk); return; }
    gruplar.push({ tarih: k.tarih, govde: g, kuyruklar: kuyruk ? [kuyruk] : [], kayitlar: [k] });
  });
  const noktalar = (n) => `<svg class="noktalar" width="${n * 14}" height="12" viewBox="0 0 ${n * 14} 12" role="img" aria-label="${n - 1}–1">`
    + Array.from({ length: n }, (_, i) => `<circle cx="${i * 14 + 6}" cy="6" r="5" fill="${i < n - 1 ? "var(--oy-lehte)" : "var(--vurgu)"}"/>`).join("") + "</svg>";
  const kart = (g) => {
    const on1 = konseyBuyuklugu(g.kayitlar[0]) === 11;
    const uyeler = [...new Set(g.kayitlar.flatMap((k) => k.uyeler))];
    return `<li class="kart"><p class="karsi" style="margin:0">${t(on1 ? "karsi.11" : "karsi.15")}<span>${t(on1 ? "karsi.11y" : "karsi.15y")}</span></p>
      ${noktalar(on1 ? 11 : 15)}
      <span class="tarih">${tarihUzun(g.tarih)}${g.kayitlar.length > 1 ? ` · ${t("galeri.coklu", { n: sayi(g.kayitlar.length) })}` : ""}</span>
      <span>${uyeler.map((u) => `<span class="nokta" style="background:${UYELER[u].renk}"></span> ${uyeAd(u)}`).join(", ")}</span>
      <span class="gundem" ${DIL === "en" ? 'lang="en"' : ""}>${esc(g.govde)}${g.kuyruklar.length ? `: ${esc(g.kuyruklar.join(", "))}` : ""}</span></li>`;
  };
  const GALERI_ILK = 12;
  const galeriCiz = (hepsi) => {
    $("#galeri").innerHTML = (hepsi ? gruplar : gruplar.slice(0, GALERI_ILK)).map(kart).join("");
    const d = $("#galeri-dugme");
    d.hidden = hepsi || gruplar.length <= GALERI_ILK;
    d.textContent = t("galeri.tumu", { n: sayi(gruplar.length) });
  };
  galeriCiz(false);
  $("#galeri-dugme").addEventListener("click", () => galeriCiz(true));

  // ---------- Model ----------
  const kitapAlinti = (id) => { const a = kitap.find((x) => x.id === id); return a
    ? `${alintiMetni(a)}<p class="kunye">${kunye(a)}</p>` : ""; };
  const MADDELER = [["m.temsil", "m.temsilOzet", ["kitap-1"]], ["m.sayi", "m.sayiOzet", ["kitap-2", "kitap-3"]],
    ["m.veto", "m.vetoOzet", ["kitap-4", "kitap-7"]], ["m.gk", "m.gkOzet", ["kitap-5", "kitap-6"]]];
  $("#model").innerHTML = MADDELER.map(([b, o, ids]) => `<div class="kutu" role="row"><div class="model-ozet" role="cell"><h3>${t(b)}</h3><p>${t(o)}</p></div><div class="model-alinti" role="cell">${ids.map(kitapAlinti).join("")}</div></div>`).join("");

  // ---------- Zaman çizelgesi ----------
  const kitapTarih = (kitap[0] || {}).tarih || "2021-09";
  const olaylar = [{ tarih: kitapTarih, html: `<p>${t("c.kitap")}</p>` }, { tarih: GK_BAS, html: `<p>${t("c.762")}</p>` }];
  kayitlar.filter((k) => k.tarih >= GK_BAS && k.gk && k.gk.durum === "yapildi").forEach((k) => {
    const gk = k.gk.tartismalar.map((x) => t("c.gk", { tur: x.tur === "veto_girisimi" ? t("c.vg") : t("c.oo", { oturum: x.oturum }),
      tarihler: x.tarihler.map(tarihUzun).join(t("ve")) })).join(" ");
    olaylar.push({ tarih: k.tarih, html: `<p>${t("c.veto", { gundem: esc(baslik(k)), uyeler: k.uyeler.map(uyeAd).join(", ") })}</p><p class="gk">${gk}</p>` });
  });
  $("#cizelge").innerHTML = olaylar.sort((a, b) => a.tarih.localeCompare(b.tarih))
    .map((o) => `<li><time datetime="${o.tarih}">${tarihUzun(o.tarih)}</time>${o.html}</li>`).join("");

})();
</script>
</body>
</html>
