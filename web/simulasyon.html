<style>
:root {
  --zemin: #FBF8F1; --yuzey: #FFFFFF; --murekkep: #13213A; --murekkep-2: #5A6578; --cizgi: #E1DBCF; --vurgu: #A4262C;
  --u-sscb: #7E2F3C; --u-rus: #C2666F; --u-usa: #24507F; --u-gbr: #2F7A6E; --u-fra: #A8782A; --u-chn: #5E4E9A;
  --kabul: #2D6A4F;  /* yalnızca simülasyon sonucu "Kabul edilirdi" */
  --lehte: #9AA3B2; --aleyhte: #13213A; --cekimser: #D9D3C7; --bos: #EDE7DA; --secili-metin: #FFFFFF;
  --cizgi-denetim: #868E9D;  /* seçim kutusu ve düğme çerçevesi: kâğıtta 3,1:1, beyazda 3,3:1 */
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
}
:root[data-theme="dark"] {
  --zemin: #1C1A17; --yuzey: #272420; --murekkep: #EDE8E0; --murekkep-2: #ABA496; --cizgi: #3B3731; --vurgu: #E05A52;
  --u-sscb: #C2576A; --u-rus: #E89AA5; --u-usa: #5B8DC4; --u-gbr: #5FB09C; --u-fra: #D8A84A; --u-chn: #9B86D6;
  --kabul: #6FBF8E;
  --lehte: #8B94A3; --aleyhte: #EDE8E0; --cekimser: #4A463F; --bos: #2E2A24; --secili-metin: #000000;
  --cizgi-denetim: #7A7368;  /* koyu yüzeyde 3,3:1 */
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--zemin); color: var(--murekkep); font-family: var(--sans); font-size: var(--yz-govde); line-height: var(--sa-govde); }
.kap { max-width: 1180px; margin: 0 auto; padding: 0 24px 64px; }
/* Sayfa metni betikle yazılır: betik bitene kadar içerik görünmez, boş iskelet boyanıp sonra aşağı kaymaz */
.kap { visibility: hidden; }
.hazir .kap { visibility: visible; }
a { color: inherit; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--murekkep); outline-offset: 2px; }
[hidden] { display: none !important; }
button { font: inherit; color: var(--murekkep); cursor: pointer; }
.giris { padding: 64px 0 8px; }
h1 { font-family: var(--serif); font-weight: 600; font-size: var(--yz-baslik); line-height: var(--sa-baslik); margin: 0 0 16px; }
.giris p { font-family: var(--serif); font-size: var(--yz-govde); line-height: var(--sa-govde); max-width: var(--olcu); margin: 0 0 12px; }
h2 { font-family: var(--serif); font-weight: 600; font-size: var(--yz-govde); line-height: var(--sa-govde); margin: 32px 0 8px; scroll-margin-top: 16px; }
h3 { font-family: var(--serif); font-weight: 600; font-size: var(--yz-govde); margin: 0 0 8px; line-height: var(--sa-govde); }
.aciklama { color: var(--murekkep-2); font-size: var(--yz-kucuk); max-width: var(--olcu-kucuk, 520px); margin: 0 0 16px; line-height: var(--sa-kucuk); }
.kutu { background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 6px; }
.etiket { display: inline-block; font-size: var(--yz-kucuk); color: var(--murekkep-2); vertical-align: middle; margin-left: 8px; line-height: var(--sa-kucuk); }

/* Öne çıkan kayıtlar: kart ızgarası değil, iki sütunlu liste; seçili kayıt solda 2 px mürekkep çizgiyle */
.ornekler { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(420px, 100%), 1fr)); gap: 0 24px; margin: 0 0 16px; }
.ornekler button { text-align: left; padding: 4px 0 4px 12px; border: 0; border-left: 2px solid transparent; background: none; font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); color: var(--murekkep); }
.ornekler button[aria-pressed="true"] { border-left-color: var(--murekkep); }
.ornekler button[aria-pressed="true"] .kayit-baslik { font-weight: 600; }
.ornekler .tarih { color: var(--murekkep-2); font-variant-numeric: tabular-nums; }
.ornekler .kayit-baslik { font-family: var(--serif); font-size: var(--yz-govde); line-height: var(--sa-govde); }
.ornekler .alt { color: var(--murekkep-2); }
.kirilmaz { white-space: nowrap; }  /* oy kodu satır sonunda bölünmez ("12-3-0)") */

/* Kayıt seçimi: kutusuz, üstte ince çizgi; panellerle arasında bölüm çizgisi */
.secim-alani { border-top: 1px solid var(--cizgi); }
.secim { padding: 16px 0 8px; display: grid; grid-template-columns: repeat(auto-fit, minmax(172px, 1fr)); gap: 12px 16px; align-items: end; }
.secim > div { min-width: 0; }
.secim label, .liste label { display: block; font-size: var(--yz-kucuk); color: var(--murekkep-2); margin-bottom: 4px; line-height: var(--sa-kucuk); }
.secim select, .liste select { width: 100%; min-width: 0; font: inherit; font-size: var(--yz-govde); padding: 8px 8px; border: 1px solid var(--cizgi-denetim); border-radius: 4px; background: var(--yuzey); color: var(--murekkep); }
.bildirim { margin: 0; padding: 4px 0 0; font-size: var(--yz-kucuk); color: var(--murekkep-2); min-height: 1.4em; line-height: var(--sa-kucuk); }
.liste { padding: 12px 0 16px; }
.liste-bas { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; margin-bottom: 8px; font-size: var(--yz-kucuk); color: var(--murekkep-2); line-height: var(--sa-kucuk); }
.liste-bas .sayi { font-weight: 600; color: var(--murekkep); }
.gez { display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.gez button { font-size: var(--yz-kucuk); min-height: 40px; padding: 0 12px; border: 1px solid var(--cizgi-denetim); border-radius: 6px; background: var(--yuzey); line-height: var(--sa-kucuk); }
.dugme.ikincil { border-color: var(--cizgi-denetim); }
.gez button:disabled { opacity: .45; cursor: default; }
.gez .konum { font-variant-numeric: tabular-nums; padding: 0 4px; }
.bos-sonuc { padding: 16px 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; border-top: 1px solid var(--cizgi); }
.bos-sonuc p { margin: 0; }
.bos-sonuc button { min-height: 40px; padding: 0 12px; border: 1px solid var(--murekkep); border-radius: 4px; background: var(--murekkep); color: var(--zemin); }
.kayit-ozet { padding: 16px 0; border-top: 1px solid var(--cizgi); }
.kayit-ozet .tarih { font-size: var(--yz-kucuk); color: var(--murekkep-2); font-variant-numeric: tabular-nums; line-height: var(--sa-kucuk); }
.kayit-ozet .gundem { font-family: var(--serif); font-size: var(--yz-govde); line-height: var(--sa-govde); }
.kayit-ozet .belgeler { font-size: var(--yz-kucuk); color: var(--murekkep-2); margin-top: 4px; line-height: var(--sa-kucuk); }
.kayit-ozet .ornek-notu { margin: 8px 0 0; font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); }
.ulke-secim { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); }
.ulke-secim button { font-size: var(--yz-kucuk); min-height: 40px; padding: 4px 0; border: 0; background: none; display: inline-flex; align-items: center; gap: 8px; line-height: var(--sa-kucuk); }
.ulke-secim .uye-adi { text-decoration: underline 2px transparent; text-underline-offset: 4px; }  /* seçili çizgi metnin altında, yüksekliği değiştirmez; ad etiketle aynı taban çizgisinde */
.ulke-secim button[aria-pressed="true"] { font-weight: 600; }
.ulke-secim button[aria-pressed="true"] .uye-adi { text-decoration-color: var(--murekkep); }
.nokta { width: 12px; height: 12px; border-radius: 2px; display: inline-block; flex: none; }

/* Paneller: dört satır aynı hizada (başlık, kural, sayım, ayrıntı); sonuç ve nedeni sonuç kartlarında */
.paneller { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(4, auto); gap: 16px; margin-top: 16px; }
.panel { padding: 16px 24px 16px; display: grid; grid-template-rows: subgrid; grid-row: span 4; row-gap: 12px; align-content: start; }
.panel > * { margin: 0; min-width: 0; }
.panel h3 { margin: 0; font-size: var(--yz-govde); line-height: var(--sa-govde); }
.panel .kural, .panel .kural-ayrinti { font-size: var(--yz-kucuk); color: var(--murekkep-2); line-height: var(--sa-kucuk); max-width: 32em; }
.sayac-kutu { display: grid; gap: 8px; align-content: start; }  /* iki panelde sayaç ve kareler aynı hizada */
.sayac { font-variant-numeric: tabular-nums; font-size: var(--yz-kucuk); color: var(--murekkep-2); margin: 0; min-height: 1.4em; line-height: var(--sa-kucuk); }
.sayim { display: flex; flex-wrap: wrap; gap: 4px; min-height: 32px; margin: 0; }
.oy { width: 24px; height: 24px; border-radius: 4px; background: var(--bos); border: 1px solid var(--cizgi); display: inline-flex; align-items: center; justify-content: center; font-size: var(--yz-kucuk); font-weight: 600; color: var(--zemin); opacity: 0; transform: scale(.6); transition: opacity .18s, transform .18s; line-height: var(--sa-kucuk); }
.oy.goster { opacity: 1; transform: scale(1); }
.oy.lehte { background: var(--lehte); border-color: var(--lehte); color: var(--murekkep); }
.oy.aleyhte { background: var(--aleyhte); border-color: var(--aleyhte); color: var(--zemin); }  /* önerilen sistem: daimî üyenin ret oyu sıradan bir ret oyu, mürekkep renginde */
.oy.veto { background: var(--vurgu); border-color: var(--vurgu); color: var(--zemin); }           /* mevcut sistem: daimî üyenin ret oyu veto, kırmızı */
.oy.cekimser { background: var(--cekimser); border: 1px solid var(--cizgi-denetim); color: var(--murekkep); }  /* dolu: kesikli boş "katılmadı" karesinden ayrı */
.oy.katilmadi { background: transparent; color: var(--murekkep-2); border-style: dashed; }
.oy.yeni { background: transparent; border: 1px dashed var(--murekkep-2); opacity: 1; transform: none; }  /* 20 üyeli Konsey: kayıtta olmayan üye; sayaca girmez */
.yeni-grup { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 4px; }
.yeni-not { margin: 0; font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); color: var(--murekkep-2); }
.oy.secili { outline: 3px solid var(--murekkep); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .oy { transition: none; } }
.parametre { display: grid; gap: 8px; font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); }
.parametre label { display: block; color: var(--murekkep-2); font-size: var(--yz-kucuk); margin-bottom: 4px; line-height: var(--sa-kucuk); }
.parametre > div { min-width: 0; }
.parametre select { font: inherit; font-size: var(--yz-govde); padding: 4px 8px; border: 1px solid var(--cizgi-denetim); border-radius: 4px; background: var(--yuzey); color: var(--murekkep); width: 100%; min-width: 0; }
details.ayarlar .parametre { margin: var(--b2) 0 0; }
.ayar-cumle { margin: 0; color: var(--murekkep-2); }
.ayar-notu { margin: var(--b1) 0 0; font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); color: var(--murekkep-2); }  /* varsayılandan farklı ayar */
/* Sonuç bloğu (kaynaklar/kimlik/sonuc-taslak.html): başlıkta tarih ve belge; iki sonuç kartı yan yana (sistem adı ve kural
   özeti, büyük sonuç sözcüğü, tek cümle neden); altında fark cümlesi, düğmeler ve sayım sırası notu. Mobilde kartlar alt alta. */
.sonuc-blok { margin: 16px 0 0; padding: 24px; }
.sonuc-baslik { margin: 0 0 16px; font-family: var(--serif); font-weight: 600; font-size: var(--yz-govde); line-height: var(--sa-govde); color: var(--murekkep-2); }
.sonuc-kartlar { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.sonuc-kart { padding: 0 24px; background: none; border: 0; border-radius: 0; display: grid; gap: 8px; align-content: start; }
.sonuc-kart:first-child { padding-left: 0; }
.sonuc-kart + .sonuc-kart { border-left: 2px solid var(--cizgi); }
.sonuc-kart > * { margin: 0; min-width: 0; }
.sonuc-kart .sistem-adi, .sonuc-kart .neden { font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); color: var(--murekkep-2); }
.sonuc { font-family: var(--serif); font-size: var(--yz-baslik); font-weight: 600; line-height: var(--sa-baslik); margin: 0; min-height: var(--sa-baslik); }
/* Sonuç renkleri: yeşil yalnızca "Kabul edilirdi"; vetoyla "Düştü" ret kırmızısı; "Yeni üyelerin oyuna bağlı" ikincil;
   önerilen sistemde çoğunluk olmadan düşme (veto değil) mürekkep */
.sonuc.kabul { color: var(--kabul); }
.sonuc.dustu { color: var(--vurgu); }
.sonuc.bagli { color: var(--murekkep-2); }
.sonuc.yok { color: var(--murekkep); }
.sonuc.belirsiz { color: var(--murekkep-2); }
.sonuc-blok .fark { margin: 24px 0 0; }
.panel .ayrinti { display: grid; gap: 12px; padding-top: 12px; border-top: 1px solid var(--cizgi); font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); }
.panel .ayrinti p { margin: 0; color: var(--murekkep-2); }
details.ayarlar, details.unsur-kutu, details.karsilastir { font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); }
details.ayarlar summary, details.unsur-kutu summary, details.karsilastir summary { cursor: pointer; font-weight: 600; padding: 8px 0; margin: -8px 0; }  /* 40 px dokunma alanı, ritim aynı */
details.ayarlar[open] > summary, details.unsur-kutu[open] > summary, details.karsilastir[open] > summary { text-decoration: none; }  /* açıkken alt çizgi yok */
.panel .unsurlar { margin: 8px 0 0; padding: 0; list-style: none; font-size: var(--yz-kucuk); display: grid; gap: 8px; line-height: var(--sa-kucuk); }
.panel .unsurlar li { padding-left: 12px; border-left: 2px solid var(--cizgi); }
.panel .unsurlar .kunye { color: var(--murekkep-2); }
.panel .unsurlar b { margin-right: 8px; }
.panel .unsurlar .etiket { margin-left: 0; }  /* kaynak satırı alt satıra inince sol kenardan başlar */
details.karsilastir .k-ortak { margin: 8px 0 0; color: var(--murekkep); }  /* ortak hüküm maddelerle aynı renkte */
details.karsilastir ul { margin: 8px 0 0; padding-left: 16px; display: grid; gap: 8px; }
details.karsilastir .dayanak { color: var(--murekkep-2); }
.fark { margin: 16px 0 0; font-family: var(--serif); font-size: var(--yz-govde); max-width: var(--olcu); line-height: var(--sa-govde); }
.dugmeler { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: var(--b3); margin: var(--b6) 0 0; }  /* düğmeler: web/temel.css */

/* Yapışkan sonuç şeridi */
.serit { position: sticky; bottom: 0; margin: 16px 0 0; padding: 8px 16px; background: var(--zemin); box-shadow: 0 -2px 8px rgba(19, 33, 58, .06); display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; font-size: var(--yz-kucuk); z-index: 1; line-height: var(--sa-kucuk); }
.serit b { font-family: var(--serif); font-size: var(--yz-govde); line-height: var(--sa-govde); }
.serit-metin { display: flex; flex-wrap: wrap; gap: 4px 24px; align-items: center; }
.serit-metin > span { display: inline-flex; align-items: baseline; gap: 8px; }
.serit .serit-ad { color: var(--murekkep-2); }  /* sistem adı ikincil, sonuç sözcüğü 8 px arayla; iki nokta yok */
.serit .dugme { margin-left: auto; }
.serit .kabul { color: var(--kabul); }
.serit .dustu { color: var(--vurgu); }
.serit .bagli { color: var(--murekkep-2); }
.serit .yok { color: var(--murekkep); }
.serit .belirsiz { color: var(--murekkep-2); }

/* Toplu görünüm */
table { border-collapse: collapse; width: 100%; font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); }
th, td { text-align: left; padding: 8px 12px; border-top: 1px solid var(--cizgi); vertical-align: top; }
thead th { border-top: none; font: 600 var(--yz-kucuk)/var(--sa-kucuk) var(--sans); color: var(--murekkep-2); }
td.sayi { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
th.sayi { text-align: right; font-variant-numeric: tabular-nums; }
#toplu th[scope=row] { min-width: 14em; }
#toplu tr[aria-current] th { position: relative; }  /* seçili ayar: solda 2 px çizgi; ad kaymaz, satır çizgileri bütün hücrelerde aynı çizilir */
#toplu tr[aria-current] th::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--murekkep); }
.tablo-kap { overflow-x: auto; }
.tablo-not { font-size: var(--yz-kucuk); color: var(--murekkep-2); margin: 8px 0 0; max-width: var(--olcu-kucuk, 520px); line-height: var(--sa-kucuk); }

/* Sınırlar: kutusuz iki cümle, panellerin altında */
.sinirlar-not { margin: 32px 0 0; font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); color: var(--murekkep-2); max-width: var(--olcu-kucuk, 520px); }
.gorunmez { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 760px) {
  body { font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); }
  .kap { padding: 0 16px 48px; }
  .paneller { grid-template-columns: 1fr; grid-template-rows: none; }
  .panel { padding: 16px; grid-template-rows: auto; grid-row: auto; }
  .sonuc-blok { padding: 16px; }
  .sonuc-kartlar { grid-template-columns: 1fr; }
  .sonuc-kart, .sonuc-kart:first-child { padding: 0; }
  .sonuc-kart + .sonuc-kart { border-left: 0; border-top: 2px solid var(--cizgi); padding: 16px 0 0; }
  .serit { padding: 8px 12px; }
  .serit .dugme { display: none; }
}
/* Toplu tablo 520 px ve altında satır satır: sistem adı üstte, altında her sayı sütun adıyla; yatay kaydırma yok */
@media (max-width: 520px) {
  #toplu thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  #toplu, #toplu tbody, #toplu tr, #toplu th, #toplu td { display: block; }
  #toplu tr { padding: 8px 12px; border-top: 1px solid var(--cizgi); }
  #toplu tbody tr:first-child { border-top: 0; }
  #toplu tr[aria-current] { box-shadow: inset 2px 0 0 var(--murekkep); }  /* seçili satır solda 2 px çizgi; iç boşluk değişmez */
  #toplu th[scope=row], #toplu tr[aria-current] th { min-width: 0; padding: 0 0 4px; border: 0; position: static; }
  #toplu tr[aria-current] th::before { content: none; }
  #toplu td { display: flex; justify-content: space-between; gap: 16px; padding: 0; border: 0; white-space: normal; }
  #toplu td::before { content: attr(data-e); color: var(--murekkep-2); text-align: left; }
}

/* Sayfa üstü ve giriş (temel.css basamakları): üstte 48 px (dar ekranda 32 px), ilk bölüme 48 px */
.giris { padding: var(--b12) 0 var(--b12); }
@media (max-width: 760px) { .giris { padding-top: var(--b8); } }

  // Satır sonunda bölünmeyen kalıplar: "Article 27 (3)", "Madde 27/3", "par. 5 (b)", "L.67 (b)", "Ezulwini C (e) 2–3", "(9/15; 7/11)" bölünmez boşlukla, "20-member" kısa çizgiden sonra sözcük birleştiriciyle
  const kirilmaz = (s) => (typeof s !== "string" ? s : s.replace(/Article 27 \(3\)/g, "Article\u00A027\u00A0(3)").replace(/Madde 27\/3/g, "Madde\u00A027/3").replace(/\b(\d+)-member\b/g, "$1-\u2060member")
    .replace(/\b(paras?|para|par)\. (?=\d)/g, "$1.\u00A0").replace(/(\d) \(([a-z])\)/g, "$1\u00A0($2)")
    .replace(/\b([A-Z]) \(([a-z])\) (\d+)\u2013(\d+)/g, "$1\u00A0($2)\u00A0$3\u2060\u2013\u2060$4").replace(/Ezulwini (?=C\u00A0\()/g, "Ezulwini\u00A0")  // "Ezulwini C (e) 2\u20133"
    .replace(/\((\d+\/\d+); (?=\d+\/\d+\))/g, "($1;\u00A0"));  // e\u015Fik \u00E7ifti "(9/15; 7/11)"
  const t = (a, p) => { const v = SOZLUK[DIL][a] ?? SOZLUK.tr[a]; return kirilmaz(typeof v === "function" ? v(p || {}) : v); };
  const ek = DIL === "tr" ? "" : "?lang=" + DIL;
  document.documentElement.lang = DIL;
  document.title = t("sayfaBasligi");
  const metaYaz = (s, d) => { const e = document.querySelector(s); if (e) e.setAttribute("content", d); };

  metaYaz('meta[property="og:title"]', t("sayfaBasligi"));
  metaYaz('meta[property="og:description"]', t("sayfaAciklamasi"));

  $("#onceki").textContent = t("onceki"); $("#sonraki").textContent = t("sonraki");

  const V = window.VETO_VERISI;
  if (!V) return;
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const YEREL = DIL === "tr" ? "tr-TR" : "en-GB";
  const sayi = (n) => n.toLocaleString(YEREL);
  const AYLAR = { tr: ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"],
    en: ["January","February","March","April","May","June","July","August","September","October","November","December"] }[DIL];
  const tarihUzun = (x) => { const [y, a, g] = x.split("-"); return `${+g} ${AYLAR[+a - 1]} ${y}`; };
  // Türkçe sayı ekleri: sayının son söylenen kelimesine göre ünlü uyumu ve ünsüz benzeşmesi (13’ü, 12’si, 2011’den, 2014’ten, 2023’te)
  const sonKelime = (n) => { n = Math.abs(n); if (n % 10) return ["", "bir", "iki", "üç", "dört", "beş", "altı", "yedi", "sekiz", "dokuz"][n % 10];
    if (n % 100) return ["", "on", "yirmi", "otuz", "kırk", "elli", "altmış", "yetmiş", "seksen", "doksan"][Math.floor(n / 10) % 10]; return n % 1000 ? "yüz" : "bin"; };
  const sayiEki = (n, tur) => {
    const s = sonKelime(n), son = s[s.length - 1], u = [...s].filter((c) => "aeıioöuü".includes(c)).pop();
    const kalin = "aıou".includes(u), yuvarlak = "oöuü".includes(u), sert = "çfhkpsşt".includes(son), unlu = "aeıioöuü".includes(son);
    if (tur === "den") return (sert ? "t" : "d") + (kalin ? "an" : "en");
    if (tur === "de") return (sert ? "t" : "d") + (kalin ? "a" : "e");
    return (unlu ? "s" : "") + (kalin ? (yuvarlak ? "u" : "ı") : (yuvarlak ? "ü" : "i"));
  };
  const UYELER = {
    SSCB: { renk: "var(--u-sscb)", tr: "Sovyetler Birliği", en: "Soviet Union" }, RUS: { renk: "var(--u-rus)", tr: "Rusya Federasyonu", en: "Russian Federation" },
    USA: { renk: "var(--u-usa)", tr: "ABD", en: "United States" }, GBR: { renk: "var(--u-gbr)", tr: "Birleşik Krallık", en: "United Kingdom" },
    FRA: { renk: "var(--u-fra)", tr: "Fransa", en: "France" }, CHN: { renk: "var(--u-chn)", tr: "Çin", en: "China" },

  const uyeAd = (u) => UYELER[u][DIL];
  // İngilizcede cümle içinde belirli tanımlıkla (the United States, the Russian Federation); France ve China tanımlıksız.

  const azHareket = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const kayitlar = V.kayitlar.slice().sort((a, b) => b.tarih.localeCompare(a.tarih) || b.id.localeCompare(a.id));
  const kayitBul = (id) => kayitlar.find((k) => k.id === id);
  const konseyBuyuklugu = (k) => (k.tarih < "1966-01-01" ? 11 : 15);

  // Kitaptaki 20 üyeli Konsey: seçili eşiğin oranı korunur (9/15 → 12/20; üçte iki → 14/20; salt çoğunluk → 11/20). Hesap yalnızca
  // kayıtlı oylara dayanır; kayıtta olmayan 5 (1966 öncesinde 9) üyenin oyu tahmin edilmez. Sonuç: kayıtlı evet oyları eşiği

  // ---------- Öne çıkan kayıtlar: kimlik ve kısa ad sabit; tarih, konu, üye ve oy veri setinden ----------

  $("#ornekler").innerHTML = ORNEKLER.map((o) => { const k = kayitBul(o.id); return `<button type="button" data-ornek="${esc(o.id)}" aria-pressed="false">
      <span class="tarih">${esc(tarihUzun(k.tarih))}</span> <span class="kayit-baslik">${esc(o[DIL])}</span>
      <span class="alt">(${esc(k.uyeler.map(uyeAd).join(", "))}, <span class="kirilmaz">${esc(oyKisa(k))})</span></span></button>`; }).join("");
  const ornekleriIsaretle = () => $("#ornekler").querySelectorAll("[data-ornek]").forEach((b) => b.setAttribute("aria-pressed", String(!!durum.kayit && b.dataset.ornek === durum.kayit.id)));

  // ---------- Kitabın belirttiği unsurlar (alıntı bankasından, bölüm başlığıyla) ----------
  const alinti = (id) => (V.alintilar || []).find((a) => a.id === id);
  // İngilizcede resmî İngilizce baskıdan, bölümüyle (kitapta sayfa yazılmaz); resmî İngilizcesi olmayan alıntıda Türkçe özgün
  // metin, bölüm İngilizce baskıdaki adıyla ve altında işaretli gayriresmî çeviri (METODOLOJI 2.7)

  const kunye = (a) => (DIL === "tr" ? esc(t("kitapBolum", { b: a.bolum })) : a.metin_en

  // ---------- Birbirine bağlı filtreler (web/suzgec.js) ----------

  // Her seçeneğin yanındaki sayı, o seçenek seçilince eşleşecek kayıt sayısıdır. Sıfır eşleşme oluşmaz.
  const SZ = window.VetoSuzgec;

  const secenek = (deger, yazi) => `<option value="${esc(deger)}">${esc(yazi)}</option>`;
  function filtreleriCiz() {

  }
  // Sıfırlanan filtre için kısa satır; durum, sıfırlamadan sonraki filtre durumudur
  function sifirlamaNotu(x, durum) {
    if (x.ad === "yil") {
      const yillar = SZ.eslesenler(kayitlar, { konu: durum.konu, yil: "", uye: "" }).map((k) => k.tarih.slice(0, 4)).sort();
      const ilk = yillar[0], son = yillar[yillar.length - 1], secim = konuAd(durum.konu);
      if (ilk && x.deger < ilk) return t("sifir.yilBaslar", { secim, yil: ilk, ek: sayiEki(+ilk, "den") });
      if (son && x.deger > son) return t("sifir.yilBiter", { secim, yil: son, ek: sayiEki(+son, "de") });
      return t("sifir.yilYok", { secim, yil: x.deger });
    }
    return t("sifir.uye", { secim: [konuAd(durum.konu), durum.yil].filter(Boolean).join(" "), uye: uyeAdMetin(x.deger) });
  }
  function filtreDegisti(ad, deger) {
    const r = SZ.sec(suzgecKayitlari, filtre, ad, deger);
    Object.assign(filtre, r.durum);
    $("#bildirim").textContent = r.sifirlanan.map((x) => sifirlamaNotu(x, r.durum)).join(" ");
    filtreleriCiz();
    listeYaz();
  }
  SIRA.forEach((ad) => $("#f-" + ad).addEventListener("change", (e) => filtreDegisti(ad, e.target.value)));
  function filtreleriTemizle() { SIRA.forEach((ad) => { filtre[ad] = ""; }); $("#bildirim").textContent = ""; filtreleriCiz(); }

  // ---------- Kayıt listesi ----------
  let L = [];
  function listeYaz() {
    L = suzulmus();
    $("#eslesen").textContent = t("kayitSayisi", { n: sayi(L.length) });
    $("#f-kayit").innerHTML = L.map((k) => secenek(k.id, `${tarihUzun(k.tarih)}, ${baslik(k)}${sayilabilir(k) ? "" : " " + t("oyYokKisa")}`)).join("");
    $("#bos").hidden = L.length > 0;
    $("#liste").hidden = L.length === 0;
    if (!L.length) { sec(null); return; }  // kodda ulaşılmaz: her görünür seçenek en az bir kayıt verir
    if (!L.some((k) => k.id === (durum.kayit || {}).id)) sec(L[0]);
    else konumYaz();
  }
  function konumYaz() {
    const i = durum.kayit ? L.findIndex((k) => k.id === durum.kayit.id) : -1;
    if (i >= 0) $("#f-kayit").value = durum.kayit.id;
    $("#konum").textContent = i >= 0 ? t("konum", { i: sayi(i + 1), n: sayi(L.length) }) : "";
    $("#onceki").disabled = i <= 0; $("#sonraki").disabled = i < 0 || i >= L.length - 1;
  }
  $("#f-kayit").addEventListener("change", (e) => sec(kayitBul(e.target.value)));
  $("#onceki").addEventListener("click", () => { const i = L.findIndex((k) => k.id === durum.kayit.id); if (i > 0) sec(L[i - 1]); });
  $("#sonraki").addEventListener("click", () => { const i = L.findIndex((k) => k.id === durum.kayit.id); if (i >= 0 && i < L.length - 1) sec(L[i + 1]); });
  const rastgeleSec = () => {
    if (!L.length) return;
    const aday = L.length > 1 && durum.kayit ? L.filter((k) => k.id !== durum.kayit.id) : L;
    sec(aday[Math.floor(Math.random() * aday.length)]);
  };
  $("#rastgele").addEventListener("click", rastgeleSec);
  $("#rastgele-kayit").addEventListener("click", rastgeleSec);
  $("#temizle").addEventListener("click", () => { filtreleriTemizle(); listeYaz(); });
  $("#ornekler").addEventListener("click", (e) => { const b = e.target.closest("[data-ornek]"); if (!b) return; filtreleriTemizle(); sec(kayitBul(b.dataset.ornek)); listeYaz(); });
  // Sayım sürerken yeniden başlatma düğmeleri pasif (aria-disabled; odaklanabilir kalır, tıklama yok sayılır)
  const sayimSuruyor = (v) => ["#tekrar", "#serit-tekrar"].forEach((s) => $(s).setAttribute("aria-disabled", String(v)));
  const yenidenSay = (kaynak) => { if ($("#tekrar").getAttribute("aria-disabled") === "true") return; goster(true, kaynak); };
  $("#tekrar").addEventListener("click", () => yenidenSay("panel"));
  $("#serit-tekrar").addEventListener("click", () => yenidenSay("serit"));

  function adresYaz(id) {
    try { const u = new URL(location.href); if (id) u.searchParams.set("kayit", id); else u.searchParams.delete("kayit"); history.replaceState(null, "", u); } catch (e) { /* tek dosya sürümünde (srcdoc) adres yazılamaz */ }
  }
  function sec(k) {
    durum.kayit = k;
    durum.ulke = k && k.uyeler.length === 1 ? k.uyeler[0] : null;
    adresYaz(k ? k.id : null);
    ornekleriIsaretle();
    konumYaz();
    ozetYaz();
    goster(true);
  }
  function ozetYaz() {
    const k = durum.kayit;
    if (!k) { $("#kayit-ozet").innerHTML = ""; $("#kayit-ozet").hidden = true; return; }
    $("#kayit-ozet").hidden = false;
    const belgeler = k.belgeler.map((b) => bag(b.kod)).join(", ");
    const ulkeler = k.kapali ? "" : `<div class="ulke-secim"><span>${k.uyeler.length > 1 ? t("ulkeSec") : t("ulkeTek")}</span>${k.uyeler.map((u) =>
      `<button type="button" data-ulke="${u}" aria-pressed="${durum.ulke === u}"><span class="nokta" style="background:${UYELER[u].renk}"></span><span class="uye-adi">${uyeAd(u)}</span></button>`).join("")}</div>`;
    const notu = ornekMi(k) ? `<p class="ornek-notu">${esc(t("ornekNotu", { boy: konseyBuyuklugu(k), lehte: k.oy.lehte, ek: sayiEki(k.oy.lehte, "i") }))}</p>` : "";
    $("#kayit-ozet").innerHTML = `<div class="tarih">${tarihUzun(k.tarih)}, ${esc(konuAd(k.konu))}</div><div class="gundem" ${DIL === "en" ? 'lang="en"' : ""}>${esc(baslik(k))}</div><div class="belgeler">${belgeler}</div>${ulkeler}${notu}`;
    $("#kayit-ozet").querySelectorAll("[data-ulke]").forEach((b) => b.addEventListener("click", () => {
      durum.ulke = b.dataset.ulke;
      $("#kayit-ozet").querySelectorAll("[data-ulke]").forEach((x) => x.setAttribute("aria-pressed", x === b));
      goster(false);
    }));
  }

  // ---------- Sayım ----------
  let zamanlayici = [];
  const temizle = () => { zamanlayici.forEach(clearTimeout); zamanlayici = []; };
  function oyListesi(k) {
    // Sıra: lehte, aleyhte (veto eden üyeler önce), çekimser, oylamaya katılmayan. Kayıtta üye bazlı sıra olmadığı için sayım sırası gösterimdir.
    const boy = konseyBuyuklugu(k), oy = k.oy;
    const L = [];
    for (let i = 0; i < oy.lehte; i++) L.push({ tur: "lehte" });
    k.uyeler.forEach((u) => L.push({ tur: "aleyhte", uye: u }));
    for (let i = k.uyeler.length; i < oy.aleyhte; i++) L.push({ tur: "aleyhte" });
    for (let i = 0; i < oy.cekimser; i++) L.push({ tur: "cekimser" });
    for (let i = oy.lehte + oy.aleyhte + oy.cekimser; i < boy; i++) L.push({ tur: "katilmadi" });
    return L;
  }
  const kisa = { SSCB: "SU", RUS: "RU", USA: "US", GBR: "UK", FRA: "FR", CHN: "CN" };
  const ALANLAR = ["mevcut", "oneri"];
  // Yapışkan şerit yalnızca bir sonuç varken ve sonuç kartları ekran dışındayken görünür
  let seritDolu = false, kartlarGorunur = true;
  const seritGuncelle = () => { $("#serit").hidden = !seritDolu || kartlarGorunur; };
  if ("IntersectionObserver" in window) {
    new IntersectionObserver((g) => { kartlarGorunur = g[g.length - 1].isIntersecting; seritGuncelle(); }).observe($("#sonuc-kartlar"));
  }
  function panelleriTemizle(seritKalsin) {
    ALANLAR.forEach((a) => { $("#sayim-" + a).innerHTML = ""; $("#sayac-" + a).textContent = ""; $("#sonuc-" + a).className = "sonuc"; $("#sonuc-" + a).textContent = ""; $("#aciklama-" + a).textContent = ""; });
    $("#karsilastir-liste").innerHTML = ""; $("#karsilastir-ortak").textContent = ""; $("#fark").hidden = true;
    // Şeritten yeniden sayımda şerit ve odaktaki düğmesi yerinde kalır; sonuç yerine "Sayılıyor…" yazar
    if (seritKalsin && seritDolu) $("#serit-metin").textContent = t("r.sayiliyor");
    else { seritDolu = false; $("#serit-metin").innerHTML = ""; }
    seritGuncelle();
    $("#yeni-not").hidden = true; $("#yeni-not").textContent = "";
  }
  function goster(animasyon, kaynak) {
    temizle();
    panelleriTemizle(kaynak === "serit");
    sayimSuruyor(false);
    const k = durum.kayit;
    $("#paneller-bolum").hidden = !k;
    if (!k) return;
    const boy = konseyBuyuklugu(k);
    const yirmi = durum.uye === "kitap20";
    const esik = yirmi ? esik20(durum.esik) : ESIKLER[durum.esik](boy);
    const belge = (k.belgeler.find((b) => b.tur === "taslak") || k.belgeler[0] || {}).kod;
    $("#h-sonuc").textContent = t("sonuc.baslik", { tarih: tarihUzun(k.tarih), belge });
    $("#sistem-oneri").textContent = `${t("p.oneri")}, ${t("kart.oneri", { boy: yirmi ? 20 : boy, esik })}`;
    $("#sistem-mevcut").textContent = `${t("p.mevcut")}, ${t("kart.mevcut")}`;
    if (!sayilabilir(k)) {
      ALANLAR.forEach((a) => { $("#sonuc-" + a).className = "sonuc belirsiz"; $("#sonuc-" + a).textContent = t("r.oyYok"); $("#aciklama-" + a).textContent = t(k.kapali ? "a.kapali" : "a.oyYok"); });
      $("#karsilastir-liste").innerHTML = `<li>${t("k.yok")}</li>`;
      return;
    }
    const L = oyListesi(k), oy = k.oy;
    const katilmadi = boy - oy.lehte - oy.aleyhte - oy.cekimser;
    const sayacMetni = t("sayac", { lehte: oy.lehte, aleyhte: oy.aleyhte, cekimser: oy.cekimser, katilmadi });
    const s20 = yirmi ? sonuc20(oy.lehte, boy, esik) : null;
    const ulkeAdi = durum.ulke ? uyeAdMetin(durum.ulke) : k.uyeler.map(uyeAdMetin).join(DIL === "tr" ? " ve " : " and ");
    const sonucOneri = yirmi ? s20.tur : (oy.lehte >= esik ? "kabul" : "cogunlukYok");
    ALANLAR.forEach((a) => {
      // Mevcut sistemde daimî üyenin ret oyu veto (kırmızı); önerilen sistemde aynı oy sıradan bir ret oyu (mürekkep)
      $("#sayim-" + a).innerHTML = L.map((o, i) => { const ad = o.uye ? `${uyeAd(o.uye)}, ${t("oy.aleyhte")}` : t("oy." + o.tur);
        return `<span class="oy ${o.uye && a === "mevcut" ? "veto" : o.tur}${o.uye && o.uye === durum.ulke ? " secili" : ""}" data-i="${i}" role="img" aria-label="${esc(ad)}" title="${esc(ad)}">${o.uye ? kisa[o.uye] : ""}</span>`; }).join("")
        // 20 üyeli Konsey: kayıtta olmayan üyeler kesikli boş kare; sayılmaz, sayaca girmez
        + (a === "oneri" && yirmi ? `<span class="yeni-grup" aria-hidden="true">${'<span class="oy yeni"></span>'.repeat(s20.yeni)}</span>` : "");
      $("#sayac-" + a).textContent = sayacMetni;
      $("#sonuc-" + a).textContent = animasyon && !azHareket ? t("r.sayiliyor") : "";
    });
    if (yirmi) { $("#yeni-not").textContent = t("yeni.not", { yeni: sayi(s20.yeni) }); $("#yeni-not").hidden = false; }
    const bitir = () => {
      $("#sonuc-mevcut").className = "sonuc dustu"; $("#sonuc-mevcut").textContent = t("r.dustu");
      $("#aciklama-mevcut").textContent = t("a.mevcut", { uye: ulkeAdi, lehte: sayi(oy.lehte), n: durum.ulke ? 1 : k.uyeler.length });
      const so = $("#sonuc-oneri");
      so.className = "sonuc " + (sonucOneri === "kabul" ? "kabul" : sonucOneri === "bagli" ? "bagli" : "yok");
      so.textContent = t(sonucOneri === "kabul" ? "r.kabul" : sonucOneri === "bagli" ? "r.bagli" : "r.cogunlukYok");
      $("#aciklama-oneri").textContent = yirmi
        ? t({ kabul: "a.kabul20", bagli: "a.bagli20", cogunlukYok: "a.yok20" }[sonucOneri], { lehte: sayi(oy.lehte), esik: sayi(esik), yeni: sayi(s20.yeni), k: sayi(s20.k), ek: sayiEki(s20.k, "i") })
        : t(sonucOneri === "kabul" ? "a.oneriKabul" : "a.oneriYok", { lehte: sayi(oy.lehte), esik, boy });
      // Diğer modeller: ortak hüküm listenin üstünde bir kez; maddeler yalnızca farkı taşır. Veto eden sayısı cümleye geçer.
      const vetoSayisi = durum.ulke ? 1 : k.uyeler.length;
      $("#karsilastir-ortak").textContent = t("k.ortak", { uye: ulkeAdi, m: vetoSayisi, boy });
      $("#karsilastir-liste").innerHTML = [["k.g4", "k.g4d"], ["k.ufc", "k.ufcd"], ["k.ez", "k.ezd"]].map(([m, d]) =>
        `<li>${esc(t(m))} <span class="dayanak">${t(d)}</span></li>`).join("");
      $("#fark").textContent = sonucOneri === "bagli" ? t("fark.bagli", { m: k.uyeler.length, k: sayi(s20.k) }) : t("fark", { m: k.uyeler.length }); $("#fark").hidden = false;
      const seritOneri = sonucOneri === "bagli" ? t("serit.bagli", { k: sayi(s20.k) }) : so.textContent;
      $("#serit-metin").innerHTML = `<span><span class="serit-ad">${t("serit.oneri")}</span><b class="${so.className.replace("sonuc ", "")}">${esc(seritOneri)}</b></span><span><span class="serit-ad">${t("serit.mevcut")}</span><b class="dustu">${t("r.dustu")}</b></span>`;
      seritDolu = true; seritGuncelle();
      sayimSuruyor(false);
    };
    if (!animasyon || azHareket) {
      document.querySelectorAll(".oy").forEach((e) => e.classList.add("goster"));
      bitir();
      return;
    }
    sayimSuruyor(true);
    const ilkVeto = L.findIndex((o) => o.tur === "aleyhte" && o.uye);
    L.forEach((o, i) => zamanlayici.push(setTimeout(() => {
      ALANLAR.forEach((a) => $(`#sayim-${a} [data-i="${i}"]`).classList.add("goster"));
      if (i === ilkVeto) { $("#sonuc-mevcut").className = "sonuc dustu"; $("#sonuc-mevcut").textContent = t("r.dustu"); }
      if (i === L.length - 1) bitir();
    }, 140 * (i + 1))));
  }

  // ---------- Toplu görünüm ----------
  // Kayıtlı üyelerle üç eşik ve kitaptaki 20 üyeli Konseyle üç eşik; sayılar sayfa açılırken veri setinden hesaplanır
  function topluYaz() {
    const oylu = kayitlar.filter(sayilabilir), kapali = kayitlar.filter((k) => k.kapali), oysuz = kayitlar.filter((k) => !k.kapali && !k.oy);
    const oysuzSutun = oysuz.length > 0;  // yedi satırda da sıfır olacaksa sütun çizilmez
    // Hücrelerin sütun adı (data-e): dar ekranda tablo satır satır dizilince sayının yanında yazılır
    const hucre = (e, v) => `<td class="sayi" data-e="${esc(t(e))}">${v}</td>`;
    const satir = (ad, kesin, bagli, dustu, secili) => `<tr${secili ? ' aria-current="true"' : ""}><th scope="row">${ad}${secili ? ` <span class="gorunmez">${t("t.seciliAyar")}</span>` : ""}</th>${hucre("t.kesin", sayi(kesin))}${hucre("t.bagli", bagli === null ? "–" : sayi(bagli))}${hucre("t.dustu", sayi(dustu))}${hucre("t.kapali", sayi(kapali.length))}${oysuzSutun ? hucre("t.oyYok", sayi(oysuz.length)) : ""}${hucre("t.toplam", sayi(kayitlar.length))}</tr>`;
    const ADLAR = ["cogunluk", "ucteiki", "salt"];
    const satirlar = [satir(t("t.mevcutAd"), 0, null, oylu.length, false)];
    const ozet = {};
    ADLAR.forEach((e) => {
      const kesin = oylu.filter((k) => k.oy.lehte >= ESIKLER[e](konseyBuyuklugu(k))).length;
      ozet["kayitli." + e] = { kesin, bagli: 0 };
      satirlar.push(satir(t("t.oneriAd", { esik: t("e." + e) }), kesin, null, oylu.length - kesin, durum.uye === "kayitli" && e === durum.esik));
    });
    ADLAR.forEach((e) => {
      const turler = oylu.map((k) => sonuc20(k.oy.lehte, konseyBuyuklugu(k), esik20(e)).tur);
      const kesin = turler.filter((x) => x === "kabul").length, bagli = turler.filter((x) => x === "bagli").length;
      ozet["kitap20." + e] = { kesin, bagli };
      satirlar.push(satir(t("t.oneri20Ad", { esik: t("e20." + e, { e: sayi(esik20(e)) }) }), kesin, bagli, turler.length - kesin - bagli, durum.uye === "kitap20" && e === durum.esik));
    });
    $("#h-toplu").textContent = t("h.toplu", { n: sayi(kayitlar.length) });
    const o = ozet[durum.uye + "." + durum.esik];
    // Eşik adı ve oranı ayrı: "Mevcut çoğunluk kuralında (9/15; 7/11) öneri … kaydın …’ünde"
    const oran = `${ESIKLER[durum.esik](15)}/15; ${ESIKLER[durum.esik](11)}/11`;
    $("#toplu-ozet").textContent = durum.uye === "kitap20"
      ? t("toplu.ozet20", { kesin: sayi(o.kesin), ek: sayiEki(o.kesin, "i"), bagli: sayi(o.bagli), n: sayi(kayitlar.length), esik: t("o20." + durum.esik), oran: t("oran20", { e: sayi(esik20(durum.esik)) }), kapali: sayi(kapali.length) })
      : t("toplu.ozet", { kabul: sayi(o.kesin), ek: sayiEki(o.kesin, "i"), n: sayi(kayitlar.length), esik: t("o." + durum.esik), oran, kapali: sayi(kapali.length) });
    $("#toplu").innerHTML = `<thead><tr><th>${t("t.sistem")}</th><th class="sayi">${t("t.kesin")}</th><th class="sayi">${t("t.bagli")}</th><th class="sayi">${t("t.dustu")}</th><th class="sayi">${t("t.kapali")}</th>${oysuzSutun ? `<th class="sayi">${t("t.oyYok")}</th>` : ""}<th class="sayi">${t("t.toplam")}</th></tr></thead><tbody>${satirlar.join("")}</tbody>`;
    const [a, b, c] = ADLAR.map((e) => sayi(esik20(e)));
    $("#toplu-not").textContent = t("t.not", { a, b, c });
  }

  // ---------- Açılış: ?kayit=<id> varsa o kayıt, yoksa ilk öne çıkan örnek ----------
  filtreleriCiz();
  const istenen = kayitBul(new URLSearchParams(location.search).get("kayit") || "");
  const ilk = istenen || (ORNEKLER.length ? kayitBul(ORNEKLER[0].id) : null) || kayitlar[0];
  sec(ilk);
  listeYaz();
  topluYaz();
})();
</script>
</body>
</html>
