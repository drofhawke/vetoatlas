<style>
:root {
  --zemin: #FBF8F1; --yuzey: #FFFFFF; --murekkep: #13213A; --murekkep-2: #5A6578; --cizgi: #E1DBCF; --vurgu: #A4262C;
  --u-sscb: #7E2F3C; --u-rus: #C2666F; --u-usa: #24507F; --u-gbr: #2F7A6E; --u-fra: #A8782A; --u-chn: #5E4E9A;
  --kabul: #2D6A4F;  /* yalnızca simülasyon sonucu "Kabul edilirdi" */
  --lehte: #9AA3B2; --aleyhte: #13213A; --cekimser: #D9D3C7; --bos: #EDE7DA; --secili-metin: #FFFFFF;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
}
:root[data-theme="dark"] {
  --zemin: #1C1A17; --yuzey: #272420; --murekkep: #EDE8E0; --murekkep-2: #ABA496; --cizgi: #3B3731; --vurgu: #E05A52;
  --u-sscb: #C2576A; --u-rus: #E89AA5; --u-usa: #5B8DC4; --u-gbr: #5FB09C; --u-fra: #D8A84A; --u-chn: #9B86D6;
  --kabul: #6FBF8E;
  --lehte: #8B94A3; --aleyhte: #EDE8E0; --cekimser: #4A463F; --bos: #2E2A24; --secili-metin: #000000;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--zemin); color: var(--murekkep); font-family: var(--sans); font-size: var(--yz-govde); line-height: var(--sa-govde); }
.kap { max-width: 1180px; margin: 0 auto; padding: 0 24px 64px; }
a { color: inherit; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--murekkep); outline-offset: 2px; }
[hidden] { display: none !important; }
button { font: inherit; color: var(--murekkep); cursor: pointer; }
.giris { padding: 64px 0 8px; }
h1 { font-family: var(--serif); font-weight: 600; font-size: var(--yz-baslik); line-height: var(--sa-baslik); margin: 0 0 16px; }
.giris p { font-family: var(--serif); font-size: var(--yz-govde); line-height: var(--sa-govde); max-width: var(--olcu); margin: 0 0 12px; }
h2 { font-family: var(--serif); font-weight: 600; font-size: var(--yz-govde); line-height: var(--sa-govde); margin: 32px 0 8px; scroll-margin-top: 16px; }
h3 { font-family: var(--serif); font-weight: 600; font-size: var(--yz-govde); margin: 0 0 8px; line-height: var(--sa-govde); }
.aciklama { color: var(--murekkep-2); font-size: var(--yz-kucuk); max-width: var(--olcu); margin: 0 0 16px; line-height: var(--sa-kucuk); }
.kutu { background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 6px; }
.etiket { display: inline-block; font-size: var(--yz-kucuk); color: var(--murekkep-2); vertical-align: middle; margin-left: 8px; line-height: var(--sa-kucuk); }

/* Üç adım göstergesi */
.adimlar { list-style: none; margin: 24px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: var(--yz-kucuk); color: var(--murekkep-2); line-height: var(--sa-kucuk); }
.adimlar li { display: inline-flex; align-items: baseline; gap: 4px; padding: 4px 0; border-bottom: 2px solid transparent; }
.adimlar .no { font-weight: 600; font-variant-numeric: tabular-nums; }
.adimlar .no::after { content: "."; }
.adimlar li.tamam { color: var(--murekkep); }
.adimlar li[aria-current="step"] { color: var(--murekkep); font-weight: 600; border-bottom-color: var(--murekkep); }

/* Öne çıkan kayıtlar: kart ızgarası değil, iki sütunlu liste; seçili kayıt solda 2 px mürekkep çizgiyle */
.ornekler { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(420px, 100%), 1fr)); gap: 0 24px; margin: 0 0 16px; }
.ornekler button { text-align: left; padding: 4px 0 4px 12px; border: 0; border-left: 2px solid transparent; background: none; font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); color: var(--murekkep); }
.ornekler button[aria-pressed="true"] { border-left-color: var(--murekkep); }
.ornekler button[aria-pressed="true"] .ad { font-weight: 600; }
.ornekler .tarih { color: var(--murekkep-2); font-variant-numeric: tabular-nums; }
.ornekler .ad { font-family: var(--serif); font-size: var(--yz-govde); line-height: var(--sa-govde); }
.ornekler .alt { color: var(--murekkep-2); }

/* Kayıt seçimi: kutusuz, üstte ve altta ince çizgi */
.secim-alani { border-top: 1px solid var(--cizgi); border-bottom: 1px solid var(--cizgi); }
.secim { padding: 16px 0 8px; display: grid; grid-template-columns: repeat(auto-fit, minmax(172px, 1fr)); gap: 12px 16px; align-items: end; }
.secim > div { min-width: 0; }
.secim label, .liste label { display: block; font-size: var(--yz-kucuk); color: var(--murekkep-2); margin-bottom: 4px; line-height: var(--sa-kucuk); }
.secim select, .liste select { width: 100%; min-width: 0; font: inherit; font-size: var(--yz-govde); padding: 8px 8px; border: 1px solid var(--cizgi); border-radius: 4px; background: var(--yuzey); color: var(--murekkep); }
.bildirim { margin: 0; padding: 4px 0 0; font-size: var(--yz-kucuk); color: var(--murekkep-2); min-height: 1.4em; line-height: var(--sa-kucuk); }
.liste { padding: 12px 0 16px; }
.liste-bas { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; margin-bottom: 8px; font-size: var(--yz-kucuk); color: var(--murekkep-2); line-height: var(--sa-kucuk); }
.liste-bas .sayi { font-weight: 600; color: var(--murekkep); }
.gez { display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.gez button { font-size: var(--yz-kucuk); padding: 4px 12px; border: 1px solid var(--cizgi); border-radius: 6px; background: var(--yuzey); line-height: var(--sa-kucuk); }
.gez button:disabled { opacity: .45; cursor: default; }
.gez .konum { font-variant-numeric: tabular-nums; padding: 0 4px; }
.bos-sonuc { padding: 16px 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; border-top: 1px solid var(--cizgi); }
.bos-sonuc p { margin: 0; }
.bos-sonuc button { padding: 4px 12px; border: 1px solid var(--murekkep); border-radius: 4px; background: var(--murekkep); color: var(--zemin); }
.kayit-ozet { padding: 16px 0; border-top: 1px solid var(--cizgi); }
.kayit-ozet .tarih { font-size: var(--yz-kucuk); color: var(--murekkep-2); font-variant-numeric: tabular-nums; line-height: var(--sa-kucuk); }
.kayit-ozet .gundem { font-family: var(--serif); font-size: var(--yz-govde); line-height: var(--sa-govde); }
.kayit-ozet .belgeler { font-size: var(--yz-kucuk); color: var(--murekkep-2); margin-top: 4px; line-height: var(--sa-kucuk); }
.kayit-ozet .ornek-notu { margin: 8px 0 0; font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); }
.ulke-secim { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); }
.ulke-secim button { font-size: var(--yz-kucuk); padding: 4px 0; border: 0; border-bottom: 2px solid transparent; background: none; display: inline-flex; align-items: center; gap: 8px; line-height: var(--sa-kucuk); }
.ulke-secim button[aria-pressed="true"] { border-bottom-color: var(--murekkep); font-weight: 600; }
.nokta { width: 12px; height: 12px; border-radius: 2px; display: inline-block; flex: none; }

/* Paneller: dört satır aynı hizada (başlık, kural, sayım, ayrıntı); sonuç ve nedeni sonuç kartlarında */
.paneller { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(4, auto); gap: 16px; margin-top: 16px; }
.panel { padding: 16px 24px 16px; display: grid; grid-template-rows: subgrid; grid-row: span 4; row-gap: 12px; align-content: start; }
.panel > * { margin: 0; min-width: 0; }
.panel h2 { margin: 0; font-size: var(--yz-govde); line-height: var(--sa-govde); }
.panel .kural { font-size: var(--yz-kucuk); color: var(--murekkep-2); line-height: var(--sa-kucuk); }
.sayac-kutu { display: grid; gap: 8px; align-content: start; }  /* iki panelde sayaç ve kareler aynı hizada */
.sayac { font-variant-numeric: tabular-nums; font-size: var(--yz-kucuk); color: var(--murekkep-2); margin: 0; min-height: 1.4em; line-height: var(--sa-kucuk); }
.sayim { display: flex; flex-wrap: wrap; gap: 4px; min-height: 32px; margin: 0; }
.oy { width: 24px; height: 24px; border-radius: 4px; background: var(--bos); border: 1px solid var(--cizgi); display: inline-flex; align-items: center; justify-content: center; font-size: var(--yz-kucuk); font-weight: 600; color: var(--zemin); opacity: 0; transform: scale(.6); transition: opacity .18s, transform .18s; line-height: var(--sa-kucuk); }
.oy.goster { opacity: 1; transform: scale(1); }
.oy.lehte { background: var(--lehte); border-color: var(--lehte); color: var(--murekkep); }
.oy.aleyhte { background: var(--aleyhte); border-color: var(--aleyhte); color: var(--zemin); }  /* önerilen sistem: daimî üyenin ret oyu sıradan bir ret oyu, mürekkep renginde */
.oy.veto { background: var(--vurgu); border-color: var(--vurgu); color: var(--zemin); }           /* mevcut sistem: daimî üyenin ret oyu veto, kırmızı */
.oy.cekimser { background: var(--cekimser); border-color: var(--cekimser); color: var(--murekkep); }
.oy.katilmadi { background: transparent; color: var(--murekkep-2); border-style: dashed; }
.oy.yeni { background: transparent; border: 1px dashed var(--murekkep-2); opacity: 1; transform: none; }  /* 20 üyeli Konsey: kayıtta olmayan üye; sayaca girmez */
.yeni-grup { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 4px; }
.yeni-not { margin: 0; font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); color: var(--murekkep-2); }
.oy.secili { outline: 3px solid var(--murekkep); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .oy { transition: none; } }
.parametre { display: grid; gap: 8px; font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); }
.parametre label { display: block; color: var(--murekkep-2); font-size: var(--yz-kucuk); margin-bottom: 4px; line-height: var(--sa-kucuk); }
.parametre > div { min-width: 0; }
.parametre select { font: inherit; font-size: var(--yz-govde); padding: 4px 8px; border: 1px solid var(--cizgi); border-radius: 4px; background: var(--yuzey); color: var(--murekkep); width: 100%; min-width: 0; }
details.ayarlar .parametre { margin: var(--b2) 0 0; }
.ayar-cumle { margin: 0; color: var(--murekkep-2); }
.ayar-notu { margin: var(--b1) 0 0; font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); color: var(--murekkep-2); }  /* varsayılandan farklı ayar */
/* Sonuç bloğu (kaynaklar/kimlik/sonuc-taslak.html): başlıkta tarih ve belge; iki sonuç kartı yan yana (sistem adı ve kural
   özeti, büyük sonuç sözcüğü, tek cümle neden); altında fark cümlesi, düğmeler ve sayım sırası notu. Mobilde kartlar alt alta. */
.sonuc-blok { margin: 16px 0 0; padding: 24px; }
.sonuc-baslik { margin: 0 0 16px; font-family: var(--serif); font-weight: 600; font-size: var(--yz-govde); line-height: var(--sa-govde); color: var(--murekkep-2); }
.sonuc-kartlar { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.sonuc-kart { padding: 16px 24px; background: var(--zemin); border: 1px solid var(--cizgi); border-radius: 6px; display: grid; gap: 8px; align-content: start; }
.sonuc-kart > * { margin: 0; min-width: 0; }
.sonuc-kart .ad, .sonuc-kart .neden { font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); color: var(--murekkep-2); }
.sonuc { font-family: var(--serif); font-size: var(--yz-baslik); font-weight: 600; line-height: var(--sa-baslik); margin: 0; min-height: var(--sa-baslik); }
/* Sonuç renkleri: yeşil yalnızca "Kabul edilirdi"; vetoyla "Düştü" ret kırmızısı; "Yeni üyelerin oyuna bağlı" ikincil;
   önerilen sistemde çoğunluk olmadan düşme (veto değil) mürekkep */
.sonuc.kabul { color: var(--kabul); }
.sonuc.dustu { color: var(--vurgu); }
.sonuc.bagli { color: var(--murekkep-2); }
.sonuc.yok { color: var(--murekkep); }
.sonuc.belirsiz { color: var(--murekkep-2); }
.sonuc-blok .fark { margin: 24px 0 0; }
.panel .ayrinti { display: grid; gap: 12px; padding-top: 12px; border-top: 1px solid var(--cizgi); font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); }
.panel .ayrinti p { margin: 0; color: var(--murekkep-2); }
details.ayarlar, details.unsur-kutu, details.karsilastir { font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); }
details.ayarlar summary, details.unsur-kutu summary, details.karsilastir summary { cursor: pointer; font-weight: 600; }
.panel .unsurlar { margin: 8px 0 0; padding: 0; list-style: none; font-size: var(--yz-kucuk); display: grid; gap: 8px; line-height: var(--sa-kucuk); }
.panel .unsurlar li { padding-left: 12px; border-left: 2px solid var(--cizgi); }
.panel .unsurlar .kunye { color: var(--murekkep-2); }
details.karsilastir ul { margin: 8px 0 0; padding-left: 16px; display: grid; gap: 8px; }
details.karsilastir .dayanak { color: var(--murekkep-2); }
.fark { margin: 16px 0 0; font-family: var(--serif); font-size: var(--yz-govde); max-width: var(--olcu); line-height: var(--sa-govde); }
.dugmeler { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: var(--b3); margin: var(--b6) 0 0; }  /* düğmeler: web/temel.css */

/* Yapışkan sonuç şeridi */
.serit { position: sticky; bottom: 0; margin: 16px 0 0; padding: 8px 16px; background: var(--zemin); box-shadow: 0 -2px 8px rgba(19, 33, 58, .06); display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; font-size: var(--yz-kucuk); z-index: 1; line-height: var(--sa-kucuk); }
.serit b { font-family: var(--serif); font-size: var(--yz-govde); line-height: var(--sa-govde); }
.serit-metin { display: flex; flex-wrap: wrap; gap: 4px 24px; align-items: center; }
.serit .dugme { margin-left: auto; }
.serit .kabul { color: var(--kabul); }
.serit .dustu { color: var(--vurgu); }
.serit .bagli { color: var(--murekkep-2); }
.serit .yok { color: var(--murekkep); }
.serit .belirsiz { color: var(--murekkep-2); }

/* Toplu görünüm */
table { border-collapse: collapse; width: 100%; font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); }
th, td { text-align: left; padding: 8px 12px; border-top: 1px solid var(--cizgi); vertical-align: top; }
thead th { border-top: none; font: 600 var(--yz-kucuk)/var(--sa-kucuk) var(--sans); color: var(--murekkep-2); }
td.sayi, th.sayi { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tablo-kap { overflow-x: auto; }
.tablo-not { font-size: var(--yz-kucuk); color: var(--murekkep-2); margin: 8px 0 0; max-width: var(--olcu); line-height: var(--sa-kucuk); }

/* Sınırlar: kutusuz iki cümle, panellerin altında */
.sinirlar-not { margin: 32px 0 0; font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); color: var(--murekkep-2); max-width: var(--olcu); }
.gorunmez { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 760px) {
  body { font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); }
  .kap { padding: 0 16px 48px; }
  .paneller { grid-template-columns: 1fr; grid-template-rows: none; }
  .panel { padding: 16px; grid-template-rows: auto; grid-row: auto; }
  .sonuc-blok { padding: 16px; }
  .sonuc-kartlar { grid-template-columns: 1fr; }
  .sonuc-kart { padding: 16px; }
  .serit { padding: 8px 12px; }
}

/* Sayfa üstü ve giriş (temel.css basamakları): üstte 48 px (dar ekranda 32 px), ilk bölüme 48 px */
.giris { padding: var(--b12) 0 var(--b12); }
@media (max-width: 760px) { .giris { padding-top: var(--b8); } }
</style>
</head>
<body data-sayfa="simulasyon">
<header id="cubuk" class="cubuk"></header>
<div class="kap">
  <header class="giris">
    <h1 data-t="baslik"></h1>
    <p data-t="giris"></p>
    <ol class="adimlar" id="adimlar" aria-label="">
      <li data-adim="1"><span class="no">1</span><span data-t="adim.1"></span></li>
      <li data-adim="2"><span class="no">2</span><span data-t="adim.2"></span></li>
      <li data-adim="3"><span class="no">3</span><span data-t="adim.3"></span></li>
    </ol>
  </header>

  <main>
    <section aria-labelledby="h-secim">
      <h2 id="h-secim" data-t="h.secim"></h2>
      <p class="aciklama" data-t="ornek.baslik"></p>
      <div class="ornekler" id="ornekler"></div>
      <div class="secim-alani">
        <div class="secim">
          <div><label for="f-konu" data-t="f.konu"></label><select id="f-konu"></select></div>
          <div><label for="f-yil" data-t="f.yil"></label><select id="f-yil"></select></div>
          <div><label for="f-uye" data-t="f.uye"></label><select id="f-uye"></select></div>
        </div>
        <p class="bildirim" id="bildirim" role="status" aria-live="polite"></p>
        <div class="liste" id="liste">
          <div class="liste-bas"><span class="sayi" id="eslesen"></span><span class="gez"><button type="button" id="onceki"></button><span class="konum" id="konum"></span><button type="button" id="sonraki"></button><button type="button" id="rastgele" data-t="f.rastgele"></button></span></div>
          <label for="f-kayit" data-t="f.kayit"></label><select id="f-kayit"></select>
        </div>
        <div class="bos-sonuc" id="bos" hidden><p data-t="bos.metin"></p><button type="button" id="temizle" data-t="bos.temizle"></button></div>
        <div class="kayit-ozet" id="kayit-ozet"></div>
      </div>
    </section>

    <section aria-labelledby="h-paneller" id="paneller-bolum">
      <h2 id="h-paneller" class="gorunmez" data-t="h.paneller"></h2>
      <div class="paneller">
        <article class="panel kutu" id="panel-oneri" aria-labelledby="h-oneri">
          <h2 id="h-oneri" data-t="p.oneri"></h2>
          <p class="kural" data-t-html="p.oneriKural"></p>

    $("#kayit-ozet").hidden = false;
    const belgeler = k.belgeler.map((b) => bag(b.kod)).join(", ");
    const ulkeler = k.kapali ? "" : `<div class="ulke-secim"><span>${k.uyeler.length > 1 ? t("ulkeSec") : t("ulkeTek")}</span>${k.uyeler.map((u) =>
      `<button type="button" data-ulke="${u}" aria-pressed="${durum.ulke === u}"><span class="nokta" style="background:${UYELER[u].renk}"></span>${uyeAd(u)}</button>`).join("")}</div>`;
    const notu = ornekMi(k) ? `<p class="ornek-notu">${esc(t("ornekNotu", { boy: konseyBuyuklugu(k), lehte: k.oy.lehte, ek: sayiEki(k.oy.lehte, "i") }))}</p>` : "";
    $("#kayit-ozet").innerHTML = `<div class="tarih">${tarihUzun(k.tarih)}, ${esc(konuAd(k.konu))}</div><div class="gundem" ${DIL === "en" ? 'lang="en"' : ""}>${esc(baslik(k))}</div><div class="belgeler">${belgeler}</div>${ulkeler}${notu}`;
    $("#kayit-ozet").querySelectorAll("[data-ulke]").forEach((b) => b.addEventListener("click", () => {
      durum.ulke = b.dataset.ulke;
      $("#kayit-ozet").querySelectorAll("[data-ulke]").forEach((x) => x.setAttribute("aria-pressed", x === b));
      goster(false);
    }));
  }

  // ---------- Adım göstergesi ----------
  function adim(n) {
    document.querySelectorAll("#adimlar li").forEach((li) => { const a = +li.dataset.adim; li.classList.toggle("tamam", a < n); if (a === n) li.setAttribute("aria-current", "step"); else li.removeAttribute("aria-current"); });
  }

  // ---------- Sayım ----------
  let zamanlayici = [];
  const temizle = () => { zamanlayici.forEach(clearTimeout); zamanlayici = []; };
  function oyListesi(k) {
    // Sıra: lehte, aleyhte (veto eden üyeler önce), çekimser, oylamaya katılmayan. Kayıtta üye bazlı sıra olmadığı için sayım sırası gösterimdir.
    const boy = konseyBuyuklugu(k), oy = k.oy;
    const L = [];
    for (let i = 0; i < oy.lehte; i++) L.push({ tur: "lehte" });
    k.uyeler.forEach((u) => L.push({ tur: "aleyhte", uye: u }));
    for (let i = k.uyeler.length; i < oy.aleyhte; i++) L.push({ tur: "aleyhte" });
    for (let i = 0; i < oy.cekimser; i++) L.push({ tur: "cekimser" });
    for (let i = oy.lehte + oy.aleyhte + oy.cekimser; i < boy; i++) L.push({ tur: "katilmadi" });
    return L;
  }
  const kisa = { SSCB: "SU", RUS: "RU", USA: "US", GBR: "UK", FRA: "FR", CHN: "CN" };
  const ALANLAR = ["mevcut", "oneri"];
  // Yapışkan şerit yalnızca bir sonuç varken ve sonuç kartları ekran dışındayken görünür
  let seritDolu = false, kartlarGorunur = true;
  const seritGuncelle = () => { $("#serit").hidden = !seritDolu || kartlarGorunur; };
  if ("IntersectionObserver" in window) {
    new IntersectionObserver((g) => { kartlarGorunur = g[g.length - 1].isIntersecting; seritGuncelle(); }).observe($("#sonuc-kartlar"));
  }
  function panelleriTemizle(seritKalsin) {
    ALANLAR.forEach((a) => { $("#sayim-" + a).innerHTML = ""; $("#sayac-" + a).textContent = ""; $("#sonuc-" + a).className = "sonuc"; $("#sonuc-" + a).textContent = ""; $("#aciklama-" + a).textContent = ""; });
    $("#karsilastir-liste").innerHTML = ""; $("#fark").hidden = true;
    // Şeritten yeniden sayımda şerit ve odaktaki düğmesi yerinde kalır; sonuç yerine "Sayılıyor…" yazar
    if (seritKalsin && seritDolu) $("#serit-metin").textContent = t("r.sayiliyor");
    else { seritDolu = false; $("#serit-metin").innerHTML = ""; }
    seritGuncelle();
    $("#yeni-not").hidden = true; $("#yeni-not").textContent = "";
  }
  function goster(animasyon, kaynak) {
    temizle();
    panelleriTemizle(kaynak === "serit");
    sayimSuruyor(false);
    const k = durum.kayit;
    $("#paneller-bolum").hidden = !k;
    if (!k) { adim(1); return; }
    const boy = konseyBuyuklugu(k);
    const yirmi = durum.uye === "kitap20";
    const esik = yirmi ? esik20(durum.esik) : ESIKLER[durum.esik](boy);
    const belge = (k.belgeler.find((b) => b.tur === "taslak") || k.belgeler[0] || {}).kod;
    $("#h-sonuc").textContent = t("sonuc.baslik", { tarih: tarihUzun(k.tarih), belge });
    $("#ad-oneri").textContent = `${t("p.oneri")}: ${t("kart.oneri", { boy: yirmi ? 20 : boy, esik })}`;
    $("#ad-mevcut").textContent = `${t("p.mevcut")}: ${t("kart.mevcut")}`;
    if (!sayilabilir(k)) {
      ALANLAR.forEach((a) => { $("#sonuc-" + a).className = "sonuc belirsiz"; $("#sonuc-" + a).textContent = t("r.oyYok"); $("#aciklama-" + a).textContent = t(k.kapali ? "a.kapali" : "a.oyYok"); });
      $("#karsilastir-liste").innerHTML = `<li>${t("k.yok")}</li>`;
      adim(1);
      return;
    }
    adim(2);
    const L = oyListesi(k), oy = k.oy;
    const katilmadi = boy - oy.lehte - oy.aleyhte - oy.cekimser;
    const sayacMetni = t("sayac", { lehte: oy.lehte, aleyhte: oy.aleyhte, cekimser: oy.cekimser, katilmadi });
    const s20 = yirmi ? sonuc20(oy.lehte, boy, esik) : null;
    const ulkeAdi = durum.ulke ? uyeAdMetin(durum.ulke) : k.uyeler.map(uyeAdMetin).join(DIL === "tr" ? " ve " : " and ");
    const sonucOneri = yirmi ? s20.tur : (oy.lehte >= esik ? "kabul" : "cogunlukYok");
    ALANLAR.forEach((a) => {
      // Mevcut sistemde daimî üyenin ret oyu veto (kırmızı); önerilen sistemde aynı oy sıradan bir ret oyu (mürekkep)
      $("#sayim-" + a).innerHTML = L.map((o, i) => `<span class="oy ${o.uye && a === "mevcut" ? "veto" : o.tur}${o.uye && o.uye === durum.ulke ? " secili" : ""}" data-i="${i}"${o.uye ? ` title="${esc(uyeAd(o.uye))}"` : ""}>${o.uye ? kisa[o.uye] : ""}</span>`).join("")
        // 20 üyeli Konsey: kayıtta olmayan üyeler kesikli boş kare; sayılmaz, sayaca girmez
        + (a === "oneri" && yirmi ? `<span class="yeni-grup" aria-hidden="true">${'<span class="oy yeni"></span>'.repeat(s20.yeni)}</span>` : "");
      $("#sayac-" + a).textContent = sayacMetni;
      $("#sonuc-" + a).textContent = animasyon && !azHareket ? t("r.sayiliyor") : "";
    });
    if (yirmi) { $("#yeni-not").textContent = t("yeni.not", { yeni: sayi(s20.yeni) }); $("#yeni-not").hidden = false; }
    const bitir = () => {
      $("#sonuc-mevcut").className = "sonuc dustu"; $("#sonuc-mevcut").textContent = t("r.dustu");
      $("#aciklama-mevcut").textContent = t("a.mevcut", { uye: ulkeAdi, lehte: sayi(oy.lehte), n: durum.ulke ? 1 : k.uyeler.length });
      const so = $("#sonuc-oneri");
      so.className = "sonuc " + (sonucOneri === "kabul" ? "kabul" : sonucOneri === "bagli" ? "bagli" : "yok");
      so.textContent = t(sonucOneri === "kabul" ? "r.kabul" : sonucOneri === "bagli" ? "r.bagli" : "r.cogunlukYok");
      $("#aciklama-oneri").textContent = yirmi
        ? t({ kabul: "a.kabul20", bagli: "a.bagli20", cogunlukYok: "a.yok20" }[sonucOneri], { lehte: sayi(oy.lehte), esik: sayi(esik), yeni: sayi(s20.yeni), k: sayi(s20.k), ek: sayiEki(s20.k, "i") })
        : t(sonucOneri === "kabul" ? "a.oneriKabul" : "a.oneriYok", { lehte: sayi(oy.lehte), esik, boy });
      $("#karsilastir-liste").innerHTML = [["k.g4", "k.g4d"], ["k.ufc", "k.ufcd"], ["k.ez", "k.ezd"]].map(([m, d]) =>
        `<li>${t(m, { uye: esc(ulkeAdi) })} <span class="dayanak">${t(d)}</span></li>`).join("");
      const n = sayi(oy.lehte + oy.aleyhte + oy.cekimser);
      $("#fark").textContent = sonucOneri === "bagli" ? t("fark.bagli", { n, k: sayi(s20.k) }) : t("fark", { n }); $("#fark").hidden = false;
      const seritOneri = sonucOneri === "bagli" ? t("serit.bagli", { k: sayi(s20.k) }) : so.textContent;
      $("#serit-metin").innerHTML = `<span>${t("serit.oneri")} <b class="${so.className.replace("sonuc ", "")}">${esc(seritOneri)}</b></span><span>${t("serit.mevcut")} <b class="dustu">${t("r.dustu")}</b></span>`;
      seritDolu = true; seritGuncelle();
      sayimSuruyor(false);
      adim(3);
    };
    if (!animasyon || azHareket) {
      document.querySelectorAll(".oy").forEach((e) => e.classList.add("goster"));
      bitir();
      return;
    }
    sayimSuruyor(true);
    const ilkVeto = L.findIndex((o) => o.tur === "aleyhte" && o.uye);
    L.forEach((o, i) => zamanlayici.push(setTimeout(() => {
      ALANLAR.forEach((a) => $(`#sayim-${a} [data-i="${i}"]`).classList.add("goster"));
      if (i === ilkVeto) { $("#sonuc-mevcut").className = "sonuc dustu"; $("#sonuc-mevcut").textContent = t("r.dustu"); }
      if (i === L.length - 1) bitir();
    }, 140 * (i + 1))));
  }

  // ---------- Toplu görünüm ----------
  // Kayıtlı üyelerle üç eşik ve kitaptaki 20 üyeli Konsey'le üç eşik; sayılar sayfa açılırken veri setinden hesaplanır
  function topluYaz() {
    const oylu = kayitlar.filter(sayilabilir), kapali = kayitlar.filter((k) => k.kapali), oysuz = kayitlar.filter((k) => !k.kapali && !k.oy);
    const satir = (ad, kesin, bagli, dustu, secili) => `<tr><th scope="row">${ad}${secili ? " ▸" : ""}</th><td class="sayi">${sayi(kesin)}</td><td class="sayi">${bagli === null ? "–" : sayi(bagli)}</td><td class="sayi">${sayi(dustu)}</td><td class="sayi">${sayi(kapali.length)}</td><td class="sayi">${sayi(oysuz.length)}</td><td class="sayi">${sayi(kayitlar.length)}</td></tr>`;
    const ADLAR = ["cogunluk", "ucteiki", "salt"];
    const satirlar = [satir(t("t.mevcutAd"), 0, null, oylu.length, false)];
    const ozet = {};
    ADLAR.forEach((e) => {
      const kesin = oylu.filter((k) => k.oy.lehte >= ESIKLER[e](konseyBuyuklugu(k))).length;
      ozet["kayitli." + e] = { kesin, bagli: 0 };
      satirlar.push(satir(t("t.oneriAd", { esik: t("e." + e) }), kesin, null, oylu.length - kesin, durum.uye === "kayitli" && e === durum.esik));
    });
    ADLAR.forEach((e) => {
      const turler = oylu.map((k) => sonuc20(k.oy.lehte, konseyBuyuklugu(k), esik20(e)).tur);
      const kesin = turler.filter((x) => x === "kabul").length, bagli = turler.filter((x) => x === "bagli").length;
      ozet["kitap20." + e] = { kesin, bagli };
      satirlar.push(satir(t("t.oneri20Ad", { esik: t("e20." + e, { e: sayi(esik20(e)) }) }), kesin, bagli, turler.length - kesin - bagli, durum.uye === "kitap20" && e === durum.esik));
    });
    $("#h-toplu").textContent = t("h.toplu", { n: sayi(kayitlar.length) });
    const o = ozet[durum.uye + "." + durum.esik];
    $("#toplu-ozet").textContent = durum.uye === "kitap20"
      ? t("toplu.ozet20", { kesin: sayi(o.kesin), bagli: sayi(o.bagli), n: sayi(kayitlar.length), esik: t("e20." + durum.esik, { e: sayi(esik20(durum.esik)) }), kapali: sayi(kapali.length) })
      : t("toplu.ozet", { kabul: sayi(o.kesin), n: sayi(kayitlar.length), esik: t("e." + durum.esik), kapali: sayi(kapali.length) });
    $("#toplu").innerHTML = `<thead><tr><th>${t("t.sistem")}</th><th class="sayi">${t("t.kesin")}</th><th class="sayi">${t("t.bagli")}</th><th class="sayi">${t("t.dustu")}</th><th class="sayi">${t("t.kapali")}</th><th class="sayi">${t("t.oyYok")}</th><th class="sayi">${t("t.toplam")}</th></tr></thead><tbody>${satirlar.join("")}</tbody>`;
    const [a, b, c] = ADLAR.map((e) => sayi(esik20(e)));
    $("#toplu-not").textContent = t("t.not", { n: sayi(oylu.length), kapali: sayi(kapali.length), oysuz: sayi(oysuz.length), a, b, c });
  }

  // ---------- Açılış: ?kayit=<id> varsa o kayıt, yoksa ilk öne çıkan örnek ----------
  filtreleriCiz();
  const istenen = kayitBul(new URLSearchParams(location.search).get("kayit") || "");
  const ilk = istenen || (ORNEKLER.length ? kayitBul(ORNEKLER[0].id) : null) || kayitlar[0];
  sec(ilk);
  listeYaz();
  topluYaz();
})();
</script>
</body>
</html>
