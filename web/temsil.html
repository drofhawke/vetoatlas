* { box-sizing: border-box; }

.cubuklar .cb .secilmis { background: var(--g-secilmis); }
.cubuklar .cb .daimi { background: var(--g-daimi); }
.cubuklar .deger { font-variant-numeric: tabular-nums; text-align: right; }
.oranlar { margin: 12px 0 0; font-size: var(--yz-kucuk); color: var(--murekkep-2); line-height: var(--sa-kucuk); }

.lejant span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 8px; vertical-align: -1px; background: var(--r, var(--bos)); }
table { border-collapse: collapse; width: 100%; font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--cizgi); vertical-align: top; }
th { font-weight: 600; color: var(--murekkep-2); font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); }
td.s, th.s { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.not-liste { font-size: var(--yz-kucuk); color: var(--murekkep-2); padding-left: 24px; line-height: var(--sa-kucuk); }
.not-liste li { margin: 4px 0; }
/* Harita: seçilen grubun üyeleri (orta ton) ve Konsey koltukları (daimî mürekkep, seçilmiş ikincil; koltuk çubuğuyla aynı);
   öteki üyeler açık ton, BM üyesi olmayan alanlar boş (yalnızca çizgi). Açıklık sırası iki temada da adım adım (OKLab ΔE ≥ 20). */
.secimler { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
.secim-dugme, .arac-dugme { display: inline-flex; align-items: center; gap: 8px; font: 500 var(--yz-kucuk)/var(--sa-kucuk) var(--sans); color: var(--murekkep);
  background: transparent; border: 1px solid var(--cizgi); border-radius: 999px; padding: 8px 16px; cursor: pointer; }
.secim-dugme .sayi { color: var(--murekkep-2); font-variant-numeric: tabular-nums; }
.secim-dugme[aria-pressed="true"], .arac-dugme[aria-pressed="true"] { background: var(--murekkep); color: var(--zemin); border-color: var(--murekkep); }
.secim-dugme[aria-pressed="true"] .sayi { color: inherit; opacity: .75; }
.harita { position: relative; margin: 0; }
.harita svg { display: block; width: 100%; height: auto; touch-action: manipulation; }
/* Yakınlaştırma: harita ve veri değişmez, yalnızca görünüm (viewBox) büyür. Düğmeler sol altta (açık okyanus); yakınken
   harita sürüklenir ve sayfa yerine harita kayar (touch-action: none). */
.harita svg.yakin { cursor: grab; touch-action: none; }
.harita svg.suruk { cursor: grabbing; }
.harita-yakin { position: absolute; left: 0; bottom: 0; display: flex; gap: 4px; }
.yakin-dugme { min-width: 32px; height: 32px; padding: 0 8px; font: 600 var(--yz-kucuk)/var(--sa-kucuk) var(--sans); color: var(--murekkep);
  background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 6px; cursor: pointer; }
.yakin-dugme:disabled { color: var(--murekkep-2); opacity: .5; cursor: default; }
/* Araçlar: ülke arama, nüfus balonları, bağlantı paylaşma */
.harita-araclar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 0 16px; font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); }
.ulke-ara { display: inline-flex; align-items: center; gap: 8px; color: var(--murekkep-2); }
.ulke-ara input { width: 224px; max-width: 100%; height: 40px; padding: 0 16px; font: 400 var(--yz-kucuk)/var(--sa-kucuk) var(--sans); color: var(--murekkep);
  background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 999px; }
.arac-durum { color: var(--murekkep-2); overflow-wrap: anywhere; }
/* Ülke kartı: tıklanan ya da aranan ülke; seçili ülke haritada mürekkep çizgiyle */
.ulke-karti { margin: 16px 0 0; }
.ulke-karti-bas { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
.ulke-karti-bas .yakin-dugme { margin-left: auto; }
.ulke-karti h3 { margin: 0; }
.ulke-karti-bas a { font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); }
.ulke-bilgi { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr)); gap: 12px 24px; margin: 12px 0 0; }
.ulke-bilgi dt { font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); color: var(--murekkep-2); }
.ulke-bilgi dd { margin: 0; font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); font-variant-numeric: tabular-nums; }
.ulke-not { font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); color: var(--murekkep-2); margin: 12px 0 0; }
.harita .secili { fill: none; stroke: var(--murekkep); stroke-width: 2px; pointer-events: none; transition: none; }
.harita circle.secili-nokta { stroke: var(--murekkep); stroke-width: 2px; }
/* Nüfus balonları: daire alanı nüfusla orantılı, ekranda sabit boyda (yakınlaşınca büyümez); kara parçaları nötr, renk dairede */
.harita .balonlar { display: none; }
.harita svg.balonlu .balonlar { display: inline; }
.harita svg.balonlu path[data-k] { fill: var(--bos); }
.harita svg.balonlu circle[data-tur="nokta"] { display: none; }
.harita .balonlar circle.h-diger { fill: none; stroke: var(--murekkep-2); stroke-opacity: .6; }
.harita-lejant.balonlu span::before { border-radius: 50%; }
.harita-lejant.balonlu .bos-alan::before { border-radius: 2px; }  /* üye olmayan kara alanı, daire değil */
.harita-lejant .balon-diger::before { background: transparent; border: 1px solid var(--murekkep-2); }
.harita-lejant .balon-olcek::before { display: none; }
.harita-lejant .balon-olcek svg { vertical-align: middle; margin: 0 4px; }
.harita-lejant .balon-olcek circle { fill: none; stroke: var(--murekkep-2); }
.harita path, .harita circle { fill: var(--bos); stroke: var(--zemin); stroke-width: .5px; vector-effect: non-scaling-stroke; transition: fill .4s ease; }
.harita .uye-degil { fill: var(--zemin); stroke: var(--cizgi); }
.harita [data-k] { cursor: pointer; }
.harita .h-grup { fill: var(--h-grup); }
.harita .h-secilmis { fill: var(--g-secilmis); }
.harita .h-daimi { fill: var(--g-daimi); }
.harita circle { stroke-width: 1px; }
.harita .vurgu { fill: none; stroke: var(--murekkep); stroke-width: 1.5px; pointer-events: none; transition: none; }
.harita-alt { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px 32px; align-items: start; margin: 16px 0 0; }
.harita-ozet { font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); margin: 0; max-width: var(--olcu); }
.harita-ozet b { font-weight: 600; font-variant-numeric: tabular-nums; }
.harita-ozet a { white-space: nowrap; }
.harita-lejant { display: flex; flex-direction: column; gap: 4px; font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); color: var(--murekkep-2); margin: 0; }
.harita-lejant span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 8px; vertical-align: -1px; background: var(--r); box-sizing: border-box; }
.harita-lejant .bos-alan::before { background: var(--zemin); border: 1px solid var(--murekkep-2); }
.harita-not { font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); color: var(--murekkep-2); margin: 12px 0 0; }
.ipucu { position: absolute; pointer-events: none; background: var(--murekkep); color: var(--zemin); font-size: var(--yz-kucuk); line-height: var(--sa-kucuk);
  padding: 8px 12px; border-radius: 4px; width: max-content; max-width: 280px; z-index: 5; opacity: 0; transition: opacity .1s; }
.ipucu.acik { opacity: 1; }
.ipucu strong { display: block; font-weight: 600; }
@media (max-width: 760px) { .harita-alt { grid-template-columns: minmax(0, 1fr); } .harita-lejant { flex-direction: row; flex-wrap: wrap; gap: 4px 16px; } }
@media (prefers-reduced-motion: reduce) { .cubuklar .cb span, .harita path, .harita circle, .ipucu { transition: none; } }
@media (max-width: 560px) { .kap { padding: 0 16px 48px; } .cubuklar { grid-template-columns: 96px 1fr 60px; } table { font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); } th, td { padding: 8px 8px; } }


details.tablo-ac > summary { cursor: pointer; font-size: var(--yz-kucuk); color: var(--murekkep-2); margin: 8px 0 8px; width: max-content; line-height: var(--sa-kucuk); }

.kap p, .kap dd, .kap blockquote, .kap ul:not([class]) > li, .kap ol:not([class]) > li { max-width: var(--olcu); }
.giris { padding-top: 64px; }
details.yontem { font-size: var(--yz-kucuk); max-width: var(--olcu); margin: 8px 0 0; line-height: var(--sa-kucuk); }
details.yontem summary { cursor: pointer; font-weight: 600; font-family: var(--sans); }
details.yontem p { font-family: var(--sans); font-size: var(--yz-kucuk); color: var(--murekkep-2); margin: 8px 0 0; line-height: var(--sa-kucuk); }



/* Sayfa üstü ve giriş (temel.css basamakları): üstte 48 px (dar ekranda 32 px), ilk bölüme 48 px */
.giris { padding: var(--b12) 0 var(--b12); }
@media (max-width: 760px) { .giris { padding-top: var(--b8); } }

    // Nüfus balonları da ekranda sabit boyda: en büyük nüfus (2023) 16–40 px yarıçap (haritanın genişliğine göre), alan nüfusla orantılı
    const NUFUS_EN = Math.max(...V.uyeler.map((u) => u.nufus_2023));
    const balonPx = (n) => Math.min(40, Math.max(16, svg.clientWidth * 0.035)) * Math.sqrt(n / NUFUS_EN);
    const noktaBoyu = () => {
      if (!svg.clientWidth) return;  // görünmezken (ör. gizli çerçeve) ölçü yok
      const birim = gor.w / svg.clientWidth;  // ekran pikseli başına harita birimi
      svg.querySelectorAll('circle[data-tur="nokta"]').forEach((c) => c.setAttribute("r", (3.5 * birim).toFixed(2)));
      svg.querySelectorAll('circle[data-tur="balon"]').forEach((c) => c.setAttribute("r", (balonPx(UYE.get(c.dataset.k).nufus_2023) * birim).toFixed(2)));
    };
    new ResizeObserver(() => { noktaBoyu(); if (balon) lejantCiz(); }).observe(svg);
    const genislik = (gw) => Math.min(TAM.w, Math.max(TAM.w / EN_COK, gw));
    const sinirla = (v) => {
      const gw = genislik(v.w), gh = gw * TAM.h / TAM.w;
      return { w: gw, h: gh, x: Math.min(Math.max(v.x, TAM.x), TAM.x + TAM.w - gw), y: Math.min(Math.max(v.y, TAM.y), TAM.y + TAM.h - gh) };
    };
    const uygula = (v) => {
      gor = v;
      svg.setAttribute("viewBox", `${v.x.toFixed(2)} ${v.y.toFixed(2)} ${v.w.toFixed(2)} ${v.h.toFixed(2)}`);
      const yakin = v.w < TAM.w - 0.01;
      svg.classList.toggle("yakin", yakin);
      dugme("art").disabled = v.w <= TAM.w / EN_COK + 0.01;
      dugme("azalt").disabled = dugme("tum").disabled = !yakin;
      noktaBoyu();
    };
    const git = (hedef, hemen) => {
      hedef = sinirla(hedef);
      cancelAnimationFrame(kare);
      if (hemen || azHareket()) return uygula(hedef);
      const bas = { ...gor }, t0 = performance.now();
      const adim = (an) => {
        const p = Math.min(1, (an - t0) / 300), e = 1 - (1 - p) ** 3;
        uygula({ x: bas.x + (hedef.x - bas.x) * e, y: bas.y + (hedef.y - bas.y) * e, w: bas.w + (hedef.w - bas.w) * e, h: bas.h + (hedef.h - bas.h) * e });
        if (p < 1) kare = requestAnimationFrame(adim);
      };
      kare = requestAnimationFrame(adim);
    };
    // Ekrandaki nokta -> harita birimi. Yakınlaşırken (mx, my) noktası ekranda yerinde kalır (iki parmak, Ctrl + kaydırma) ya da
    // ortaya gelir (çift tıklama ve çift dokunma: tıklanan yer görünümün ortasında)
    const haritada = (cx, cy) => { const r = svg.getBoundingClientRect(); return [gor.x + (cx - r.left) / r.width * gor.w, gor.y + (cy - r.top) / r.height * gor.h]; };
    const yakinlas = (kat, mx = gor.x + gor.w / 2, my = gor.y + gor.h / 2, hemen = false, ortala = false) => {
      const gw = genislik(gor.w / kat), gh = gw * TAM.h / TAM.w;
      git(ortala ? { x: mx - gw / 2, y: my - gh / 2, w: gw, h: gh }
        : { x: mx - (mx - gor.x) / gor.w * gw, y: my - (my - gor.y) / gor.h * gh, w: gw, h: gh }, hemen);
    };
    const durum = (u) => {
      const koltuk = u.gk ? (u.gk.tur === "daimi" ? "h-daimi" : "h-secilmis") : "";
      if (secim === "GK") return koltuk || "h-diger";
      return u.grup === secim ? koltuk || "h-grup" : "h-diger";
    };
    const secimler = [["GK", t("konsey"), V.uyeler.filter((u) => u.gk).length], ...V.gruplar.map((g) => [g.kod, g.ad[DIL], g.uye_sayisi])];
    $("#harita-secim").innerHTML = secimler.map(([k, ad, n]) => `<button type="button" class="secim-dugme" data-secim="${k}" aria-pressed="false">${esc(ad)} <span class="sayi">${n}</span></button>`).join("");
    const kume = () => V.uyeler.filter((u) => (secim === "GK" ? u.gk : u.grup === secim)).map((u) => u.iso3).sort(sirala);
    const ciz = () => {
      ogeler.forEach((e) => e.setAttribute("class", durum(UYE.get(e.dataset.k)) + (e.dataset.k === ulke && e.dataset.tur === "nokta" ? " secili-nokta" : "")));
      document.querySelectorAll("#harita-secim .secim-dugme").forEach((d) => d.setAttribute("aria-pressed", String(d.dataset.secim === secim)));
      const uyeler = kume().map((k) => UYE.get(k));
      const d = uyeler.filter((u) => u.gk && u.gk.tur === "daimi"), s = uyeler.filter((u) => u.gk && u.gk.tur === "secilmis");
      const adlar = (L) => L.map((u) => esc(AD.get(u.iso3))).join(", ");
      let ozet, etiket;
      if (secim === "GK") {
        ozet = `${esc(t("o.konsey", { d: d.length, s: s.length }))} ${esc(t("o.daimi"))}: ${adlar(d)}. ${esc(t("o.secilmis"))}: ${s.map((u) => `${esc(AD.get(u.iso3))} (${u.gk.donem_sonu})`).join(", ")}.`;
        etiket = t("o.konsey", { d: d.length, s: s.length });
      } else {
        const g = GRUP.get(secim);
        ozet = `${esc(t("o.grup", { g: g.ad[DIL], n: g.uye_sayisi, nufus: yuzde(g.paylar.nufus_2023), uye: yuzde(g.paylar.uye) }))} ${esc(t("o.koltuk", { d: d.length, s: s.length }))}${d.length + s.length ? ` (${adlar([...d, ...s])})` : ""}. <a href="#grup-${secim}">${esc(t("o.kart"))}</a>`;
        etiket = t("o.grup", { g: g.ad[DIL], n: g.uye_sayisi, nufus: yuzde(g.paylar.nufus_2023), uye: yuzde(g.paylar.uye) });
      }
      $("#harita-ozet").innerHTML = ozet;
      svg.setAttribute("aria-label", t("harita.etiket", { s: etiket }));
      lejantCiz();
      $("#harita-liste-baslik").textContent = t("liste", { n: uyeler.length });
      $("#harita-tablo").innerHTML = `<thead><tr><th>${esc(t("t.ulke"))}</th><th>${esc(t("t.grup"))}</th><th class="s">${esc(t("t.nufus23"))}</th><th>${esc(t("t.konsey"))}</th></tr></thead><tbody>`
        + uyeler.map((u) => `<tr><td>${esc(AD.get(u.iso3))}</td><td>${esc(GRUP.get(u.grup).ad[DIL])}</td><td class="s">${sayi(u.nufus_2023)}</td><td>${u.gk ? esc(u.gk.tur === "daimi" ? t("o.daimi") : `${t("t.secilmis")} (${u.gk.donem_sonu})`) : ""}</td></tr>`).join("")
        + "</tbody>";
      durumYaz();
    };
    function lejantCiz() {
      const lejant = [["--g-daimi", t("l.h.daimi")], ["--g-secilmis", t("l.h.secilmis")]];
      if (secim !== "GK") lejant.push(["--h-grup", t("l.h.grup", { g: GRUP.get(secim).ad[DIL] })]);
      if (!balon) lejant.push(["--bos", t("l.h.diger")]);
      const daire = (n) => { const r = balonPx(n); return `<svg width="${(2 * r + 2).toFixed(1)}" height="${(2 * r + 2).toFixed(1)}" aria-hidden="true"><circle cx="${(r + 1).toFixed(1)}" cy="${(r + 1).toFixed(1)}" r="${r.toFixed(1)}"/></svg>`; };
      const el = $("#harita-lejant");
      el.classList.toggle("balonlu", balon);
      el.innerHTML = lejant.map(([r, ad]) => `<span style="--r:var(${r})">${esc(ad)}</span>`).join("")
        + (balon ? `<span class="balon-diger">${esc(t("l.h.diger"))}</span>` : "")
        + `<span class="bos-alan">${esc(t("l.h.degil"))}</span>`
        + (balon ? `<span class="balon-olcek">${esc(t("l.balon"))} ${daire(1e6)}${esc(t("l.milyar"))} ${daire(1e5)}${esc(t("l.yuzmilyon"))}</span>` : "");
    }
    $("#harita-secim").addEventListener("click", (e) => { const d = e.target.closest(".secim-dugme"); if (d) { secim = d.dataset.secim; ciz(); } });
    // BM üyesi olmayan alanlar: BM'nin kullandığı adla (Türkiye'nin tanıdığı devletler Dışişleri Bakanlığı'nın adıyla), altında durumu (üye değil, gözlemci
    // devlet, kendi kendini yönetmeyen toprak). Bağlı olunan devlet ve anlaşmazlıklar yazılmaz; "sessiz" alanın adı gösterilmez.
    const AL = new Map(H.alanlar.map((a) => [a.k, a]));
    const alanAdi = (a) => a[DIL];
    const alanDurumu = (a) => t({ uye_degil: "a.degil", gozlemci: "a.gozlemci", kyt: "a.kyt" }[a.durum]);
    const alanYollari = (ad) => H.alanlar.filter((a) => a[DIL] === ad && a.d).map((a) => a.d).join("");  // Batı Sahra iki parça
    const ipucuYaz = (html, ex, ey) => {
      const b = $("#harita").getBoundingClientRect();
      ipucu.innerHTML = html;
      ipucu.classList.add("acik");
      let px = ex - b.left + 14;
      if (px + ipucu.offsetWidth > b.width) px = ex - b.left - ipucu.offsetWidth - 14;
      ipucu.style.left = `${Math.max(0, px)}px`; ipucu.style.top = `${Math.max(0, ey - b.top + 14)}px`;
    };
    const ipucuGoster = (k, ex, ey) => {
      const u = UYE.get(k);
      const satirlar = [GRUP.get(u.grup).ad[DIL], t("i.nufus2", { n: nufusMetni(u.nufus_2023) })];
      if (u.gk) satirlar.push(u.gk.tur === "daimi" ? t("i.daimi") : t("i.secilmis", { y: u.gk.donem_sonu }));
      ipucuYaz(`<strong>${esc(AD.get(k))}</strong>${satirlar.map(esc).join("<br>")}`, ex, ey);
      vurgu.setAttribute("d", ogeler.filter((e) => e.dataset.k === k && e.tagName === "path").map((e) => e.getAttribute("d")).join(""));
    };
    // Nüfus: her alan ve bölge BM istatistiklerindeki kendi sayısıyla (WPP 2024, 2023)
    // 1 binin altı kişi, 10 binin altı bir ondalıklı bin (Vatikan 500 kişi, Falkland 3,5 bin)
    const nufusMetni = (bin) => (bin < 1 ? t("k.kisi", { n: sayi(Math.round(bin * 1000)) }) : bin < 10 ? t("k.bin", { n: sayi(bin, 1) })
      : bin < 1000 ? t("k.bin", { n: sayi(bin) }) : t("k.milyon", { n: sayi(bin / 1000, 1) }));
    const nufusSatiri = (x) => (x.n ? "<br>" + esc(t("i.nufus2", { n: nufusMetni(x.n) })) : "");
    const alanIpucu = (k, ex, ey) => {
      const a = AL.get(k);
      ipucuYaz(`<strong>${esc(alanAdi(a))}</strong>${esc(alanDurumu(a))}${nufusSatiri(a)}`, ex, ey);
      vurgu.setAttribute("d", alanYollari(a[DIL]));
    };
    // Ayrı sayılan bölge (ör. Réunion, Hong Kong): üyenin toprağı, nüfusu üyeye eklenmez
    const BL = new Map(H.bolgeler.map((b) => [b.k, b]));
    const bolgeDurumu = (b) => t("b.parca", { u: AD.get(b.uye) });
    const bolgeIpucu = (k, ex, ey) => {
      const b = BL.get(k);
      ipucuYaz(`<strong>${esc(b[DIL])}</strong>${esc(bolgeDurumu(b))}${nufusSatiri(b)}`, ex, ey);
      vurgu.setAttribute("d", b.d);
    };
    const ipucuGizle = () => { ipucu.classList.remove("acik"); vurgu.setAttribute("d", ""); };
    // Sürükleme ve iki parmak (yakınken); dokunmatikte çift dokunma
    const dokunus = new Map();
    let tutus = null, surukledi = false, sonDokunma = null, sonTur = "mouse", kartKaydir = 0;
    svg.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      sonTur = e.pointerType;
      dokunus.set(e.pointerId, { x: e.clientX, y: e.clientY });
      surukledi = false;
      if (dokunus.size === 2) {
        const [a, b] = [...dokunus.values()];
        tutus = { iki: true, d: Math.hypot(a.x - b.x, a.y - b.y), gor: { ...gor }, m: haritada((a.x + b.x) / 2, (a.y + b.y) / 2) };
      } else tutus = dokunus.size === 1 && svg.classList.contains("yakin") ? { x: e.clientX, y: e.clientY, gor: { ...gor } } : null;
    });
    svg.addEventListener("pointermove", (e) => {
      if (dokunus.has(e.pointerId)) dokunus.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (tutus && dokunus.has(e.pointerId)) {
        const r = svg.getBoundingClientRect();
        if (tutus.iki) {
          if (dokunus.size < 2) return;
          const [a, b] = [...dokunus.values()];
          const gw = genislik(tutus.gor.w * tutus.d / Math.max(1, Math.hypot(a.x - b.x, a.y - b.y))), gh = gw * TAM.h / TAM.w;
          const ox = ((a.x + b.x) / 2 - r.left) / r.width, oy = ((a.y + b.y) / 2 - r.top) / r.height;
          surukledi = true; ipucuGizle();
          return uygula(sinirla({ x: tutus.m[0] - ox * gw, y: tutus.m[1] - oy * gh, w: gw, h: gh }));
        }
        const dx = e.clientX - tutus.x, dy = e.clientY - tutus.y;
        if (!surukledi && Math.hypot(dx, dy) < 4) return;
        if (!surukledi) { surukledi = true; svg.setPointerCapture(e.pointerId); svg.classList.add("suruk"); ipucuGizle(); cancelAnimationFrame(kare); }
        return uygula(sinirla({ ...tutus.gor, x: tutus.gor.x - dx / r.width * tutus.gor.w, y: tutus.gor.y - dy / r.height * tutus.gor.h }));
      }
      const o = e.target.closest("[data-k], [data-a]");
      if (!o) ipucuGizle();
      else if (o.dataset.b) bolgeIpucu(o.dataset.b, e.clientX, e.clientY);
      else if (o.dataset.k) ipucuGoster(o.dataset.k, e.clientX, e.clientY);
      else alanIpucu(o.dataset.a, e.clientX, e.clientY);
    });
    const birak = (e) => {
      dokunus.delete(e.pointerId);
      if (tutus && tutus.iki && dokunus.size < 2) tutus = null;
      if (!dokunus.size) { tutus = null; svg.classList.remove("suruk"); }
    };
    svg.addEventListener("pointerup", (e) => {
      if (e.pointerType !== "mouse" && !surukledi && dokunus.size === 1) {
        const simdi = performance.now();
        if (sonDokunma && simdi - sonDokunma.t < 300 && Math.hypot(e.clientX - sonDokunma.x, e.clientY - sonDokunma.y) < 24) {
          ipucuGizle();
          clearTimeout(kartKaydir);
          yakinlas(2, ...haritada(e.clientX, e.clientY), false, true);
          sonDokunma = null;
          surukledi = true;  // ikinci dokunuşun tıklaması ipucu açmaz (küçük ekranda haritayı kapatırdı)
        } else sonDokunma = { t: simdi, x: e.clientX, y: e.clientY };
      }
      birak(e);
    });
    svg.addEventListener("pointercancel", birak);
    svg.addEventListener("pointerleave", () => { if (!surukledi) ipucuGizle(); });
    svg.addEventListener("dblclick", (e) => { e.preventDefault(); if (sonTur === "mouse") { ipucuGizle(); yakinlas(2, ...haritada(e.clientX, e.clientY), false, true); } });
    svg.addEventListener("wheel", (e) => {
      if (!e.ctrlKey) return;  // sayfa kaydırması haritada da sayfayı kaydırır
      e.preventDefault();
      yakinlas(Math.exp(-e.deltaY * 0.01), ...haritada(e.clientX, e.clientY), true);
    }, { passive: false });
    $(".harita-yakin").addEventListener("click", (e) => {
      const d = e.target.closest(".yakin-dugme");
      if (!d || d.disabled) return;
      if (d.dataset.yakin === "art") yakinlas(2);
      else if (d.dataset.yakin === "azalt") yakinlas(0.5);
      else git({ ...TAM });
    });
    svg.addEventListener("click", (e) => {
      if (surukledi) return;  // sürüklemenin sonu tıklama sayılmaz
      const al = e.target.closest("[data-a]");
      if (al) { alanIpucu(al.dataset.a, e.clientX, e.clientY); return; }  // üye olmayan alan: yalnızca ipucu (kart yok)
      const o = e.target.closest("[data-k]"); if (!o) return;
      ulkeSec(o.dataset.k, { yakin: false });
      // Dokunmatikte ipucu yerine kart: küçük ekranda ipucu haritayı kapatırdı
      if (sonTur === "mouse") (o.dataset.b ? bolgeIpucu(o.dataset.b, e.clientX, e.clientY) : ipucuGoster(o.dataset.k, e.clientX, e.clientY));
      else {
        // Kart görünmüyorsa ona kaydırılır; ama çift dokunmanın ikinci dokunuşu gelebilir: önce 350 ms beklenir (sayfa kayarsa
        // ikinci dokunuş başka ülkeye düşerdi), çift dokunma kaydırmayı iptal eder
        ipucuGizle();
        clearTimeout(kartKaydir);
        kartKaydir = setTimeout(() => { const r = kart.getBoundingClientRect(); if (r.bottom > innerHeight) kart.scrollIntoView({ block: "nearest", behavior: azHareket() ? "auto" : "smooth" }); }, 350);
      }
    });

    // Ülke kartı: grup, kabul tarihi, nüfus, bütçe ve barış gücü payı, İİT üyeliği, Konsey durumu; seçili ülke haritada çizgiyle
    const kart = $("#ulke-karti"), secili = $("#harita-secili");
    let ulke = null;
    const tarihYaz = (x) => new Intl.DateTimeFormat(YEREL, { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" }).format(new Date(x + "T00:00:00Z"));
    const payYaz = (p) => {
      if (p >= 0.01) return yuzde(p);
      const s = (100 * p).toLocaleString(YEREL, { maximumSignificantDigits: 2 });
      return DIL === "tr" ? "%" + s : s + "%";
    };
    // Bütçe ölçeği resmî değeriyle, üç ondalık (A/RES/79/249)
    const butceYaz = (x) => { const s = x.toLocaleString(YEREL, { minimumFractionDigits: 3, maximumFractionDigits: 3 }); return DIL === "tr" ? "%" + s : s + "%"; };
    const kartCiz = (k) => {
      const u = UYE.get(k), g = GRUP.get(u.grup);
      const n = nufusMetni(u.nufus_2023);
      const satir = (a, d) => `<div><dt>${esc(a)}</dt><dd>${esc(d)}</dd></div>`;
      kart.innerHTML = `<div class="ulke-karti-bas"><h3>${esc(AD.get(k))}</h3><a href="#grup-${esc(u.grup)}">${esc(t("o.kart"))}</a>
          <button type="button" class="yakin-dugme" id="kart-kapat">${esc(t("k.kapat"))}</button></div>
        <dl class="ulke-bilgi">${[
          satir(t("k.grup"), g.ad[DIL]), satir(t("k.kabul"), tarihYaz(u.kabul_tarihi)),
          satir(t("k.nufus"), t("k.nufusDeger", { n, p: payYaz(u.nufus_2023 / T.nufus_2023_bin) })),
          satir(t("k.butce"), butceYaz(u.butce_yuzde)),
          satir(t("k.personel"), u.personel ? t("k.personelDeger", { n: sayi(u.personel), p: payYaz(u.personel / T.personel) }) : "0"),
          satir(t("k.iit"), u.iit ? t("k.evet") : t("k.hayir")),
          satir(t("k.konsey"), u.gk ? (u.gk.tur === "daimi" ? t("k.daimi") : t("k.secilmis", { y: u.gk.donem_sonu })) : t("k.degil")),
        ].join("")}</dl>${u.not ? `<p class="ulke-not">${esc(u.not[DIL])}</p>` : ""}${(() => {
          const B = H.bolgeler.filter((b) => b.uye === k);
          return B.length ? `<p class="ulke-not">${esc(t("k.ayri", { liste: B.map((b) => `${b[DIL]} (${nufusMetni(b.n)})`).join(", ") }))}</p>` : "";
        })()}`;
      kart.hidden = false;
      $("#kart-kapat").addEventListener("click", kartKapat);
    };
    const ulkeSec = (k, { yakin = true, hemen = false } = {}) => {
      ulke = k;
      secim = UYE.get(k).grup;
      ciz();
      secili.setAttribute("d", ogeler.filter((e) => e.dataset.k === k && e.tagName === "path").map((e) => e.getAttribute("d")).join(""));
      kartCiz(k);
      if (yakin) {
        // Ana toprağın kutusu çevresiyle görünür (en çok 6 kat; büyük ülkelerde dünya)
        const [x0, y0, x1, y1] = HU.get(k).b, gw = genislik(Math.max(3 * (x1 - x0), 3 * (y1 - y0) * TAM.w / TAM.h, TAM.w / 6)), gh = gw * TAM.h / TAM.w;
        git({ x: (x0 + x1 - gw) / 2, y: (y0 + y1 - gh) / 2, w: gw, h: gh }, hemen);
      }
      durumYaz();
    };
    function kartKapat() { ulke = null; kart.hidden = true; secili.setAttribute("d", ""); ciz(); }

    // Arama: büyük-küçük harf ve aksan duyarsız (Türkçe I/ı kuralıyla); tek eşleşme seçilir, birden çoksa adlar listelenir
    const HU = new Map(H.uyeler.map((u) => [u.k, u]));
    const sade = (x) => x.toLocaleLowerCase(YEREL).normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
    const adlar = [...AD.entries()].sort((a, b) => a[1].localeCompare(b[1], YEREL));
    $("#ulke-ara").placeholder = t("ara.ornek");
    $("#ulke-listesi").innerHTML = adlar.map(([, ad]) => `<option value="${esc(ad)}"></option>`).join("");
    const durumGoster = (m) => { const d = $("#arac-durum"); d.textContent = m; clearTimeout(durumGoster.z); durumGoster.z = setTimeout(() => { d.textContent = ""; }, 6000); };
    const ara = () => {
      const q = sade($("#ulke-ara").value); if (!q) return;
      const tam = adlar.filter(([k, ad]) => sade(ad) === q || k.toLowerCase() === q);
      // Üye olmayan alanlar da aranır (tam ad ya da baş harfler); üyeyle tam eşleşme önce gelir
      const alanAd = [...new Set([...H.alanlar.filter((a) => a.durum !== "sessiz"), ...H.bolgeler].map((a) => a[DIL]))], uyar = (ad) => sade(ad).startsWith(q) || sade(ad).includes(" " + q);
      const tamA = tam.length ? [] : alanAd.filter((ad) => sade(ad) === q);
      if (tamA.length === 1) return alanBul(tamA[0]);
      const L = tam.length ? tam : adlar.filter(([, ad]) => uyar(ad)), LA = tam.length ? [] : alanAd.filter(uyar);
      if (L.length === 1 && !LA.length) { ulkeSec(L[0][0]); durumGoster(""); return; }
      if (!L.length && LA.length === 1) return alanBul(LA[0]);
      const H2 = [...L.map(([, ad]) => ad), ...LA];
      durumGoster(H2.length ? t("ara.coklu", { n: H2.length, adlar: H2.slice(0, 6).join(", ") + (H2.length > 6 ? "…" : "") }) : t("ara.yok"));
    };
    const alanBul = (ad) => {
      const P = [...H.alanlar, ...H.bolgeler].filter((a) => a[DIL] === ad), a = P[0];
      const x0 = Math.min(...P.map((p) => p.b[0])), y0 = Math.min(...P.map((p) => p.b[1])), x1 = Math.max(...P.map((p) => p.b[2])), y1 = Math.max(...P.map((p) => p.b[3]));
      if (ulke) kartKapat();
      secili.setAttribute("d", P.map((p) => p.d).join(""));
      const gw = genislik(Math.max(3 * (x1 - x0), 3 * (y1 - y0) * TAM.w / TAM.h, TAM.w / 6)), gh = gw * TAM.h / TAM.w;
      git({ x: (x0 + x1 - gw) / 2, y: (y0 + y1 - gh) / 2, w: gw, h: gh });
      const ek = a.n ? ` ${t("i.nufus2", { n: nufusMetni(a.n) })}.` : "";
      durumGoster(`${a[DIL]}: ${a.uye ? bolgeDurumu(a) : alanDurumu(a)}.${ek}${P.some((p) => p.d) ? "" : " " + t("a.kucuk")}`);
    };
    $("#ulke-ara").addEventListener("change", ara);
    // Listeden seçim (datalist) hemen uygulanır; harf yazmak aramaz
    $("#ulke-ara").addEventListener("input", (e) => { if (!e.inputType || e.inputType === "insertReplacementText") ara(); });
    $("#ulke-ara").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); ara(); } });

    // Nüfus balonları (aç/kapa)
    let balon = false;
    const balonAyarla = (acik) => { balon = acik; svg.classList.toggle("balonlu", acik); $("#balon-dugme").setAttribute("aria-pressed", String(acik)); lejantCiz(); durumYaz(); };
    $("#balon-dugme").addEventListener("click", () => balonAyarla(!balon));

    // Görünüm adreste: #grup=EEG&ulke=TUR&balon=1&gorunum=x,y,kat (varsayılanlar yazılmaz); açılışta okunur. Tek dosyada
    // (about:srcdoc) adres değişmez.
    let yazZaman = 0;
    const adresYaz = () => {
      const q = [];
      if (secim !== "GK") q.push(`grup=${secim}`);
      if (ulke) q.push(`ulke=${ulke}`);
      if (balon) q.push("balon=1");
      if (gor.w < TAM.w - 0.01) q.push(`gorunum=${Math.round(gor.x + gor.w / 2)},${Math.round(gor.y + gor.h / 2)},${(TAM.w / gor.w).toFixed(1)}`);
      if (!q.length && !location.hash.includes("=")) return;  // bölüm bağlantısı (#h-harita vb.) korunur
      const adres = location.pathname + location.search + (q.length ? "#" + q.join("&") : "");
      try { if (location.protocol !== "about:" && adres !== location.pathname + location.search + location.hash) history.replaceState(null, "", adres); } catch (_) { /* yok */ }
    };
    function durumYaz() { clearTimeout(yazZaman); yazZaman = setTimeout(adresYaz, 250); }
    $("#paylas-dugme").addEventListener("click", async () => {
      clearTimeout(yazZaman); adresYaz();
      const url = location.href;
      try {
        if (navigator.share && matchMedia("(pointer: coarse)").matches) { await navigator.share({ title: document.title, url }); return; }
        await navigator.clipboard.writeText(url);
        durumGoster(t("paylas.kopyalandi"));
      } catch (e) { if (!e || e.name !== "AbortError") durumGoster(t("paylas.elle", { url })); }
    });
    $("#harita-metodoloji").setAttribute("href", `metodoloji.html${ek}#${DIL === "tr" ? "" : "en-"}bolum-2-9`);
    ciz(); uygula(gor);
    // Adresteki görünümü uygular: açılışta ve sayfa açıkken adres değişince (paylaşılan bağlantı aynı sekmede açıldığında)
    const adrestenOku = (kaydir) => {
      if (!location.hash.includes("=")) return;
      const adres = new URLSearchParams(location.hash.slice(1));
      const g = adres.get("grup"), u = adres.get("ulke"), gv = (adres.get("gorunum") || "").split(",").map(Number);
      secim = g === "GK" || GRUP.has(g) ? g : "GK";
      if (ulke && !UYE.has(u)) { ulke = null; kart.hidden = true; secili.setAttribute("d", ""); }
      ciz();
      balonAyarla(adres.get("balon") === "1");
      if (UYE.has(u)) ulkeSec(u, { yakin: gv.length !== 3, hemen: true });
      if (gv.length === 3 && gv.every(Number.isFinite) && gv[2] >= 1) {
        const gw = genislik(TAM.w / gv[2]), gh = gw * TAM.h / TAM.w;
        git({ x: gv[0] - gw / 2, y: gv[1] - gh / 2, w: gw, h: gh }, true);
      } else if (!UYE.has(u)) git({ ...TAM }, true);
      if (kaydir) requestAnimationFrame(() => $("#h-harita").scrollIntoView());
    };
    adrestenOku(true);
    addEventListener("hashchange", () => adrestenOku(true));
  }
})();
</script>
