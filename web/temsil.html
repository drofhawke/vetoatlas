<style>
:root {
  --zemin: #FBF8F1; --yuzey: #FFFFFF; --murekkep: #13213A; --murekkep-2: #5A6578; --cizgi: #E1DBCF; --vurgu: #A4262C;
  --g-nufus: #9AA3B2; --g-uye: #2F7A6E; --g-butce: #A8782A; --g-personel: #5E4E9A; --g-daimi: #13213A; --g-secilmis: #5A6578; --bos: #EDE7DA;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
}
:root[data-theme="dark"] {
  --zemin: #1C1A17; --yuzey: #272420; --murekkep: #EDE8E0; --murekkep-2: #ABA496; --cizgi: #3B3731; --vurgu: #E05A52;
  --g-nufus: #8B94A3; --g-uye: #5FB09C; --g-butce: #D8A84A; --g-personel: #9B86D6; --g-daimi: #EDE8E0; --g-secilmis: #ABA496; --bos: #2E2A24;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--zemin); color: var(--murekkep); font-family: var(--sans); font-size: var(--yz-govde); line-height: var(--sa-govde); }
.kap { max-width: 1180px; margin: 0 auto; padding: 0 24px 64px; }
a { color: inherit; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--murekkep); outline-offset: 2px; }
.giris { padding: 32px 0 8px; }
h1 { font-family: var(--serif); font-weight: 600; font-size: var(--yz-baslik); line-height: var(--sa-baslik); margin: 0 0 16px; }
.giris p { font-family: var(--serif); font-size: var(--yz-govde); line-height: var(--sa-govde); max-width: var(--olcu); margin: 0 0 12px; }
.giris p.ikincil { font-family: var(--sans); font-size: var(--yz-kucuk); color: var(--murekkep-2); line-height: var(--sa-kucuk); }
h2 { font-family: var(--serif); font-weight: 600; font-size: var(--yz-govde); line-height: var(--sa-govde); margin: 48px 0 8px; scroll-margin-top: 16px; }
h3 { font-family: var(--serif); font-weight: 600; font-size: var(--yz-govde); margin: 0 0 4px; line-height: var(--sa-govde); }
.aciklama { color: var(--murekkep-2); font-size: var(--yz-kucuk); max-width: var(--olcu); margin: 0 0 16px; line-height: var(--sa-kucuk); }
.kutu { background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 6px; padding: 16px 16px; }
.izgara { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(332px, 100%), 1fr)); gap: 16px; }
.grup .alt-bilgi { color: var(--murekkep-2); font-size: var(--yz-kucuk); margin: 0 0 12px; line-height: var(--sa-kucuk); }
.cubuklar { display: grid; grid-template-columns: 136px 1fr 68px; gap: 8px 12px; align-items: center; font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); }
.cubuklar .et { color: var(--murekkep-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cubuklar .cb { position: relative; height: 16px; background: var(--bos); border-radius: 3px; overflow: hidden; }
.cubuklar .cb span { position: absolute; top: 0; left: 0; height: 100%; transition: width .4s ease; }
.cubuklar .cb .secilmis { background: var(--g-secilmis); }
.cubuklar .cb .daimi { background: var(--g-daimi); }
.cubuklar .deger { font-variant-numeric: tabular-nums; text-align: right; }
.oranlar { margin: 12px 0 0; font-size: var(--yz-kucuk); color: var(--murekkep-2); line-height: var(--sa-kucuk); }
.oranlar b { color: var(--murekkep); font-weight: 600; font-variant-numeric: tabular-nums; }
.koltuk-not { font-size: var(--yz-kucuk); color: var(--murekkep-2); margin: 8px 0 0; line-height: var(--sa-kucuk); }
.lejant { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: var(--yz-kucuk); color: var(--murekkep-2); margin: 0 0 16px; line-height: var(--sa-kucuk); }
.lejant span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 8px; vertical-align: -1px; background: var(--r, var(--bos)); }
table { border-collapse: collapse; width: 100%; font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--cizgi); vertical-align: top; }
th { font-weight: 600; color: var(--murekkep-2); font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); }
td.s, th.s { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.not-liste { font-size: var(--yz-kucuk); color: var(--murekkep-2); padding-left: 24px; line-height: var(--sa-kucuk); }
.not-liste li { margin: 4px 0; }
@media (prefers-reduced-motion: reduce) { .cubuklar .cb span { transition: none; } }
@media (max-width: 560px) { .kap { padding: 0 16px 48px; } .cubuklar { grid-template-columns: 96px 1fr 60px; } table { font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); } th, td { padding: 8px 8px; } }


details.tablo-ac > summary { cursor: pointer; font-size: var(--yz-kucuk); color: var(--murekkep-2); margin: 8px 0 8px; width: max-content; line-height: var(--sa-kucuk); }

.kap p, .kap dd, .kap blockquote, .kap ul:not([class]) > li, .kap ol:not([class]) > li { max-width: var(--olcu); }

details.yontem summary { cursor: pointer; font-weight: 600; font-family: var(--sans); }
details.yontem p { font-family: var(--sans); font-size: var(--yz-kucuk); color: var(--murekkep-2); margin: 8px 0 0; line-height: var(--sa-kucuk); }

<script>
(() => {
  const $ = (s, k = document) => k.querySelector(s);
  const DILLER = ["tr", "en"];
  const istenen = new URLSearchParams(location.search).get("lang");
  const DIL = DILLER.includes(istenen) ? istenen : "tr";
  const SOZLUK = {
    tr: {
      sayfaBasligi: "Kim temsil ediliyor? · Veto Atlası",
      sayfaAciklamasi: "BM bölgesel gruplarının nüfus, üye sayısı, bütçe ve barış gücü payları ile Güvenlik Konseyi koltuk payları yan yana.",
      baslik: "Kim temsil ediliyor?",
      giris1: "Temsil endeksi, her BM bölgesel grubu için beş payı yan yana gösterir: BM üyelerinin toplam nüfusundaki pay, BM üye sayısındaki pay, olağan bütçe ölçeğindeki pay, barış gücü personelindeki pay ve Güvenlik Konseyi koltuklarındaki pay.",
      okuma: "Nasıl okunur?",
      giris2: "Daimî ve seçilmiş koltuklar ayrı gösterilir. Paylar BM üyelerinin toplamı içindedir. Koltuk / gösterge oranı 1 ise grubun koltuk payı gösterge payına eşittir; 1'den büyükse koltuk payı daha yüksek, küçükse daha düşüktür. Bileşik puan ya da sıralama yoktur.",
      "h.gruplar": "Bölgesel gruplar",
      "gruplar.aciklama": "Birim BM bölgesel gruplarıdır (DGACM listesi). Türkiye iki grupta listelenir ve seçimlerde yalnızca WEOG sayılır; ABD hiçbir grubun üyesi değildir ve seçimlerde WEOG sayılır. Her ikisi burada WEOG'da sayılmıştır. Koltuk çubuğunda koyu bölüm daimî, açık bölüm seçilmiş koltuklardır (mevcut dönem).",
      "l.nufus": "Nüfus payı (2023)", "l.uye": "Üye payı", "l.butce": "Bütçe payı (olağan bütçe ölçeği 2025–2027)", "l.personel": "Personel payı (barış gücü üniformalı personel: asker, polis, uzman, karargâh subayı; 28 Şubat 2026)", "l.daimi": "Daimî koltuk", "l.secilmis": "Seçilmiş koltuk",
      "b.nufus": "Nüfus 2023", "b.uye": "Üye sayısı", "b.butce": "Bütçe 2025–27", "b.personel": "Üniformalı personel", "b.koltuk": "Koltuk",
      uyeSayisi: ({ n }) => `${n} üye`,
      koltukNot: ({ d, s, t }) => `Koltuk: ${d} daimî + ${s} seçilmiş = ${t} / 15. Daimî koltuk payı (daimî / 5): ${d} / 5.`,
      oranBaslik: "Koltuk payı / gösterge payı:",
      "o.nufus_2023": "nüfus", "o.uye": "üye", "o.butce": "bütçe", "o.personel": "personel",
      "h.nufus": "Nüfus payı: 1963 ve 2023",
      "nufus.aciklama": ({ u63, u }) => `1963 payı 1963 sonundaki ${u63} BM üyesinin, 2023 payı bugünkü ${u} üyenin toplamı içindedir.`,
      "nufus.metodoloji": "Ayrıntı: Metodoloji 2.9 →",
      "t.grup": "Grup", "t.uye63": "Üye 1963", "t.nufus63": "Nüfus 1963 (bin)", "t.pay63": "Pay 1963", "t.uye23": "Üye 2023", "t.nufus23": "Nüfus 2023 (bin)", "t.pay23": "Pay 2023", "t.fark": "Fark (puan)",
      "t.toplam": "Toplam", tabloGoster: "Tabloyu göster",
      "h.kumeler": "Beş daimî üye ve İslam İşbirliği Teşkilatı üyeleri",
      "kumeler.aciklama": "Aynı beş pay iki küme için: Güvenlik Konseyi'nin beş daimî üyesi ve İİT'nin BM üyesi olan 56 üyesi. 1963 nüfus payı ayrıca verilir.",
      nufus63: ({ p }) => `Nüfus payı 1963: ${p}`,
    },
    en: {
      sayfaBasligi: "Who is represented? · Veto Atlas",
      sayfaAciklamasi: "Population, membership, budget and peacekeeping shares of the UN regional groups next to their Security Council seat shares.",
      baslik: "Who is represented?",
      giris1: "The representation index sets five shares side by side for each UN regional group: share of the total population of UN Member States, of UN membership, of the regular budget scale, of peacekeeping personnel and of Security Council seats.",
      okuma: "How to read this page",
      giris2: "Permanent and elected seats are shown separately. Shares are within the total of UN Member States. A seat / indicator ratio of 1 means the group's seat share equals its indicator share; above 1 the seat share is higher, below 1 it is lower. There is no composite score or ranking.",
      "h.gruplar": "Regional groups",
      "gruplar.aciklama": "The unit is the UN regional group (DGACM list). Türkiye is listed in two groups and is counted only in WEOG for electoral purposes; the United States is not a member of any group and is counted in WEOG for electoral purposes. Both are counted in WEOG here. In the seat bar the dark part is permanent seats, the lighter part elected seats (current term).",
      "l.nufus": "Population share (2023)", "l.uye": "Membership share", "l.butce": "Budget share (regular budget scale 2025–2027)", "l.personel": "Personnel share (peacekeeping uniformed personnel: troops, police, experts, staff officers; 28 February 2026)", "l.daimi": "Permanent seat", "l.secilmis": "Elected seat",
      "b.nufus": "Population 2023", "b.uye": "Members", "b.butce": "Budget 2025–27", "b.personel": "Uniformed personnel", "b.koltuk": "Seats",
      uyeSayisi: ({ n }) => `${n} members`,
      koltukNot: ({ d, s, t }) => `Seats: ${d} permanent + ${s} elected = ${t} / 15. Permanent seat share (permanent / 5): ${d} / 5.`,
      oranBaslik: "Seat share / indicator share:",
      "o.nufus_2023": "population", "o.uye": "members", "o.butce": "budget", "o.personel": "personnel",
      "h.nufus": "Population share: 1963 and 2023",
      "nufus.aciklama": ({ u63, u }) => `The 1963 share is within the total of the ${u63} UN Member States at the end of 1963, the 2023 share within the total of today's ${u} members.`,
      "nufus.metodoloji": "Details: Methodology 2.9 →",
      "t.grup": "Group", "t.uye63": "Members 1963", "t.nufus63": "Population 1963 (thousands)", "t.pay63": "Share 1963", "t.uye23": "Members 2023", "t.nufus23": "Population 2023 (thousands)", "t.pay23": "Share 2023", "t.fark": "Difference (points)",
      "t.toplam": "Total", tabloGoster: "Show the table",
      "h.kumeler": "Five permanent members and members of the Organisation of Islamic Cooperation",
      "kumeler.aciklama": "The same five shares for two sets: the five permanent members of the Security Council and the 56 OIC members that are UN Member States. The 1963 population share is given as well.",
      nufus63: ({ p }) => `Population share 1963: ${p}`,
    },
  };
  const t = (a, p) => { const v = SOZLUK[DIL][a] ?? SOZLUK.tr[a]; return typeof v === "function" ? v(p || {}) : v; };
  const ek = DIL === "tr" ? "" : "?lang=" + DIL;
  document.documentElement.lang = DIL;
  document.title = t("sayfaBasligi");
  const metaYaz = (s, d) => { const e = document.querySelector(s); if (e) e.setAttribute("content", d); };
  metaYaz('meta[name="description"]', t("sayfaAciklamasi"));
  metaYaz('meta[property="og:title"]', t("sayfaBasligi"));
  metaYaz('meta[property="og:description"]', t("sayfaAciklamasi"));
  metaYaz('meta[property="og:locale"]', DIL === "tr" ? "tr_TR" : "en_GB");
  metaYaz('meta[property="og:locale:alternate"]', DIL === "tr" ? "en_GB" : "tr_TR");
  document.querySelectorAll("[data-t]").forEach((e) => { e.textContent = t(e.dataset.t); });
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const V = window.TEMSIL_VERISI;
  if (!V) return;
  const YEREL = DIL === "tr" ? "tr-TR" : "en-GB";
  // Yüzde işareti Türkçede sayının önünde (%18,3), İngilizcede arkasında (18.3%)
  const yuzde = (p, b = 1) => { const s = (100 * p).toLocaleString(YEREL, { minimumFractionDigits: b, maximumFractionDigits: b }); return DIL === "tr" ? "%" + s : s + "%"; };
  const sayi = (n, b = 0) => n.toLocaleString(YEREL, { minimumFractionDigits: b, maximumFractionDigits: b });
  const oran = (x) => x == null ? "–" : x.toLocaleString(YEREL, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  // 1963 ve 2023 paylarının paydası tek cümlede; hesap ayrıntısı Metodoloji 2.9'da
  $("#nufus-aciklama").textContent = t("nufus.aciklama", { u63: sayi(V.meta.uye_sayisi_1963), u: sayi(V.meta.uye_sayisi) });
  $("#nufus-metodoloji").setAttribute("href", `metodoloji.html${ek}#${DIL === "tr" ? "" : "en-"}bolum-2-9`);
  const GOSTERGELER = [["nufus", "nufus_2023", "--g-nufus"], ["uye", "uye", "--g-uye"], ["butce", "butce", "--g-butce"], ["personel", "personel", "--g-personel"]];
  $("#lejant").innerHTML = [...GOSTERGELER.map(([k, , r]) => `<span style="--r:var(${r})">${esc(t("l." + k))}</span>`),
    `<span style="--r:var(--g-daimi)">${esc(t("l.daimi"))}</span>`, `<span style="--r:var(--g-secilmis)">${esc(t("l.secilmis"))}</span>`].join("");

  const kart = (g, ek63) => {
    const k = g.koltuk;
    const satirlar = GOSTERGELER.map(([ad, alan, r]) => `<div class="et">${esc(t("b." + ad))}</div><div class="cb"><span style="width:${(100 * g.paylar[alan]).toFixed(2)}%;background:var(${r})"></span></div><div class="deger">${yuzde(g.paylar[alan])}</div>`).join("");
    const koltuk = `<div class="et">${esc(t("b.koltuk"))}</div><div class="cb"><span class="secilmis" style="width:${(100 * k.toplam_payi).toFixed(2)}%"></span><span class="daimi" style="width:${(100 * k.daimi_payi * 5 / 15).toFixed(2)}%"></span></div><div class="deger">${yuzde(k.toplam_payi)}</div>`;
    const oranlar = Object.entries(g.oranlar).map(([a, x]) => `${esc(t("o." + a))} <b>${oran(x)}</b>`).join(" · ");
    return `<article class="kutu grup" aria-label="${esc(g.ad[DIL])}"><h3>${esc(g.ad[DIL])}</h3><p class="alt-bilgi">${esc(t("uyeSayisi", { n: g.uye_sayisi }))}${ek63 ? " · " + esc(t("nufus63", { p: yuzde(g.paylar.nufus_1963) })) : ""}</p>
      <div class="cubuklar">${satirlar}${koltuk}</div>
      <p class="koltuk-not">${esc(t("koltukNot", { d: k.daimi, s: k.secilmis, t: k.toplam }))}</p>
      <p class="oranlar">${esc(t("oranBaslik"))} ${oranlar}</p></article>`;
  };
  $("#gruplar").innerHTML = V.gruplar.map((g) => kart(g, false)).join("");
  $("#kumeler").innerHTML = V.kumeler.map((g) => kart(g, true)).join("");

  const T = V.meta.toplamlar;
  const satir = (ad, u63, n63, p63, u23, n23, p23) => `<tr><td>${esc(ad)}</td><td class="s">${u63}</td><td class="s">${sayi(n63)}</td><td class="s">${yuzde(p63)}</td><td class="s">${u23}</td><td class="s">${sayi(n23)}</td><td class="s">${yuzde(p23)}</td><td class="s">${(100 * (p23 - p63)).toLocaleString(YEREL, { minimumFractionDigits: 1, maximumFractionDigits: 1, signDisplay: "always" })}</td></tr>`;
  $("#nufus-tablo").innerHTML = `<thead><tr><th>${esc(t("t.grup"))}</th><th class="s">${esc(t("t.uye63"))}</th><th class="s">${esc(t("t.nufus63"))}</th><th class="s">${esc(t("t.pay63"))}</th><th class="s">${esc(t("t.uye23"))}</th><th class="s">${esc(t("t.nufus23"))}</th><th class="s">${esc(t("t.pay23"))}</th><th class="s">${esc(t("t.fark"))}</th></tr></thead><tbody>`
    + V.gruplar.map((g) => satir(g.ad[DIL], g.uye_sayisi_1963, g.nufus_1963_bin, g.paylar.nufus_1963, g.uye_sayisi, g.nufus_2023_bin, g.paylar.nufus_2023)).join("")
    + V.kumeler.map((g) => satir(g.ad[DIL], g.uye_sayisi_1963, g.nufus_1963_bin, g.paylar.nufus_1963, g.uye_sayisi, g.nufus_2023_bin, g.paylar.nufus_2023)).join("")
    + `<tr><td><b>${esc(t("t.toplam"))}</b></td><td class="s">${V.meta.uye_sayisi_1963}</td><td class="s">${sayi(T.nufus_1963_bin)}</td><td class="s">${yuzde(1)}</td><td class="s">${V.meta.uye_sayisi}</td><td class="s">${sayi(T.nufus_2023_bin)}</td><td class="s">${yuzde(1)}</td><td class="s"></td></tr></tbody>`;
  const notlar63 = V.uyeler_1963.filter((x) => x.not).map((x) => `<li><b>${esc(x.uye_1963)}</b> (${esc(x.grup)}): ${esc(x.not[DIL])}</li>`);
  $("#nufus-notlar").innerHTML = notlar63.join("");
  $("#kume-notlar").innerHTML = V.kumeler.flatMap((k) => k.notlar.map((n) => `<li><b>${esc(k.ad[DIL])}:</b> ${esc(n[DIL])}</li>`)).join("");
})();
</script>
