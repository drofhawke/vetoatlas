<style>
:root {
  --zemin: #FBF8F1; --yuzey: #FFFFFF; --murekkep: #13213A; --murekkep-2: #5A6578; --cizgi: #E1DBCF; --vurgu: #A4262C;
  --u-sscb: #7E2F3C; --u-rus: #C2666F; --u-usa: #24507F; --u-gbr: #2F7A6E; --u-fra: #A8782A; --u-chn: #5E4E9A;
  --oy-lehte: #9AA3B2; --bos: #EDE7DA; --m-afr: #9AA3B2;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
}
:root[data-theme="dark"] {
  --zemin: #1C1A17; --yuzey: #272420; --murekkep: #EDE8E0; --murekkep-2: #ABA496; --cizgi: #3B3731; --vurgu: #E05A52;
  --u-sscb: #C2576A; --u-rus: #E89AA5; --u-usa: #5B8DC4; --u-gbr: #5FB09C; --u-fra: #D8A84A; --u-chn: #9B86D6;
  --oy-lehte: #8B94A3; --bos: #2E2A24; --m-afr: #5F6673;  /* koyu temada --murekkep-2'den (#ABA496) ayrışsın diye koyu */
}
/* Ölçü, boşluk ve tipografi: kaynaklar/kimlik/hikaye-taslak.html (yazı tipleri web/fonts/ altındaki woff2) */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; background: var(--zemin); color: var(--murekkep); font-family: var(--sans); font-size: var(--yz-govde); line-height: var(--sa-govde); }
a { color: inherit; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--murekkep); outline-offset: 2px; }
.gorunmez { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* Sütun: 760 px kap, 24 px iç boşluk; geniş ekranda boşluk simetrik */
.kap { max-width: 760px; margin: 0 auto; padding: 0 24px; }

/* Giriş */
.giris { padding: 48px 0 24px; text-align: left; }
/* Giriş alıntısı: atlasın çıkış noktası, kaynaklı alıntı (KILAVUZ bölüm 2, "Hikâye"): başlık boyutunda, altında künye */
.epigraf { margin: 0 0 var(--b12); }
.epigraf:empty { display: none; }
.epigraf blockquote { margin: 0; font-family: var(--serif); font-weight: 600; font-size: var(--yz-baslik); line-height: var(--sa-baslik); letter-spacing: -.01em; }
.epigraf figcaption { margin: var(--b2) 0 0; font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); color: var(--murekkep-2); }
.giris h1 { font-family: var(--serif); font-weight: 600; font-size: var(--yz-gosterge); line-height: var(--sa-gosterge); margin: 0 0 12px; letter-spacing: -.01em; }
/* Türkçe başlık 96 px'te tek satırda 776 px tutar, 712 px'lik sütuna sığmaz: 960 px ve üstünde sütunun sağına taşarak
   tek satırda kalır. İngilizce başlık (1038 px) sütunda iki satırdır. */
@media (min-width: 960px) { .giris h1:lang(tr) { white-space: nowrap; } }
.giris .ozet { font-family: var(--serif); font-size: var(--yz-govde); line-height: var(--sa-govde); max-width: var(--olcu); margin: 0 0 8px; }

/* İlerleme rayı: masaüstünde solda sabit */
.ray { position: fixed; left: 24px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 16px; z-index: 4; }
.ray a { position: relative; width: 12px; height: 12px; border-radius: 50%; background: transparent; box-shadow: inset 0 0 0 2px var(--murekkep-2); display: block; transition: transform .2s, background-color .2s; }  /* gelecek adım içi boş halka */
.ray a::after { content: ""; position: absolute; inset: -8px; }  /* tıklama alanı */
.ray a.gecti { background: var(--murekkep-2); }  /* geçilen adım dolu nokta */
.ray a[aria-current="step"] { background: var(--murekkep); box-shadow: none; transform: scale(1.25); }

/* Adım modülü */
.adim { padding: 64px 0 48px; border-top: 1px solid var(--cizgi); }
#adimlar > .adim + .adim { margin-top: var(--b16); }  /* canlıdaki main > section + section boşluğu */
.adim:focus { outline: none; }
.adim:focus-visible { outline: 2px solid var(--murekkep); outline-offset: 8px; }
.adim-bas { display: flex; align-items: baseline; gap: 16px; margin-bottom: 32px; }
.adim-no { font-family: var(--serif); font-weight: 600; font-size: var(--yz-baslik); line-height: var(--sa-baslik); color: var(--murekkep); font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
.adim-no small { font-size: var(--yz-govde); font-weight: 400; color: var(--murekkep-2); margin-left: 4px; line-height: var(--sa-govde); }
.adim-baslik { font-family: var(--serif); font-weight: 600; font-size: var(--yz-govde); line-height: var(--sa-govde); margin: 0; }
.istat { font-family: var(--serif); font-weight: 600; font-size: var(--yz-gosterge); line-height: var(--sa-gosterge); letter-spacing: -.02em; margin: 8px 0 8px; font-variant-numeric: tabular-nums; }
.istat-alt { font-size: var(--yz-kucuk); color: var(--murekkep-2); margin: 0 0 24px; line-height: var(--sa-kucuk); font-style: italic; }
.metin { font-family: var(--serif); font-size: var(--yz-govde); line-height: var(--sa-govde); max-width: var(--olcu); margin: 0 0 32px; }
.gorsel { margin: 0 0 32px; }
.alinti { border-left: 3px solid var(--murekkep); padding: 8px 0 8px 24px; margin: 0 0 24px; }
.kapanis blockquote, .kapanis .kunye { max-width: var(--olcu); }  /* paragrafla aynı sağ kenar */
.alinti blockquote, .kapanis blockquote, .epigraf blockquote, .adim .metin { text-wrap: pretty; }  /* son satırda tek sözcük kalmaz */
.bitisik { white-space: nowrap; }  /* "eleven-member" satır sonunda bölünmez */
.alinti blockquote { font-family: var(--serif); font-size: var(--yz-govde); line-height: var(--sa-govde); margin: 0 0 8px; }
.alinti .kaynak { font-size: var(--yz-kucuk); color: var(--murekkep-2); margin: 0; line-height: var(--sa-kucuk); }
.ayrinti { margin: 0; }
.ayrinti a { font-size: var(--yz-kucuk); font-weight: 600; text-decoration: underline; text-underline-offset: 4px; color: var(--murekkep); line-height: var(--sa-kucuk); }
.adim > * { opacity: 0; transform: translateY(14px); transition: opacity .3s ease, transform .3s ease; }  /* en fazla 300 ms */
.adim.goster > * { opacity: 1; transform: none; }

/* Görseller */
.koltuklar { display: flex; gap: 12px; flex-wrap: wrap; }
.koltuk { width: 40px; height: 40px; border-radius: 5px; background: var(--oy-lehte); }
.koltuk.daimi { background: var(--murekkep); }
.koltuk.daimi::after { content: ""; display: block; width: 12px; height: 12px; margin: 8px; border-radius: 2px; background: var(--vurgu); }  /* veto yetkisi: kırmızı kare */
.koltuk.gorusuldu { background: var(--murekkep); }
/* Konsey (1. adım): on beş koltuk tek sırada, daimî koltukta üyenin kısa kodu (simülasyondaki kodlar); veto karesi sol üstte.
   Dar ekranda beşerli üç sıra: ilk sıra daimî üyeler. Kodların açılımı diyagramın altında. */
.koltuklar.konsey { gap: 8px; }
.konsey .koltuk.daimi { position: relative; display: flex; align-items: flex-end; padding: 0 0 0 8px; color: var(--zemin); font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); font-weight: 600; }
.konsey .koltuk.daimi::after { position: absolute; top: 8px; left: 8px; width: 8px; height: 8px; margin: 0; }
.koltuk-kodlari { font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); color: var(--murekkep-2); margin: 12px 0 0; }
.koltuk-kodlari b { color: var(--murekkep); font-weight: 600; }
.koltuk-kodlari span { white-space: nowrap; }
/* 5. adımın küçük haritası (Temsil haritasıyla aynı çizim): Asya-Pasifik ikincil mürekkep, Afrika orta ton, öteki üyeler açık,
   BM üyesi olmayan alanlar boş. Harita verisi adım yaklaşınca yüklenir. */
.mini-harita { margin: 24px 0 0; }
.mini-harita:empty { aspect-ratio: 712 / 368; }  /* harita ve lejant yüklenmeden yer ayrılır, aşağıdaki adımlar kaymaz */
.mini-harita svg { display: block; width: 100%; height: auto; }
.mini-harita path { fill: var(--bos); stroke: var(--zemin); stroke-width: .5px; vector-effect: non-scaling-stroke; }
.mini-harita .uye-degil { fill: var(--zemin); stroke: var(--cizgi); }
.mini-harita .m-asp { fill: var(--murekkep-2); }
.mini-harita .m-afr { fill: var(--m-afr); }
.mini-lejant { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 8px 0 0; font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); color: var(--murekkep-2); }
.mini-lejant span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 8px; vertical-align: -1px; }
.mini-lejant .m-asp::before { background: var(--murekkep-2); }
.mini-lejant .m-afr::before { background: var(--m-afr); }
.noktalar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.nokta { width: 36px; height: 36px; border-radius: 50%; background: var(--oy-lehte); }
.nokta.ret { background: var(--vurgu); }
.noktalar .sonuc { font-family: var(--serif); font-size: var(--yz-govde); margin-left: 12px; color: var(--murekkep-2); line-height: var(--sa-govde); }
.kareler { display: grid; grid-template-columns: repeat(23, 1fr); gap: 4px; max-width: 560px; }
.kareler i { display: block; aspect-ratio: 1; border-radius: 2px; background: var(--oy-lehte); }
.kareler i.bos { background: transparent; border: 1.5px dashed var(--murekkep-2); }
.cubuklar { display: grid; gap: 16px; font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); }
.cubuklar .et { color: var(--murekkep-2); margin-bottom: 4px; display: flex; justify-content: space-between; gap: 12px; }  /* etiket solda, sayı sağda */
.cubuklar .cb { height: 20px; background: var(--bos); border-radius: 3px; overflow: hidden; display: flex; }
.cubuklar .cb span { display: block; height: 100%; background: var(--oy-lehte); }
.cubuklar .cb span.koltuk-payi { background: var(--murekkep); }
.cubuklar .et b { color: var(--murekkep); font-weight: 600; font-variant-numeric: tabular-nums; }

/* Kapanış, alt bilgi */
.kapanis { padding: 48px 0 24px; border-top: 1px solid var(--cizgi); }
.kapanis blockquote { font-family: var(--serif); font-size: var(--yz-govde); line-height: var(--sa-govde); margin: 0 0 8px; padding-left: 24px; border-left: 3px solid var(--murekkep); }
.kapanis .kunye { font-size: var(--yz-kucuk); color: var(--murekkep-2); margin: 0 0 24px; line-height: var(--sa-kucuk); }
.kapanis .dugme { margin: 0 12px 12px 0; }  /* birincil ve ikincil düğme: web/temel.css */
footer { border-top: 1px solid var(--cizgi); margin: 32px 0 48px; padding-top: 16px; color: var(--murekkep-2); font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); }

@media (max-width: 760px) {
  .giris { padding-top: 32px; }
  .ray { display: none; }
  .adim { padding-top: 64px; }
  .adim-no { font-size: var(--yz-baslik); line-height: var(--sa-baslik); }
  .koltuk { width: 32px; height: 32px; }
  .koltuklar.konsey { display: grid; grid-template-columns: repeat(5, 40px); gap: 12px; }
  .konsey .koltuk { width: 40px; height: 40px; }
  .nokta { width: 28px; height: 28px; }
  .epigraf { margin-bottom: var(--b8); }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .adim > * { opacity: 1; transform: none; transition: none; }
  .ray a { transition: none; }
}
@media print {
  .adim > * { opacity: 1; transform: none; transition: none; }
  .ray { display: none; }
  .koltuk, .koltuk::after, .kareler i, .nokta, .cb, .cb span, .mini-harita path, .mini-lejant span::before { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .adim { break-inside: avoid; }
}
</style>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const DILLER = ["tr", "en"];
  const parametre = new URLSearchParams(location.search).get("lang");
  const DIL = DILLER.includes(parametre) ? parametre : "tr";
  const SOZLUK = {
    tr: {
      sayfaBasligi: "Hikâye · Veto Atlası",
      sayfaAciklamasi: "Güvenlik Konseyinde 1946’dan bu yana kullanılan vetolar, BM kayıtlarına dayanılarak yedi adımda ele alınmaktadır.",
      gorselAlt: ({ n }) => `Veto Atlası: 1946’dan 2026’ya Güvenlik Konseyinde vetoyla düşen ${n} öneri; her kare bir ret oyu, yıllara göre.`,
      baslik: "Yedi adımda veto",
      bolum: ({ b }) => b, ceviriNotu: "",
      giris1: "Bu sayfada, 1946’dan bu yana Güvenlik Konseyinde kullanılan vetolar BM kayıtlarına dayanılarak yedi adımda ele alınmaktadır.",
      ray: "Adımlar",
      kunyeKim: "Cumhurbaşkanı Recep Tayyip Erdoğan", sayfaKisa: "s.",
      adim: ({ n }) => `${n}. adım`, ayrinti: "Ayrıntı",
      basliklar: ["Veto nedir?", "Kaç karar düştü?", "Kim kullandı?", "Tek ülke, bütün Konsey", "Kim temsil ediliyor?", "Her vetodan sonra Genel Kurul", "Ya veto olmasaydı?"],
      "4.sonuc": "14 evet, 1 hayır → düştü",
      // Alt yazı sayının ne olduğunu söyler; metindeki sayılar (yazıyla yazılanlar ve ekleri dâhil) veriden gelir
      "1.etiket": ({ uye, daimi }) => `${yazi(uye)} üyeden ${yazi(daimi, "iyelik")}, daimî`,
      "1.metin": ({ uye, daimi }) => `Güvenlik Konseyi ${yazi(uye)} üyeden oluşur. Bunların ${yazi(daimi, "iyelik")} daimî üyedir ve diğerlerinde bulunmayan bir yetkiye sahiptir: tek bir ret oyuyla, usul işleri dışındaki her kararı düşürebilirler. Bu yetkinin adı vetodur.`,
      "2.etiket": ({ yil }) => `karar, ${yilEkli(yil, "den")} bugüne`,
      "2.metin": ({ sure }) => `Konseyin kuruluşundan bu yana daimî üyelerin ret oyuyla düşen karar taslaklarının toplamı budur. Aşağıdaki ızgarada her kare bir ret oyunu gösterir; ${yazi(sure)} yılın tamamı tek bakışta görülür.`,
      "2.gorsel": ({ r, k }) => `${r} ret oyu, her kare bir oy. Kesik çizgili ${yazi(k)} kare, oy dağılımı kayıtlı olmayan kapalı oturum vetoları.`,
      "3.etiket": "daimî üyelerin tamamı",
      "3.metin": ({ daimi }) => `Veto, ${yazi(daimi)} daimî üyenin tamamı tarafından kullanıldı. Dağılım dönemlere göre değişir: Soğuk Savaş’ın ilk yıllarında Sovyetler Birliği, 1970’lerden sonra ABD, son on beş yılda Rusya ve Çin öne çıkar.`,
      "4.etiket": "karar, tek bir ret oyuyla",
      "4.metin": ({ n11, yil, boy }) => `Bu kararların her birinde Konseyin diğer bütün üyeleri lehte oy kullandı; karar yine de düştü, çünkü ret oyunu veren tek ülke bir daimî üyeydi. ${buyuk(yazi(n11, "iyelik"))}, ${yil} öncesinin ${yazi(boy)} üyeli Konseyinde oylandı.`,
      "5.etiket": "Asya-Pasifik grubunun BM nüfusundaki payı", "5.nufus": "Asya-Pasifik nüfus payı", "5.koltuk": "Asya-Pasifik koltuk payı", "5.afr": "Afrika, daimî koltuk", "5.afrDeger": ({ d }) => `${d} / 5`,
      "5.metin": ({ yil, koltuk, asp, afr, kat }) => `Konseyin bugünkü koltuk dağılımı ${yilEkli(yil, "de")} belirlendi ve o günden beri değişmedi. Aynı dönemde Afrika grubunun BM üyesi ülkelerin nüfusundaki payı ${yazi(kat)} katına çıktı. BM üyesi ülkelerin nüfusunun yarısından fazlasını barındıran Asya-Pasifik grubu ${yazi(koltuk)} koltuğun ${yazi(asp, "yonelme")} sahip. ${buyuk(yazi(afr))} üyeli Afrika grubunun ise hiç daimî koltuğu yok.`,
      "6.etiket": ({ ay, yil }) => `veto, ${ay} ${yilEkli(yil, "den")} bu yana Genel Kurulda görüşüldü`,
      "6.metin": ({ ay, yil, v, s }) => `${ay} ${yilEkli(yil, "de")} kabul edilen ve Türkiye’nin ilk sunucuları arasında yer aldığı bir kararla, Genel Kurul artık her vetodan sonra toplanıyor. O tarihten bu yana kullanılan vetoların tamamı görüşüldü; veto eden ülke, ${yazi(v)} veto girişimi tartışmasının ${yazi(s, "bulunma")} de söz aldı.`,
      "6.gorsel": ({ g, t }) => `${t} vetonun ${g} tanesi Genel Kurulda görüşüldü, her kare bir veto.`,
      "7.etiket": ({ t }) => `karar, ${t} içinde`,
      "7.metin": ({ dis }) => `Veto olmasaydı ve üyeler kayıtlardaki oylarını değiştirmeseydi, düşen kararların neredeyse tamamı kabul edilmiş olurdu. Dışarıda kalan ${yazi(dis, "iyelik")}, oy dağılımı kayıtlı olmayan kapalı oturum vetolarıdır. Sayımı istediğiniz kayıt üzerinde kendiniz yapabilirsiniz.`,
      "7.bag": "Sayımı kendiniz yapın",
      kesfet: "Bütün kayıtlar", sozKayit: "Söz ve Kayıt",
      alt: ({ son, sonEk, tarih, tarihEk }) => `Son veto ${son}’${sonEk}, veri ${tarih}’${tarihEk} güncellendi.`,
      sayfa: { vetolar: "Vetolar", vizyon: "Söz ve Kayıt", reform: "Reform modelleri", simulasyon: "Ya veto olmasaydı?", temsil: "Kim temsil ediliyor?", hakkinda: "Hakkında", metodoloji: "Metodoloji" },

  };
  // Giriş alıntısı: atlasın çıkış noktası, alıntı bankasındaki metnin içinden birebir (KILAVUZ bölüm 2, "Hikâye"; METODOLOJI 2.7).
  // İki dilde de 2019 hitabından: Türkçe kitapçıktaki “Dünya 5’ten Büyüktür.”, İngilizce kitapçıktaki "The world is bigger than
  // five!" (kaynakta tırnaksız). Gösterilen metin bankadaki metinde geçmiyorsa alıntı hiç gösterilmez (tests/test_hikaye.py).
  const EPIGRAF = { tr: ["2019-1", "“Dünya 5’ten Büyüktür.”"], en: ["2019-1", "The world is bigger than five!"] }[DIL];
  const epigraf = alintiBul(EPIGRAF[0]);
  if (epigraf && (DIL === "en" ? epigraf.metin_en : epigraf.metin_tr).includes(EPIGRAF[1])) {
    $("#epigraf").innerHTML = `<blockquote lang="${DIL}">${esc(EPIGRAF[1])}</blockquote>
      <figcaption>${kunye(epigraf)}</figcaption>`;
  }
  const soz = (id) => {
    const a = alintiBul(id); if (!a) return "";
    const ingilizce = DIL === "en" && a.metin_en;
    // Resmî İngilizcesi olmayan alıntı: Türkçe özgün metin ve altında işaretli gayriresmî çeviri (METODOLOJI 2.7)
    const ceviri = DIL === "en" && !a.metin_en ? `<p class="kaynak">${esc(t("ceviriNotu"))}: ${esc(a.ceviri_en)}</p>` : "";
    return `<div class="alinti"><blockquote lang="${ingilizce ? "en" : "tr"}">${esc(ingilizce ? (KISA_EN[id] || a.metin_en) : (KISA[id] || a.metin_tr))}</blockquote>
      ${ceviri}<p class="kaynak">${kunye(a)}</p></div>`;
  };
  const ADIMLAR = [
    { sayi: daimiSayisi, etiket: t("1.etiket", { uye: koltukSayisi, daimi: daimiSayisi }), metin: t("1.metin", { uye: koltukSayisi, daimi: daimiSayisi }), gorsel: koltuklar(), bag: "metodoloji.html" },
    { sayi: K.length, etiket: t("2.etiket", { yil: ilkYil }), metin: t("2.metin", { sure: sonYil - ilkYil }), gorsel: kareler(), bag: "vetolar.html" },
    { sayi: `${sayi(kullananKoltuk)} / ${sayi(daimiSayisi)}`, etiket: t("3.etiket"), metin: t("3.metin", { daimi: daimiSayisi }), gorsel: uyeCubuklari(), bag: "vizyon.html#h-konu" },
    { sayi: tek.length, etiket: t("4.etiket"), metin: t("4.metin", { n11: tek11, yil: BUYUME.slice(0, 4), boy: ESKI_BOYUT }), gorsel: noktalar(), bag: "vizyon.html#h-galeri" },
    { sayi: yuzdeIsaret(ASP.paylar.nufus_2023), etiket: t("5.etiket"), metin: t("5.metin", { yil: DAGILIM_YILI, koltuk: koltukSayisi, asp: ASP.koltuk.toplam, afr: AFR.uye_sayisi, kat: Math.round(AFR.paylar.nufus_2023 / AFR.paylar.nufus_1963) }), gorsel: payCubuklari() + '<div class="mini-harita" id="mini-harita"></div>', bag: "temsil.html" },
    { sayi: `${sayi(gorusulen.length)} / ${sayi(G.length)}`, etiket: t("6.etiket", { ay: AY[+GK_BAS.slice(5, 7) - 1], yil: +GK_BAS.slice(0, 4) }), metin: t("6.metin", { ay: AY[+GK_BAS.slice(5, 7) - 1], yil: +GK_BAS.slice(0, 4), v: vgTartismalar.length, s: vgSozAlinan.length }), gorsel: gkKareleri(), bag: "vizyon.html#h-cizelge" },
    { sayi: vetosuz.length, etiket: t("7.etiket", { t: sayi(K.length) }), metin: t("7.metin", { dis: K.length - vetosuz.length }), gorsel: vetosuzCubuk(), bag: "simulasyon.html", bagMetni: t("7.bag") },
  ];
  const bagla = (h) => { const [s, hash] = h.split("#"); return s + ek + (hash ? "#" + hash : ""); };
  const N = ADIMLAR.length, BASLIK = t("basliklar");
  $("#adimlar").innerHTML = ADIMLAR.map((a, i) => `<section class="adim" id="adim-${i + 1}" aria-labelledby="adim-${i + 1}-baslik" tabindex="-1">
      <div class="adim-bas"><div class="adim-no" aria-hidden="true">${i + 1}<small>/ ${N}</small></div>
        <h2 class="adim-baslik" id="adim-${i + 1}-baslik"><span class="gorunmez">${esc(t("adim", { n: i + 1 }))}: </span>${esc(BASLIK[i])}</h2></div>
      <p class="istat">${typeof a.sayi === "number" ? sayi(a.sayi) : esc(a.sayi)}</p>
      <p class="istat-alt">${esc(a.etiket)}</p>
      <p class="metin">${bitisik(a.metin)}</p>
      <div class="gorsel">${a.gorsel}</div>
      ${soz(SOZLER[i])}
      <p class="ayrinti"><a href="${bagla(a.bag)}">${esc(a.bagMetni || t("ayrinti"))}</a></p>
    </section>`).join("");

  // Kapanış: 2025 hitabından alıntı (alıntı bankası, kaynaklı) ve iki düğme: bütün kayıtlar ve alıntının Söz ve Kayıt'taki yeri
  // (simülasyona 7. adımın bağlantısı götürür; sayfa listesi üst çubukta zaten var)
  const a = alintiBul("2025-1");
  $("#kapanis").innerHTML = (a ? `<blockquote lang="${DIL === "en" && a.metin_en ? "en" : "tr"}">${esc(DIL === "en" && a.metin_en ? a.metin_en : a.metin_tr)}</blockquote>
      <p class="kunye">${kunye(a)}</p>` : "")
    + `<p><a class="dugme" href="vetolar.html${ek}">${esc(t("kesfet"))}</a><a class="dugme ikincil" href="vizyon.html${ek}${a ? `#alinti-${esc(a.id)}` : ""}">${esc(t("sozKayit"))}</a></p>`;
  // Alıntının ve adım paragrafının son iki sözcüğü arasına kırılmaz boşluk: son satırda tek sözcük kalmaz
  document.querySelectorAll(".alinti blockquote, #kapanis blockquote, .adim p.metin").forEach((b) => { const n = b.lastChild; if (n && n.nodeType === 3) n.data = n.data.replace(/ (\S+)\s*$/, "\u00a0$1"); });
  // Alt bilgi: son vetonun tarihi (kayıtlardan) ve veri tarihi (veri sürümünden); kaynaklar ve yöntem "Nasıl yaptık?" bölümündedir
  const zaman = (x) => `<time datetime="${esc(x)}">${esc(tarihUzun(x))}</time>`;
  const sonVeto = K.map((k) => k.tarih).sort().pop(), surum = V.meta.veri_surumu;
  $("#alt").innerHTML = surum ? t("alt", { son: zaman(sonVeto), sonEk: sayiEki(+sonVeto.slice(0, 4), "de"), tarih: zaman(surum), tarihEk: sayiEki(+surum.slice(0, 4), "de") }) : "–";

  // İlerleme rayı: kaydırdıkça etkin adım değişir, tıklayınca adıma gider (bölüm odak alır)
  const azHareket = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const adimlar = [...document.querySelectorAll(".adim")];
  const ray = $("#ray");
  ray.setAttribute("aria-label", t("ray"));
  ray.innerHTML = adimlar.map((e, i) => `<a href="#${e.id}" title="${esc(`${i + 1}. ${BASLIK[i]}`)}" aria-label="${esc(`${t("adim", { n: i + 1 })}: ${BASLIK[i]}`)}"></a>`).join("");
  const rayBag = [...ray.querySelectorAll("a")];
  let etkin = -1;
  const etkinYap = (i, kaydirma) => {
    if (i === etkin) return;
    etkin = i;
    rayBag.forEach((a, j) => { a.classList.toggle("gecti", j < i); if (j === i) a.setAttribute("aria-current", "step"); else a.removeAttribute("aria-current"); });
  };
  rayBag.forEach((a, i) => a.addEventListener("click", (e) => {
    e.preventDefault();
    adimlar[i].scrollIntoView({ behavior: azHareket ? "auto" : "smooth", block: "start" });
    adimlar[i].focus({ preventScroll: true });
    try { history.replaceState(null, "", "#" + adimlar[i].id); } catch (_) {}  // paylaşılan adres adımı açar (tek dosyada çerçeve izin vermeyebilir)
    etkinYap(i, true);
  }));
  const ortadaki = (e) => {
    const orta = innerHeight / 2;
    let i = -1;
    adimlar.forEach((e, j) => { if (e.getBoundingClientRect().top <= orta) i = j; });
    etkinYap(i, !!e && e.type === "scroll" && scrollY > 0);
  };
  addEventListener("scroll", ortadaki, { passive: true });
  addEventListener("resize", ortadaki);
  ortadaki();

  // 5. adımın küçük haritası. Harita verisi (web/harita_veri.js, ~116 KB) Hikâye açılırken değil, adım yaklaşınca yüklenir; tek
  // dosyada üst belgedeki veri kullanılır. Yüklenemezse (internetsiz ve kayıtsız) harita çizilmez, adımın geri kalanı aynıdır.
  const miniCiz = () => {
    const H = window.HARITA_VERISI || (window.parent !== window && window.parent.HARITA_VERISI), yer = $("#mini-harita");
    if (!H || !yer || yer.firstChild) return;
    const grup = new Map(T.uyeler.map((u) => [u.iso3, u.grup])), sinif = (k) => ({ ASP: "m-asp", AFR: "m-afr" }[grup.get(k)] || "");
    const [x, y, w, h] = H.kutu;
    yer.innerHTML = `<svg viewBox="${x} ${y} ${w} ${h}" role="img" aria-label="${esc(t("5.harita", { asp: ASP.ad[DIL], afr: AFR.ad[DIL] }))}">
      ${H.alanlar.filter((a) => a.d && !a.ust).map((a) => `<path class="uye-degil" d="${a.d}"/>`).join("")}${H.uyeler.filter((u) => u.d).map((u) => `<path class="${sinif(u.k)}" d="${u.d}"/>`).join("")}
      ${H.bolgeler.filter((b) => b.d).map((b) => `<path class="${sinif(b.uye)}" d="${b.d}"/>`).join("")}${H.katmanlar.map((k) => `<path class="${sinif(k.k)}" d="${k.d}"/>`).join("")}${H.alanlar.filter((a) => a.d && a.ust).map((a) => `<path class="uye-degil" d="${a.d}"/>`).join("")}</svg>
      <p class="mini-lejant" aria-hidden="true"><span class="m-asp">${esc(ASP.ad[DIL])}</span><span class="m-afr">${esc(AFR.ad[DIL])}</span></p>`;
  };
  const miniYukle = () => {
    if (window.HARITA_VERISI || (window.parent !== window && window.parent.HARITA_VERISI)) return miniCiz();
    const b = document.createElement("script");
    b.src = "harita_veri.js"; b.onload = miniCiz;
    document.head.appendChild(b);
  };
  if ("IntersectionObserver" in window) {
    const mio = new IntersectionObserver((g) => { if (g.some((x) => x.isIntersecting)) { mio.disconnect(); miniYukle(); } }, { rootMargin: "800px 0px" });
    mio.observe($("#adim-5"));
  } else miniYukle();

  // Kaydırdıkça beliren adımlar (en fazla 300 ms); bir kez görünen adım bir daha solmaz (sınıf hiç kaldırılmaz).
  // Eşik 0: adımın ilk pikseli görününce belirir. Hızlı kaydırmada gözlemcinin kaçırdığı adımlar da görünür sayılır:
  // üst kenarı ekranın alt kenarına ulaşmış her adım. Hareket azaltma tercihinde hepsi baştan görünür, animasyon yok.
  const goster = (e) => e.classList.add("goster");
  if (azHareket || !("IntersectionObserver" in window)) {
    adimlar.forEach(goster);
  } else {
    const io = new IntersectionObserver((girdiler) => girdiler.forEach((g) => { if (g.isIntersecting) { goster(g.target); io.unobserve(g.target); } }), { threshold: 0 });
    adimlar.forEach((e) => io.observe(e));
    const gecilenler = () => adimlar.forEach((e) => { if (!e.classList.contains("goster") && e.getBoundingClientRect().top < innerHeight) { goster(e); io.unobserve(e); } });
    addEventListener("scroll", gecilenler, { passive: true });
    gecilenler();
  }
})();
</script>
</body>
