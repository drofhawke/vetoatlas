<style>
:root {
  --zemin: #FBF8F1; --yuzey: #FFFFFF; --murekkep: #13213A; --murekkep-2: #5A6578; --cizgi: #E1DBCF; --vurgu: #A4262C;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
}
:root[data-theme="dark"] {--zemin: #1C1A17; --yuzey: #272420; --murekkep: #EDE8E0; --murekkep-2: #ABA496; --cizgi: #3B3731; --vurgu: #E05A52; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--zemin); color: var(--murekkep); font-family: var(--sans); font-size: var(--yz-govde); line-height: var(--sa-govde); }
.kap { max-width: 1180px; margin: 0 auto; padding: 0 24px 64px; }
a { color: inherit; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--murekkep); outline-offset: 2px; }
[hidden] { display: none !important; }
.kutu { background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 6px; }

/* Sayfa üstü ve giriş (temel.css basamakları): üstte 48 px (dar ekranda 32 px), karşılaştırmaya 48 px */
.giris { padding: var(--b12) 0 var(--b12); }
h1 { font-family: var(--serif); font-weight: 600; font-size: var(--yz-baslik); line-height: var(--sa-baslik); margin: 0 0 16px; }
.giris p { font-family: var(--serif); font-size: var(--yz-govde); line-height: var(--sa-govde); max-width: var(--olcu-metin); margin: 0 0 12px; }
.giris p:last-child { margin-bottom: 0; }

/* Karşılaştırma, geniş ekranda tablo: ölçütler satırda, modeller sütunda (belgelerin tarih sırasıyla) */
.tablo-kap { overflow-x: auto; }
table.reform { border-collapse: collapse; width: 100%; table-layout: fixed; font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); }
.reform th, .reform td { text-align: left; padding: 16px; border-top: 1px solid var(--cizgi); vertical-align: top; }
.reform thead th { border-top: none; font: 600 var(--yz-kucuk)/var(--sa-kucuk) var(--sans); color: var(--murekkep); }
.reform thead th:first-child { color: var(--murekkep-2); }
.reform col.olcut { width: 176px; }
.reform tbody th { font-weight: 600; }
.reform small, .olcutler small { display: block; color: var(--murekkep-2); margin-top: 8px; }
/* Dar ekranda ölçüt ölçüt: her ölçütün altında dört model alt alta (aynı veri, tablo gizlenir); kutu metin sütunu
   genişliğinde (KILAVUZ bölüm 2, "Kartlar") */
.olcutler { display: none; max-width: var(--olcu-metin); }
.olcutler section { padding: 16px; }
.olcutler section + section { border-top: 1px solid var(--cizgi); }
.olcutler h2 { font-family: var(--serif); font-weight: 600; font-size: var(--yz-govde); line-height: var(--sa-govde); margin: 0; }
.olcutler dl { margin: 0; font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); }
.olcutler dt { font-weight: 600; margin: 12px 0 0; }
.olcutler dd { margin: 4px 0 0; max-width: var(--olcu); }
/* 961–1180 px: kap daralınca hücreler sıkışmasın */
@media (min-width: 961px) and (max-width: 1180px) {
  .reform th, .reform td { padding: 12px; }
  .reform col.olcut { width: 144px; }
}
@media (max-width: 960px) {
  .tablo-kap { display: none; }
  .olcutler { display: block; }
}
@media (max-width: 760px) {
  body { font-size: var(--yz-kucuk); line-height: var(--sa-kucuk); }
  .kap { padding: 0 16px 48px; }
  .giris { padding-top: var(--b8); }
}

<body data-sayfa="reform">
<header id="cubuk" class="cubuk"></header>
<div class="kap">
  <div class="giris">
    <h1 id="baslik" data-t="baslik">Reform modelleri</h1>
    <p data-t="giris">Güvenlik Konseyi reformu için dört model aynı ölçütlerle, belgelerin tarih sırasıyla. Küçük satırlar her bilginin belgedeki yerini gösterir.</p>
  </div>

  <main>
    <noscript><p>Tablo için JavaScript gerekir.</p></noscript>
    <div class="tablo-kap kutu"><table class="reform" id="reform" aria-labelledby="baslik"></table></div>
    <div class="olcutler kutu" id="olcutler"></div>
  </main>
</div>

<script src="veri.js"></script>
<script>
(function () {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const DILLER = ["tr", "en"];
  const parametre = new URLSearchParams(location.search).get("lang");
  const DIL = DILLER.includes(parametre) ? parametre : "tr";
  const SOZLUK = {
    tr: {
      sayfaBasligi: "Reform modelleri · Veto Atlası",
      sayfaAciklamasi: "Güvenlik Konseyi reformu için dört model aynı ölçütlerle: Ezulwini Uzlaşısı, G4, Uzlaşı için Birlik ve “Daha Adil Bir Dünya Mümkün”.",
      onizlemeAlt: "Veto Atlası: 1946’dan 2026’ya Güvenlik Konseyinde vetoyla düşen 266 öneri; her kare bir ret oyu, yıllara göre.",
      baslik: "Reform modelleri",
      giris: "Güvenlik Konseyi reformu için dört model aynı ölçütlerle, belgelerin tarih sırasıyla. Küçük satırlar her bilginin belgedeki yerini gösterir.",
      olcut: "Ölçüt",
      "olcut.sunan": "Kim sundu?", "olcut.esik": "Karar için gereken oy",
      "olcut.toplam": "Toplam üye sayısı", "olcut.yeni_daimi": "Yeni daimî üye var mı?", "olcut.veto": "Veto kimde?", "olcut.genel_kurul": "Genel Kurul ile ilişki",
      "model.Ezulwini Uzlaşısı": "Ezulwini Uzlaşısı ve A/59/L.67 (Afrika Birliği, Mart ve Temmuz 2005)", "model.G4": "G4 (A/59/L.64, Temmuz 2005)",
      "model.Uzlaşı için Birlik": "Uzlaşı için Birlik (A/59/L.68, Temmuz 2005)", "model.Daha Adil Bir Dünya Mümkün": "“Daha Adil Bir Dünya Mümkün” (Eylül 2021)",
      // Dar ekranda ilk ölçütten sonra kısa ad (tarih ve simge ilk ölçütte verildi)
      "modelKisa.Ezulwini Uzlaşısı": "Ezulwini Uzlaşısı", "modelKisa.G4": "G4", "modelKisa.Uzlaşı için Birlik": "Uzlaşı için Birlik",
      "modelKisa.Daha Adil Bir Dünya Mümkün": "“Daha Adil Bir Dünya Mümkün”",
    },
    en: {
      sayfaBasligi: "Reform models · Veto Atlas",
      sayfaAciklamasi: "Four models for Security Council reform on the same criteria: the Ezulwini Consensus, the G4, Uniting for Consensus and “A Fairer World is Possible” (“Daha Adil Bir Dünya Mümkün”).",
      onizlemeAlt: "Veto Atlas: 266 proposals blocked by the veto in the Security Council, 1946–2026; each square is one negative vote, by year.",
      baslik: "Reform models",
      giris: "Four models for Security Council reform, compared on the same criteria and ordered by the date of their documents. The small print under each entry shows where it appears in the document.",
      olcut: "Criterion",
      "olcut.sunan": "Put forward by", "olcut.esik": "Votes needed for a decision",
      "olcut.toplam": "Total membership", "olcut.yeni_daimi": "New permanent members?", "olcut.veto": "Who holds the veto?", "olcut.genel_kurul": "Relationship with the General Assembly",
      "model.Ezulwini Uzlaşısı": "Ezulwini Consensus and A/59/L.67 (African Union, March and July 2005)", "model.G4": "G4 (A/59/L.64, July 2005)",
      "model.Uzlaşı için Birlik": "Uniting for Consensus (A/59/L.68, July 2005)", "model.Daha Adil Bir Dünya Mümkün": "“A Fairer World is Possible” (September 2021)",
      "modelKisa.Ezulwini Uzlaşısı": "Ezulwini Consensus", "modelKisa.G4": "G4", "modelKisa.Uzlaşı için Birlik": "Uniting for Consensus",
      "modelKisa.Daha Adil Bir Dünya Mümkün": "“A Fairer World is Possible”",
      // Sayfada ilk geçiş (geniş ekranda tablo başlığı, dar ekranda ilk ölçüt): Türkçe özgün ad parantez içinde, lang="tr"
      "modelIlk.Daha Adil Bir Dünya Mümkün": '“A Fairer World is Possible” (<span lang="tr">“Daha Adil Bir Dünya Mümkün”</span>, September 2021)',
    },
  };
  const t = (a) => SOZLUK[DIL][a] ?? SOZLUK.tr[a];
  document.documentElement.lang = DIL;
  document.title = t("sayfaBasligi");
  const metaYaz = (s, d) => { const e = document.querySelector(s); if (e) e.setAttribute("content", d); };
  metaYaz('meta[name="description"]', t("sayfaAciklamasi"));
  metaYaz('meta[property="og:title"]', t("sayfaBasligi"));
  metaYaz('meta[property="og:description"]', t("sayfaAciklamasi"));
  metaYaz('meta[property="og:locale"]', DIL === "tr" ? "tr_TR" : "en_GB");
  metaYaz('meta[property="og:locale:alternate"]', DIL === "tr" ? "en_GB" : "tr_TR");
  metaYaz('meta[property="og:image:alt"]', t("onizlemeAlt"));
  metaYaz('meta[name="twitter:image:alt"]', t("onizlemeAlt"));
  document.querySelectorAll("[data-t]").forEach((e) => { e.textContent = t(e.dataset.t); });

  const V = window.VETO_VERISI;
  if (!V) return;
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const R = V.reformModelleri || [];
  // Dayanak etiketlerinin İngilizcesi (belge kodları ve paragraf numaraları değişmez); birden çok paragraf "paras."
  const dayanakEn = (s) => s.replace(/2\. Bölüm/g, "Part II").replace(/Giriş/g, "Introduction").replace(/par\. (?=[^;]* ve )/g, "paras. ")
    .replace(/par\./g, "para.").replace(/dipnot/g, "footnote").replace(/ ve /g, " and ")
    .replace(/künye sayfası/, "imprint page").replace(/başlık/g, "title");
  // Kitabın dayanak satırında "Kitap" değil kitabın adı yazar (sütun başlığıyla aynı biçimde)
  const KITAP_ADI = { tr: "“Daha Adil Bir Dünya Mümkün”", en: "“A Fairer World is Possible”" };
  const belgeAdi = (b) => (b === "Kitap" ? KITAP_ADI[DIL] : DIL === "en" ? dayanakEn(b) : b);
  const MODELLER = ["Ezulwini Uzlaşısı", "G4", "Uzlaşı için Birlik", "Daha Adil Bir Dünya Mümkün"].filter((m) => R.some((r) => r.model === m));
  const OLCUTLER = ["sunan", "toplam", "yeni_daimi", "veto", "esik", "genel_kurul"];
  // Model adı; ilk geçişte sözlükte HTML biçimi varsa o (İngilizcede kitabın Türkçe özgün adı lang="tr" ile)
  const modelAdi = (m, ilk) => (ilk && SOZLUK[DIL]["modelIlk." + m]) || esc(t("model." + m));
  // Sayı, adından ve paragrafından satır sonunda ayrılmaz (Madde 27/3, para. 5 (b), Karayipler 1, 2. Bölüm, 12 devlet);
  // aralık çizgisinin iki yanı da bölünmez (8 (g)–(i), C (e) 2–3)
  const bitisik = (s) => s.replace(/([^,;]) (?=\d|\(\w{1,3}\))/g, "$1\u00a0").replace(/(\d\.) (?=Bölüm)/g, "$1\u00a0").replace(/Part (?=II)/g, "Part\u00a0")
    .replace(/(\d) (?=\p{L}+\))/gu, "$1\u00a0").replace(/(\S)–(?=\S)/g, "$1\u2060–\u2060");
  // Alt satırdaki belge simgeleri belgeye bağlanır; kitap bağlantısız
  const BELGE = (k) => `<a href="${/^A\//.test(k) ? "https://undocs.org/" + k : "https://old.centerforunreform.org/sites/default/files/Ezulwini%20Consensus.pdf"}" target="_blank" rel="noopener">${k}</a>`;
  const bagla = (s) => s.replace(/<small>.*<\/small>/, (k) => k.replace(/A\/59\/L\.6[478]|Ext\/EX\.CL\/2\s\(VII\)/g, BELGE));
  const hucre = (m, o) => {
    const r = R.find((x) => x.model === m && x.olcut === o);
    return bagla(bitisik(`${esc(DIL === "en" ? r.en : r.tr)}<small>${esc(belgeAdi(r.belge))}, ${esc(DIL === "en" ? dayanakEn(r.dayanak) : r.dayanak)}</small>`));
  };
  // Geniş ekranda tablo; dar ekranda aynı hücreler ölçüt ölçüt alt alta (CSS hangisinin görüneceğini seçer)
  $("#reform").innerHTML = `<colgroup><col class="olcut">${MODELLER.map(() => "<col>").join("")}</colgroup>
    <thead><tr><th scope="col">${t("olcut")}</th>${MODELLER.map((m) => `<th scope="col">${modelAdi(m, true)}</th>`).join("")}</tr></thead>
    <tbody>${OLCUTLER.map((o) => `<tr><th scope="row">${t("olcut." + o)}</th>${MODELLER.map((m) => `<td>${hucre(m, o)}</td>`).join("")}</tr>`).join("")}</tbody>`;
  $("#olcutler").innerHTML = OLCUTLER.map((o, i) => `<section aria-labelledby="olcut-${o}"><h2 id="olcut-${o}">${t("olcut." + o)}</h2>
    <dl>${MODELLER.map((m) => `<dt>${i === 0 ? modelAdi(m, true) : esc(t("modelKisa." + m))}</dt><dd>${hucre(m, o)}</dd>`).join("")}</dl></section>`).join("");
})();
</script>
</body>
